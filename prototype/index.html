const fmt = (n) => n;

const statusBadge = (s) => {
  const map = { HEALTHY:'badge-green', WARNING:'badge-yellow', ERROR:'badge-red', IDLE:'badge-gray' };
  return <span className={`badge ${map[s]||'badge-gray'}`}>{s}</span>;
};

const custStatusBadge = (s) => {
  const colorMap = { ACTIVE:'badge-green', INACTIVE:'badge-gray', BLOCKED:'badge-red', MERGED:'badge-blue' };
  const labelMap = { ACTIVE:'Hoạt động', INACTIVE:'Không hoạt động', BLOCKED:'Bị khóa', MERGED:'Đã gộp' };
  return <span className={`badge ${colorMap[s]||'badge-gray'}`}>{labelMap[s]||s}</span>;
};

const GROUP_LABEL = { SME:'SME', KHL:'KHL', B2C:'Cá nhân thường' };
const CONFIDENCE_LABEL = { HIGH:'Cao', MEDIUM:'Trung bình', LOW:'Thấp' };
const ALIAS_TYPE_LABEL = { PHONE:'SĐT', POST_ID:'Post ID', CRM_ID:'Mã CRM', TAX_ID:'MST', KHL_CODE:'Mã KHL', USER_APP_ID:'ID App', EMAIL:'Email' };
const ADDR_TYPE_LABEL   = { SENDER:'Địa chỉ gửi', RECEIVER:'Địa chỉ nhận', BUSINESS:'Trụ sở', WAREHOUSE:'Kho hàng' };
const SEGMENT_RISK = ['Có nguy cơ rời bỏ','Tỷ lệ hoàn cao','Có nguy cơ gian lận'];
const SEGMENT_GREEN = ['Khách hàng trung thành','KHL giá trị cao','Chủ shop hoạt động cao'];
const segBadgeColor = (s) => SEGMENT_RISK.some(r => s.includes(r.slice(0,6))) || s.includes('rời bỏ') || s.includes('hoàn') || s.includes('gian lận') ? 'badge-red' : SEGMENT_GREEN.some(g => s.includes(g.slice(0,6))) || s.includes('trung thành') || s.includes('KHL') || s.includes('shop') ? 'badge-green' : 'badge-blue';

const lagBadge = (lag, warn) => {
  if (warn) return <span className="tabular-nums text-red-600 font-bold">{lag.toLocaleString()}</span>;
  if (lag > 1000) return <span className="tabular-nums text-yellow-600 font-semibold">{lag.toLocaleString()}</span>;
  return <span className="tabular-nums text-gray-500">{lag}</span>;
};

const scoreGauge = (val, label) => {
  let bg = '#16A34A';
  if (val >= 70) bg = '#DC2626';
  else if (val >= 40) bg = '#F59E0B';
  return (
    <div className="flex flex-col items-center gap-1">
      <div className="gauge-outer" style={{ border: `4px solid ${bg}`, color: bg }}>{val}</div>
      <div className="text-xs text-gray-500">{label}</div>
    </div>
  );
};

const rfmDot = (val) => {
  const colors = ['','#DC2626','#F59E0B','#d97706','#16A34A','#15803d'];
  return (
    <span className="inline-flex items-center gap-0.5">
      {[1,2,3,4,5].map(i => (
        <span key={i} style={{ width:10, height:10, borderRadius:'50%', background: i<=val ? colors[val] : '#e5e7eb', display:'inline-block' }}></span>
      ))}
      <span className="ml-1 font-bold tabular-nums" style={{ color: colors[val] }}>{val}</span>
    </span>
  );
};

const consentChip = (v, label) => {
  const cls = v==='in' ? 'consent-in' : v==='out' ? 'consent-out' : 'consent-unknown';
  const txt = v==='in' ? 'OPT IN' : v==='out' ? 'OPT OUT' : 'UNKNOWN';
  return <div className="flex items-center justify-between py-1.5 border-b border-gray-100 last:border-0">
    <span className="text-sm text-gray-600">{label}</span>
    <span className={`consent-chip ${cls}`}>{v==='in' ? '✓' : v==='out' ? '✕' : '?'} {txt}</span>
  </div>;
};

function CustomerListScreen({ onC360, initSegment }) {
  const [search, setSearch] = React.useState('');
  const [typeFilter, setTypeFilter] = React.useState('ALL');
  const [statusFilter, setStatusFilter] = React.useState('ALL');
  const [segmentFilter, setSegmentFilter] = React.useState(initSegment || 'ALL');

  const filtered = CUSTOMERS.filter(c => {
    const q = search.toLowerCase();
    const matchQ = !q || c.name.toLowerCase().includes(q) || c.uid.toLowerCase().includes(q) || c.phone.includes(q);
    const matchT = typeFilter === 'ALL' || c.type === typeFilter;
    const matchS = statusFilter === 'ALL' || c.status === statusFilter;
    const matchSeg = segmentFilter === 'ALL' || c.segment === segmentFilter;
    return matchQ && matchT && matchS && matchSeg;
  });

  return (
    <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
      {/* Toolbar */}
      <div className="panel" style={{ padding:16 }}>
        <div className="flex items-center gap-3 flex-wrap">
          <div className="flex items-center gap-2" style={{ background:'#F7F8FA', border:'1px solid #E5E7EB', borderRadius:8, padding:'6px 12px', flex:'1', minWidth:200 }}>
            <Icon name="search" />
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Tìm theo mã KH, tên khách hàng..." style={{ border:'none', background:'transparent', outline:'none', fontSize:13, width:'100%', padding:0 }} />
          </div>
          <select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{ fontSize:13 }}>
            <option value="ALL">Tất cả loại</option>
            <option value="INDIVIDUAL">Cá nhân</option>
            <option value="BUSINESS">Doanh nghiệp</option>
          </select>
          <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{ fontSize:13 }}>
            <option value="ALL">Tất cả trạng thái</option>
            <option value="ACTIVE">Đang hoạt động</option>
            <option value="INACTIVE">Không hoạt động</option>
          </select>
          <select value={segmentFilter} onChange={e=>setSegmentFilter(e.target.value)} style={{ fontSize:13 }}>
            <option value="ALL">Tất cả phân khúc</option>
            {SEGMENTS.map(s => <option key={s.name} value={s.name}>{s.name}</option>)}
          </select>
        </div>
      </div>

      {/* Table */}
      <div className="panel">
        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
          <thead>
            <tr style={{ borderBottom:'1px solid #E5E7EB' }}>
              {['Mã khách hàng','Tên / Công ty','Loại','Nhóm','SĐT','Tổng đơn','Doanh thu','Phân khúc','Trạng thái','Cập nhật'].map(h => (
                <th key={h} style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280', whiteSpace:'nowrap' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map((c,i) => (
              <tr key={i} className="table-row" onClick={() => onC360(c.uid)} style={{ borderBottom:'1px solid #F3F4F6' }}>
                <td style={{ padding:'10px 12px', fontFamily:'monospace', fontSize:11, color:'#6B7280' }}>{c.uid}</td>
                <td style={{ padding:'10px 12px', fontWeight:600, color:'#2563EB' }}>{c.name}</td>
                <td style={{ padding:'10px 12px' }}>
                  <span className={`badge ${c.type==='INDIVIDUAL' ? 'badge-blue':'badge-purple'}`}>{c.type==='INDIVIDUAL' ? 'Cá nhân':'Doanh nghiệp'}</span>
                </td>
                <td style={{ padding:'10px 12px' }}><span className="badge badge-gray">{c.group}</span></td>
                <td style={{ padding:'10px 12px', fontFamily:'monospace' }}>{c.phone.slice(0,3)+'***'+c.phone.slice(-3)}</td>
                <td style={{ padding:'10px 12px', textAlign:'right' }} className="tabular-nums">{c.orders.toLocaleString()}</td>
                <td style={{ padding:'10px 12px', textAlign:'right', fontWeight:600 }} className="tabular-nums">{c.revenue} ₫</td>
                <td style={{ padding:'10px 12px' }}>
                  <span className={`badge ${segBadgeColor(c.segment)}`}>{c.segment}</span>
                </td>
                <td style={{ padding:'10px 12px' }}>{custStatusBadge(c.status)}</td>
                <td style={{ padding:'10px 12px', color:'#6B7280', fontSize:12 }}>{c.updated}</td>
              </tr>
            ))}
          </tbody>
        </table>
        <div style={{ padding:'10px 16px', borderTop:'1px solid #F3F4F6', fontSize:12, color:'#6B7280' }}>
          Hiển thị {filtered.length} / {CUSTOMERS.length} khách hàng
        </div>
      </div>
    </div>
  );
}

  const confColor = (c) => c >= 90 ? '#16A34A' : c >= 75 ? '#F59E0B' : '#DC2626';
  const confBg    = (c) => c >= 90 ? '#dcfce7' : c >= 75 ? '#fef9c3' : '#fee2e2';

    { key:'name',    label:'Họ tên / Tên DN' },

    { key:'orders',  label:'Tổng đơn' },

  const openGroup = (g) => {
    setSelectedGroup(g);
    setSelectedSources(g.profiles.slice(0,3).map(p=>p.uid));
    setCompareView(false);

  const toggleSource = (uid) => {
    setSelectedSources(prev =>
      prev.includes(uid) ? prev.filter(u => u !== uid) : [...prev, uid]

  const handleDecision = (type) => {
    setDecisions(d => ({ ...d, [selectedGroup.id]: type }));

                    <th key={h} style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280' }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {UNMERGE_REQUESTS.map(r => (
                  <tr key={r.id} style={{ borderBottom:'1px solid #F3F4F6' }}>
                    <td style={{ padding:'10px 12px', fontFamily:'monospace', fontSize:12 }}>{r.id}</td>
                    <td style={{ padding:'10px 12px', fontSize:12, color:'#2563EB', fontFamily:'monospace' }}>{r.uidMaster}</td>
                    <td style={{ padding:'10px 12px', fontSize:12, color:'#6B7280' }}>{r.reporter}</td>
                    <td style={{ padding:'10px 12px', fontSize:12, color:'#6B7280', whiteSpace:'nowrap' }}>{r.reportedAt}</td>
                    <td style={{ padding:'10px 12px', fontSize:12, maxWidth:260 }}>{r.reason}</td>
                    <td style={{ padding:'10px 12px' }}><span className="badge badge-yellow">{r.status}</span></td>
                    <td style={{ padding:'10px 12px' }}>

                        <button style={{ padding:'5px 10px', background:'#f3f4f6', color:'#6B7280', border:'none', borderRadius:6, fontSize:12, cursor:'pointer' }}>Từ chối</button>

                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

  // ── TẦNG 2: Chi tiết nhóm (card grid đầy đủ + bảng so sánh) ──
  const compareCols = selectedGroup.profiles.filter(p => selectedSources.includes(p.uid));

  // Kiểm tra field có conflict trong nhóm đang chọn không
  const hasConflict = (fieldKey) => {
    const vals = compareCols.map(p => String(p[fieldKey]||'—').toLowerCase().trim());
    const filled = vals.filter(v => v !== '—' && v !== '');
    return filled.length > 1 && new Set(filled).size > 1;
  };

  return (
    <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
      {modal && (
        <div className="modal-overlay" onClick={() => setModal(null)}>

            <div style={{ fontSize:13, color:'#6B7280', marginBottom:16 }}>

              {modal==='different' && 'Nhóm này sẽ được đánh dấu tách và không xuất hiện lại.'}

              Đóng
            </button>
          </div>
        </div>
      )}

      <div className="flex items-center gap-2">
        <button onClick={() => setSelectedGroup(null)} style={{ background:'#f3f4f6', border:'none', borderRadius:6, padding:'6px 12px', fontSize:13, cursor:'pointer' }}>← Danh sách nhóm</button>
        <span style={{ color:'#6B7280', fontSize:13 }}>/</span>
        <span style={{ fontWeight:700, fontSize:14 }}>{selectedGroup.id}</span>
        <span className="badge badge-yellow" style={{ marginLeft:4 }}>PENDING</span>
        {selectedGroup.warn && <span className="badge badge-red">⚠️ Có conflict</span>}
      </div>

      {/* Toggle tầng 1/2 */}
      <div className="flex gap-2">
        <button onClick={() => setCompareView(false)}
          className={`tab-btn ${!compareView ? 'active':''}`}>📋 Tổng quan nguồn</button>
        <button onClick={() => setCompareView(true)}
          className={`tab-btn ${compareView ? 'active':''}`}>🔍 So sánh chi tiết</button>
      </div>

      {/* ── TẦNG 1: Card grid tổng quan ── */}
      {!compareView && (
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          <div style={{ fontSize:12, color:'#6B7280' }}>
            Khóa trùng: <strong>{selectedGroup.matchKey}</strong> · {selectedGroup.profiles.length} hồ sơ từ {selectedGroup.profiles.length} nguồn
          </div>

          {/* Cards */}
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(200px, 1fr))', gap:12 }}>
            {selectedGroup.profiles.map(p => (
              <div key={p.uid} style={{ border:`2px solid ${confColor(p.confidence)}22`, borderRadius:10, padding:14, background:'white', position:'relative' }}>

                <div className="flex items-center justify-between mb-2">
                  <span style={{ fontSize:11, fontWeight:700, color:'white', background: p.confidence>=90 ? '#16A34A' : p.confidence>=75 ? '#F59E0B':'#DC2626', padding:'2px 8px', borderRadius:4 }}>
                    {p.source}
                  </span>
                  <span style={{ fontSize:12, fontWeight:800, color:confColor(p.confidence) }}>{p.confidence}%</span>
                </div>
                {/* UID */}
                <div style={{ fontSize:10, color:'#6B7280', fontFamily:'monospace', marginBottom:6 }}>{p.uid}</div>
                {/* Fields */}
                {[
                  { label:'Tên',    val:p.name },
                  { label:'SĐT',    val:p.phone },
                  { label:'Email',  val:p.email },
                  { label:'Địa chỉ',val:p.address },
                  { label:'Vai trò',val:p.role },
                  { label:'Đơn',    val:p.orders > 0 ? p.orders.toLocaleString() : '—' },
                ].map(f => (
                  <div key={f.label} style={{ display:'flex', justifyContent:'space-between', padding:'3px 0', borderBottom:'1px solid #F3F4F6' }}>
                    <span style={{ fontSize:11, color:'#9CA3AF' }}>{f.label}</span>
                    <span style={{ fontSize:11, fontWeight:500, color: f.val==='—' ? '#D1D5DB':'#1A1A1A', maxWidth:110, textAlign:'right', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{f.val}</span>
                  </div>
                ))}
                {/* Confidence bar */}
                <div style={{ marginTop:10, height:4, borderRadius:2, background:'#E5E7EB' }}>
                  <div style={{ width:`${p.confidence}%`, height:'100%', borderRadius:2, background:confColor(p.confidence) }}></div>
                </div>
              </div>
            ))}
          </div>

          {/* Conflict summary */}
          {selectedGroup.conflicts.length > 0 && (
            <div style={{ padding:12, background:'#FFFBEB', border:'1px solid #F59E0B', borderRadius:8 }}>
              <div style={{ fontSize:12, fontWeight:700, color:'#d97706', marginBottom:6 }}>⚠️ Conflict phát hiện</div>
              {selectedGroup.conflicts.map((c,i) => <div key={i} style={{ fontSize:12, color:'#92400E' }}>• {c}</div>)}
            </div>
          )}

          <div style={{ fontSize:12, color:'#6B7280' }}>
            Muốn so sánh field-by-field? Chọn tab <strong>So sánh chi tiết</strong> và chọn các nguồn cần xem.
          </div>
        </div>
      )}

      {/* ── TẦNG 2: Bảng so sánh chi tiết ── */}
      {compareView && (
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          {/* Chọn nguồn để so sánh */}
          <div style={{ padding:12, background:'#F7F8FA', borderRadius:8, border:'1px solid #E5E7EB' }}>
            <div style={{ fontSize:12, fontWeight:600, marginBottom:8 }}>Chọn nguồn để so sánh:</div>
            <div className="flex gap-2 flex-wrap">
              {selectedGroup.profiles.map(p => (
                <button key={p.uid} onClick={() => toggleSource(p.uid)}
                  style={{ padding:'5px 12px', borderRadius:6, fontSize:12, fontWeight:600, cursor:'pointer', border:`2px solid ${selectedSources.includes(p.uid) ? confColor(p.confidence) : '#E5E7EB'}`, background: selectedSources.includes(p.uid) ? confBg(p.confidence) : 'white', color: selectedSources.includes(p.uid) ? confColor(p.confidence) : '#6B7280' }}>
                  {p.source} ({p.confidence}%)
                </button>
              ))}
            </div>
          </div>

          {/* Bảng so sánh */}
          <div className="panel" style={{ overflow:'auto' }}>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
              <thead>
                <tr style={{ borderBottom:'1px solid #E5E7EB', background:'#F7F8FA' }}>
                  <th style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280', width:120, position:'sticky', left:0, background:'#F7F8FA' }}>Trường</th>
                  {compareCols.map(p => (
                    <th key={p.uid} style={{ padding:'10px 12px', fontSize:11, fontWeight:700, minWidth:160 }}>
                      <div style={{ color:confColor(p.confidence) }}>{p.source}</div>
                      <div style={{ fontFamily:'monospace', fontWeight:400, color:'#6B7280', fontSize:10 }}>{p.uid}</div>
                      <div style={{ marginTop:4, height:3, borderRadius:2, background:'#E5E7EB' }}>
                        <div style={{ width:`${p.confidence}%`, height:'100%', borderRadius:2, background:confColor(p.confidence) }}></div>
                      </div>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {COMPARE_FIELDS.map(f => {
                  const conflict = hasConflict(f.key);
                  return (
                    <tr key={f.key} style={{ borderBottom:'1px solid #F3F4F6', background: conflict ? '#FFFBEB':'white' }}>
                      <td style={{ padding:'9px 12px', fontWeight:600, color:'#6B7280', fontSize:12, position:'sticky', left:0, background: conflict ? '#FFFBEB':'white' }}>
                        {conflict && <span style={{ color:'#d97706', marginRight:4 }}>⚠️</span>}
                        {f.label}
                      </td>
                      {compareCols.map(p => {
                        const val = String(p[f.key]||'—');
                        const isEmpty = val === '—' || val === '';
                        return (
                          <td key={p.uid} style={{ padding:'9px 12px', color: isEmpty ? '#D1D5DB':'#1A1A1A', fontStyle: isEmpty ? 'italic':'' }}>
                            {!isEmpty && conflict && <span style={{ color:'#16A34A', marginRight:4 }}>•</span>}
                            {val}
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* Nút quyết định */}
      <div style={{ padding:16, background:'#F7F8FA', borderRadius:8, border:'1px solid #E5E7EB' }}>
        <div style={{ fontSize:12, color:'#6B7280', marginBottom:12 }}>
          Quyết định của bạn được ghi nhận và BE xử lý merge. BE tự chọn Hồ sơ chuẩn master và ưu tiên field theo rule nguồn dữ liệu.
        </div>
        <div className="flex gap-3">
          <button onClick={() => handleDecision('confirmed')}
            style={{ flex:2, padding:'11px', background:'#16A34A', color:'white', border:'none', borderRadius:8, fontSize:14, fontWeight:700, cursor:'pointer' }}>
            ✓ Cùng người — Xác nhận merge {selectedGroup.profiles.length} hồ sơ
          </button>
          <button onClick={() => handleDecision('different')}
            style={{ flex:2, padding:'11px', background:'#f3f4f6', color:'#1A1A1A', border:'none', borderRadius:8, fontSize:14, fontWeight:600, cursor:'pointer' }}>
            ✗ Tách nhóm — Không phải cùng người
          </button>
          <button onClick={() => handleDecision('later')}
            style={{ flex:1, padding:'11px', background:'#f3f4f6', color:'#6B7280', border:'none', borderRadius:8, fontSize:13, cursor:'pointer' }}>
            Để sau
          </button>
        </div>
      </div>
    </div>
  );
}

              <button onClick={() => setTab('mergehist')} style={{ padding:'6px 14px', background:'#2563EB', color:'white', border:'none', borderRadius:6, fontSize:12, fontWeight:600, cursor:'pointer', flexShrink:0, marginLeft:12 }}>
                → Xem Hồ sơ đa nguồn
              </button>
            </div>

          </div>
        )}

        {/* HỒ SƠ ĐA NGUỒN */}
        {tab==='mergehist' && (() => {
          const sources = kh.sourcesData || [];
          const confColor = (c) => c >= 90 ? '#16A34A' : c >= 75 ? '#F59E0B' : '#DC2626';
          const confBg    = (c) => c >= 90 ? '#dcfce7' : c >= 75 ? '#fef9c3' : '#fee2e2';

          const FIELD_GROUPS = [
            {
              group: 'Định danh',
              fields: [
                { key:'ten',      label:'Họ tên / Tên DN',  golden: kh.name },
                { key:'sdt',      label:'Số điện thoại',    golden: kh.phone },
                { key:'email',    label:'Email',             golden: kh.email },
                { key:'cccd',     label:'CCCD / MST',        golden: kh.cccd || kh.taxId || '—' },
                { key:'gioiTinh', label:'Giới tính',         golden: kh.gender || '—' },
                { key:'ngaySinh', label:'Ngày sinh',         golden: kh.birthDate || '—' },
                { key:'postId',   label:'PostID',            golden: kh.postId || '—' },
              ],
              dataKey: 'dinh_danh',
            },
            {
              group: 'Địa chỉ',
              fields: [
                { key:'guiHang',  label:'Địa chỉ gửi hàng',  golden: kh.addresses?.find(a=>a.type==='SENDER'&&a.primary)?.detail + ', ' + kh.addresses?.find(a=>a.type==='SENDER'&&a.primary)?.province || '—' },
                { key:'nhanHang', label:'Địa chỉ nhận hàng', golden: kh.addresses?.find(a=>a.type==='RECEIVER')?.detail + ', ' + kh.addresses?.find(a=>a.type==='RECEIVER')?.province || '—' },
                { key:'vpostcode',label:'VPostCode',          golden: kh.addresses?.find(a=>a.primary)?.vpostcode || '—' },
              ],
              dataKey: 'dia_chi',
            },
            {
              group: 'Vai trò & Giao dịch',
              fields: [
                { key:'vaiTro',   label:'Vai trò chính',   golden: kh.primaryRole || '—' },
                { key:'tongDon',  label:'Tổng đơn',         golden: String(kh.orders?.toLocaleString() || '—') },
                { key:'doanhThu', label:'Doanh thu',        golden: kh.revenue || '—' },
                { key:'tyLeHoan', label:'Tỷ lệ hoàn',      golden: kh.returnRate ? kh.returnRate + '%' : '—' },
                { key:'cod',      label:'COD thu được',     golden: kh.cod?.collected || '—' },
              ],
              dataKey: 'giao_dich',
            },
            {
              group: 'Hành vi số',
              fields: [
                { key:'appLogin',    label:'Đăng nhập App gần nhất', golden: kh.appLogin || '—' },
                { key:'device',      label:'Thiết bị',               golden: kh.device || '—' },
                { key:'sessions30d', label:'Sessions 30 ngày',       golden: kh.sessions30d != null ? String(kh.sessions30d) : '—' },
              ],
              dataKey: 'hanh_vi',
            },
            {
              group: 'Tài chính / Hợp đồng',
              fields: [
                { key:'mst',     label:'Mã số thuế',  golden: kh.taxId || '—' },
                { key:'hopDong', label:'Hợp đồng',    golden: kh.contract ? `${kh.contract.status} — ${kh.contract.start} → ${kh.contract.end}` : '—' },
                { key:'congNo',  label:'Công nợ',     golden: kh.debt ? `${kh.debt.unpaid} (${kh.debt.status})` : '—' },
              ],
              dataKey: 'tai_chinh',
            },
          ];

          const getVal = (src, groupKey, fieldKey) => {
            const g = src[groupKey] || {};
            const v = g[fieldKey];
            if (v === null || v === undefined) return '—';
            return String(v);
          };

          const isAbsent = (v) => !v || v === '—' || v === 'null' || v === 'undefined';

          const hasConflict = (golden, srcVal) => {
            if (isAbsent(golden) || isAbsent(srcVal)) return false;
            return golden.toLowerCase().trim() !== srcVal.toLowerCase().trim();
          };

          if (sources.length === 0) {
            return <div style={{ padding:32, textAlign:'center', color:'#6B7280' }}>Chưa có dữ liệu nguồn</div>;
          }

          return (
            <div style={{ display:'flex', flexDirection:'column', gap:20 }}>

              {/* Toggle so sánh / timeline */}
              <div className="flex gap-2">
                <button onClick={() => setSourceTab('compare')} className={`tab-btn ${sourceTab==='compare' ? 'active':''}`}>🔍 So sánh chi tiết</button>
                <button onClick={() => setSourceTab('timeline')} className={`tab-btn ${sourceTab==='timeline' ? 'active':''}`}>📅 Timeline gộp hồ sơ</button>
              </div>

              {/* TẦNG 2 — Bảng so sánh tất tần tật */}
              {sourceTab === 'compare' && (
                <div style={{ overflow:'auto', borderRadius:10, border:'1px solid #E5E7EB' }}>
                  <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12, minWidth: 200 + sources.length * 180 }}>
                    <thead>
                      <tr style={{ background:'#F7F8FA', borderBottom:'2px solid #E5E7EB' }}>
                        <th style={{ padding:'10px 14px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280', width:160, position:'sticky', left:0, background:'#F7F8FA', zIndex:2 }}>Trường dữ liệu</th>
                        {/* Hồ sơ chuẩn */}
                        <th style={{ padding:'10px 14px', minWidth:180, textAlign:'left' }}>
                          <div style={{ fontSize:11, fontWeight:700, color:'white', background:'#16A34A', display:'inline-block', padding:'2px 8px', borderRadius:4, marginBottom:2 }}>✦ Hồ sơ chuẩn</div>
                          <div style={{ fontSize:10, color:'#6B7280', fontFamily:'monospace' }}>{kh.uid}</div>
                        </th>
                        {sources.map((s,i) => (
                          <th key={i} style={{ padding:'10px 14px', minWidth:180, textAlign:'left' }}>
                            <div style={{ fontSize:11, fontWeight:700, color:'white', background:confColor(s.confidence), display:'inline-block', padding:'2px 8px', borderRadius:4, marginBottom:2 }}>{s.source}</div>
                            <div style={{ fontSize:10, color:'#6B7280', fontFamily:'monospace' }}>{s.sourceId}</div>
                            <div style={{ marginTop:4, height:3, borderRadius:2, background:'#E5E7EB' }}>
                              <div style={{ width:`${s.confidence}%`, height:'100%', borderRadius:2, background:confColor(s.confidence) }}></div>
                            </div>
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {FIELD_GROUPS.map((fg, gi) => (
                        <React.Fragment key={gi}>
                          {/* Group header */}
                          <tr style={{ background:'#F0F4FF' }}>
                            <td colSpan={2 + sources.length} style={{ padding:'7px 14px', fontSize:11, fontWeight:700, color:'#2563EB', letterSpacing:'0.4px', position:'sticky', left:0 }}>
                              {fg.group.toUpperCase()}
                            </td>
                          </tr>
                          {fg.fields.map((f, fi) => {
                            const goldenVal = String(f.golden || '—');
                            const srcVals = sources.map(s => getVal(s, fg.dataKey, f.key));
                            const anyConflict = srcVals.some(v => hasConflict(goldenVal, v));
                            return (
                              <tr key={fi} style={{ borderBottom:'1px solid #F3F4F6', background: anyConflict ? '#FFFBEB' : 'white' }}>
                                <td style={{ padding:'9px 14px', fontWeight:600, color:'#6B7280', fontSize:11, position:'sticky', left:0, background: anyConflict ? '#FFFBEB' : 'white', whiteSpace:'nowrap' }}>
                                  {anyConflict && <span style={{ color:'#d97706', marginRight:4 }}>⚠️</span>}
                                  {f.label}
                                </td>
                                {/* Hồ sơ chuẩn */}
                                <td style={{ padding:'9px 14px', background:'#f0fdf4', borderLeft:'3px solid #16A34A', fontWeight:500, color: isAbsent(goldenVal) ? '#D1D5DB' : '#1A1A1A', fontStyle: isAbsent(goldenVal) ? 'italic':'normal' }}>
                                  {goldenVal}
                                </td>
                                {/* Nguồn */}
                                {srcVals.map((v, si) => {
                                  const conflict = hasConflict(goldenVal, v);
                                  const absent = isAbsent(v);
                                  return (
                                    <td key={si} style={{ padding:'9px 14px', background: conflict ? '#FFFBEB' : absent ? '#FAFAFA' : 'white', color: conflict ? '#d97706' : absent ? '#D1D5DB' : '#1A1A1A', fontStyle: absent ? 'italic':'normal' }}>
                                      {absent ? <span style={{ fontSize:11 }}>Không có</span> : v}
                                      {conflict && <span className="badge badge-yellow" style={{ marginLeft:6, fontSize:10 }}>Khác biệt</span>}
                                    </td>
                                  );
                                })}
                              </tr>
                            );
                          })}
                        </React.Fragment>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {/* TẦNG 3 — Timeline */}
              {sourceTab === 'timeline' && (
                <div style={{ display:'flex', flexDirection:'column', gap:0 }}>
                  <div style={{ fontSize:12, color:'#6B7280', marginBottom:12 }}>
                    Thứ tự các hệ thống nguồn được CDP nhận diện và gộp vào Hồ sơ chuẩn.
                  </div>
                  {/* Hồ sơ chuẩn — điểm cuối */}
                  <div style={{ display:'flex', gap:16, alignItems:'flex-start', paddingBottom:16 }}>
                    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:0 }}>
                      <div style={{ width:14, height:14, borderRadius:50, background:'#16A34A', border:'3px solid white', boxShadow:'0 0 0 2px #16A34A', flexShrink:0 }}></div>
                      <div style={{ width:2, height:40, background:'#E5E7EB' }}></div>
                    </div>
                    <div style={{ paddingTop:0 }}>
                      <div style={{ fontWeight:700, fontSize:13, color:'#16A34A' }}>✦ Hồ sơ chuẩn tạo thành</div>
                      <div style={{ fontSize:11, color:'#6B7280', fontFamily:'monospace' }}>{kh.uid}</div>
                      <div style={{ fontSize:11, color:'#6B7280', marginTop:2 }}>Tổng hợp từ {sources.length} nguồn · Hoàn chỉnh {kh.completeness}%</div>
                    </div>
                  </div>
                  {[...sources].sort((a,b) => new Date(b.mergedAt.split(' ')[0].split('/').reverse().join('-')) - new Date(a.mergedAt.split(' ')[0].split('/').reverse().join('-'))).map((s, i, arr) => (
                    <div key={i} style={{ display:'flex', gap:16, alignItems:'flex-start', paddingBottom: i < arr.length-1 ? 16 : 0 }}>
                      <div style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
                        <div style={{ width:12, height:12, borderRadius:50, background:confColor(s.confidence), flexShrink:0 }}></div>
                        {i < arr.length-1 && <div style={{ width:2, flex:1, minHeight:32, background:'#E5E7EB' }}></div>}
                      </div>
                      <div style={{ flex:1, paddingBottom: i < arr.length-1 ? 0:0 }}>
                        <div className="flex items-center gap-2 flex-wrap">
                          <span style={{ fontWeight:700, fontSize:13 }}>{s.source}</span>
                          <span style={{ fontFamily:'monospace', fontSize:11, color:'#7c3aed' }}>{s.sourceId}</span>
                          <span style={{ fontSize:12, fontWeight:700, color:confColor(s.confidence) }}>{s.confidence}%</span>
                          {s.note && <span className="badge badge-yellow" style={{ fontSize:10 }}>⚠️ {s.note}</span>}
                        </div>
                        <div style={{ fontSize:11, color:'#6B7280', marginTop:2 }}>
                          Khóa trùng: <strong>{s.matchKey}</strong> · Gộp lúc {s.mergedAt}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

            </div>
          );
        })()}

        {/* ĐỊA CHỈ */}
        {tab==='address' && (
          <div>
            <div className="section-title">Địa chỉ gửi hàng</div>
            {kh.addresses.filter(a => a.type === 'SENDER').map((a,i) => (
              <div key={i} style={{ padding:14, border:'1px solid #E5E7EB', borderRadius:8, marginBottom:10 }}>
                <div className="flex items-center gap-2 mb-2">
                  {a.primary && <span className="badge badge-green">Chính</span>}
                </div>
                <div style={{ fontWeight:600, fontSize:14 }}>{a.detail}, {a.ward}, {a.province}</div>
                <div style={{ fontSize:12, color:'#6B7280', marginTop:4 }}>VPostCode: {a.vpostcode}</div>
              </div>
            ))}
          </div>
        )}

        {/* DOANH NGHIỆP */}
        {tab==='business' && kh.type==='BUSINESS' && (
          <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
            {/* Row 1: Thông tin DN + Người liên hệ */}
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }}>
              <div>
                <div className="section-title">Thông tin doanh nghiệp</div>
                {[
                  ['Mã số thuế', kh.taxId],
                  ['Mã KHL', kh.khlCode],
                  ['Đại diện pháp lý', kh.representative],
                  ['Hợp đồng', kh.contract?.status],
                  ['Hiệu lực', `${kh.contract?.start} → ${kh.contract?.end}`],
                  ['Ngành nghề', kh.contract?.segment],
                ].map(([l,v]) => (
                  <div key={l} style={{ display:'flex', justifyContent:'space-between', padding:'7px 0', borderBottom:'1px solid #F3F4F6' }}>
                    <span className="field-label" style={{ margin:0 }}>{l}</span>
                    <span style={{ fontSize:13, fontWeight:500 }}>{v}</span>
                  </div>
                ))}
              </div>
              <div>
                <div className="section-title">Người liên hệ</div>
                {kh.contacts?.map((c,i) => (
                  <div key={i} style={{ padding:12, border:'1px solid #E5E7EB', borderRadius:8, marginBottom:8 }}>
                    <div className="flex items-center gap-2">
                      <span style={{ fontWeight:600 }}>{c.name}</span>
                      {c.primary && <span className="badge badge-green">Chính</span>}
                    </div>
                    <div style={{ fontSize:12, color:'#6B7280' }}>{c.role}</div>
                    <div style={{ fontSize:12, fontFamily:'monospace', marginTop:4 }}>{c.phone} · {c.email}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Row 2: Công nợ hiện tại */}
            {kh.debt && (
              <div>
                <div className="section-title">Công nợ hiện tại</div>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12 }}>
                  {[
                    { label:'Chưa thanh toán', value:kh.debt.unpaid+' ₫', color:'#DC2626' },
                    { label:'Hạn thanh toán',  value:kh.debt.dueDate,     color:'#1A1A1A' },
                    { label:'Quá hạn',         value:kh.debt.overdue+' ₫', color: kh.debt.overdueDays>0 ? '#DC2626':'#16A34A' },
                    { label:'Số ngày quá hạn', value: kh.debt.overdueDays>0 ? `${kh.debt.overdueDays} ngày`:'—', color: kh.debt.overdueDays>0 ? '#DC2626':'#16A34A' },
                  ].map((k,i) => (
                    <div key={i} className="kpi-card">
                      <div style={{ fontSize:11, color:'#6B7280', marginBottom:4 }}>{k.label}</div>
                      <div style={{ fontSize:15, fontWeight:800, color:k.color }} className="tabular-nums">{k.value}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Row 3: Lịch sử đối soát COD theo tháng */}
            {kh.codHistory && (
              <div>
                <div className="section-title">Lịch sử đối soát COD theo tháng</div>
                <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
                  <thead>
                    <tr style={{ borderBottom:'1px solid #E5E7EB', background:'#F7F8FA' }}>
                      {['Tháng','Tổng COD','Đã thu','Còn lại','Trạng thái'].map(h => (
                        <th key={h} style={{ padding:'9px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280' }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {kh.codHistory.map((r,i) => (
                      <tr key={i} style={{ borderBottom:'1px solid #F3F4F6' }}>
                        <td style={{ padding:'9px 12px', fontWeight:600 }}>{r.month}</td>
                        <td style={{ padding:'9px 12px' }} className="tabular-nums">{r.total} ₫</td>
                        <td style={{ padding:'9px 12px', color:'#16A34A' }} className="tabular-nums">{r.collected} ₫</td>
                        <td style={{ padding:'9px 12px', color: r.status==='DISCREPANCY' ? '#DC2626':'#6B7280' }} className="tabular-nums">{r.pending} ₫</td>
                        <td style={{ padding:'9px 12px' }}>
                          <span className={`badge ${r.status==='MATCHED' ? 'badge-green':'badge-red'}`}>
                            {r.status==='MATCHED' ? 'Khớp':'Chênh lệch'}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}

        {/* GIAO DỊCH & COD */}
        {tab==='transaction' && (
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }}>
            <div>
              <div className="section-title">Tổng hợp giao dịch</div>
              {[
                ['Tổng đơn', kh.orders.toLocaleString()],
                ['Tổng doanh thu', `${kh.revenue} ₫`],
                ['Trung bình đơn/tháng', kh.avgMonthly],
                ['Dịch vụ chính', kh.service || 'Chưa có dữ liệu'],
                ['Tỷ lệ phát thành công', `${kh.deliveryRate}%`],
                ['Tỷ lệ hoàn', `${kh.returnRate}%`],
              ].map(([l,v]) => (
                <div key={l} style={{ display:'flex', justifyContent:'space-between', padding:'7px 0', borderBottom:'1px solid #F3F4F6' }}>
                  <span className="field-label" style={{ margin:0 }}>{l}</span>
                  <span style={{ fontSize:13, fontWeight:600 }} className="tabular-nums">{v}</span>
                </div>
              ))}
            </div>
            <div>
              <div className="section-title">COD — Thu hộ</div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:12 }}>
                <div style={{ background:'#f0fdf4', borderRadius:8, padding:12 }}>
                  <div style={{ fontSize:11, color:'#6B7280' }}>Tổng COD</div>
                  <div style={{ fontSize:15, fontWeight:800, color:'#1A1A1A' }} className="tabular-nums">{kh.cod.total} ₫</div>
                </div>
                <div style={{ background:'#eff6ff', borderRadius:8, padding:12 }}>
                  <div style={{ fontSize:11, color:'#6B7280' }}>Đã thu</div>
                  <div style={{ fontSize:15, fontWeight:800, color:'#2563EB' }} className="tabular-nums">{kh.cod.collected} ₫</div>
                </div>
                <div style={{ background: parseFloat(kh.cod.pending.replace(/\./g,''))>0 ? '#fff5f5':'#f9fafb', borderRadius:8, padding:12 }}>
                  <div style={{ fontSize:11, color:'#6B7280' }}>Chưa thu</div>
                  <div style={{ fontSize:15, fontWeight:800, color: parseFloat(kh.cod.pending.replace(/\./g,''))>0 ? '#DC2626':'#1A1A1A' }} className="tabular-nums">{kh.cod.pending} ₫</div>
                </div>
                <div style={{ padding:12, borderRadius:8, background: kh.cod.status==='MATCHED' ? '#f0fdf4' : kh.cod.status==='DISCREPANCY' ? '#fff5f5' : '#fffbeb' }}>
                  <div style={{ fontSize:11, color:'#6B7280' }}>Đối soát</div>
                  <span className={`badge ${kh.cod.status==='MATCHED' ? 'badge-green' : kh.cod.status==='DISCREPANCY' ? 'badge-red' : 'badge-yellow'}`}>{kh.cod.status==='MATCHED' ? 'Khớp' : kh.cod.status==='DISCREPANCY' ? 'Chênh lệch' : kh.cod.status}</span>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* HÀNH VI SỐ */}
        {tab==='behavior' && (
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }}>
            <div>
              <div className="section-title">Thông tin thiết bị & App</div>
              {[
                ['Lần đăng nhập cuối', kh.appLogin],
                ['Thiết bị', kh.device],
                ['Phiên/30 ngày', kh.sessions30d ?? 'Chưa có dữ liệu'],

                <div key={l} style={{ display:'flex', justifyContent:'space-between', padding:'7px 0', borderBottom:'1px solid #F3F4F6' }}>
                  <span className="field-label" style={{ margin:0 }}>{l}</span>
                  <span style={{ fontSize:13, fontWeight:500 }}>{v}</span>
                </div>
              ))}
              {kh.lastOrder && (
                <div style={{ marginTop:16 }}>
                  <div className="section-title">Đơn hàng gần nhất</div>

                    ['Mã đơn', kh.lastOrder.id],
                    ['Loại dịch vụ', kh.lastOrder.type],
                    ['Giá trị', `${kh.lastOrder.amount} ₫`],
                    ['Ngày tạo', kh.lastOrder.date],

            </div>
            <div>
              <div className="section-title">Timeline sự kiện</div>
              <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                {kh.timeline.map((e,i) => (
                  <div key={i} className="flex gap-3">
                    <div style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
                      <div className="timeline-dot" style={{ background:e.color, marginTop:2 }}></div>
                      {i<kh.timeline.length-1 && <div style={{ width:2, flex:1, background:'#E5E7EB', minHeight:20 }}></div>}
                    </div>
                    <div style={{ paddingBottom:10 }}>
                      <div style={{ fontSize:12, color:'#6B7280' }}>{e.time} · {e.channel}</div>
                      <div style={{ fontSize:13, fontWeight:600, color:'#1A1A1A' }}>{e.icon} {e.label}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* CSKH */}
        {tab==='cskh' && (
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12 }}>
            {[
              { label:'Tổng khiếu nại', value:kh.complaints.total, color:'#1A1A1A' },
              { label:'Đang mở', value:kh.complaints.open, color: kh.complaints.open>0 ? '#DC2626' : '#16A34A' },
              { label:'Điểm hài lòng', value:`${kh.complaints.satisfaction}/5`, color: kh.complaints.satisfaction>=4 ? '#16A34A' : kh.complaints.satisfaction>=3 ? '#F59E0B' : '#DC2626' },
              { label:'SLA đúng hạn', value:`${kh.complaints.sla}%`, color: kh.complaints.sla>=90 ? '#16A34A' : '#F59E0B' },
            ].map((k,i) => (
              <div key={i} className="kpi-card" style={{ textAlign:'center' }}>
                <div style={{ fontSize:28, fontWeight:800, color:k.color }} className="tabular-nums">{k.value}</div>
                <div style={{ fontSize:12, color:'#6B7280', marginTop:4 }}>{k.label}</div>
              </div>
            ))}
          </div>
        )}

        {/* ĐIỂM SỐ */}
        {tab==='scores' && (
          <div>
            <div className="flex items-center justify-between mb-4">
              <div className="section-title" style={{ margin:0 }}>Điểm số & Phân khúc (vai trò: {role})</div>
              <div style={{ fontSize:12, color:'#6B7280' }}>Cập nhật: {kh.scores.updatedAt}</div>
            </div>

            {/* RFM */}
            {canSee('rfm') ? (
              <div style={{ padding:16, border:'1px solid #E5E7EB', borderRadius:8, marginBottom:16 }}>
                <div style={{ fontWeight:700, fontSize:13, marginBottom:10 }}>RFM — Nhóm: <span style={{ color:'#E30613' }}>{kh.scores.rfmGroup}</span></div>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12 }}>
                  {[['R — Recency',kh.scores.rfmR],['F — Frequency',kh.scores.rfmF],['M — Monetary',kh.scores.rfmM]].map(([l,v]) => (
                    <div key={l}>
                      <div style={{ fontSize:11, color:'#6B7280', marginBottom:4 }}>{l}</div>
                      {rfmDot(v)}
                    </div>
                  ))}
                </div>
              </div>
            ) : <div style={{ padding:12, background:'#f3f4f6', borderRadius:8, marginBottom:16, color:'#6B7280', fontSize:13 }}>🔒 Vai trò {role} không có quyền xem RFM</div>}

            {/* CLV */}
            {canSee('clv') ? (
              <div style={{ padding:14, border:'1px solid #E5E7EB', borderRadius:8, marginBottom:12, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                <div>
                  <div style={{ fontSize:11, color:'#6B7280' }}>CLV — Giá trị vòng đời ước tính</div>
                  <div style={{ fontSize:20, fontWeight:800, color:'#16A34A' }} className="tabular-nums">{kh.scores.clv} ₫</div>
                </div>
              </div>
            ) : null}

            {/* Score gauges */}
            <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12 }}>
              {canSee('churn') && scoreGauge(kh.scores.churn, 'Churn Score')}
              {canSee('engagement') && scoreGauge(kh.scores.engagement, 'Engagement')}
              {canSee('codRisk') ? scoreGauge(kh.scores.codRisk, 'COD Risk') : <div style={{ textAlign:'center', fontSize:12, color:'#6B7280' }}>🔒 COD Risk<br/>Không có quyền</div>}
              {canSee('fraud') ? scoreGauge(kh.scores.fraud, 'Fraud Score') : <div style={{ textAlign:'center', fontSize:12, color:'#6B7280' }}>🔒 Fraud Score<br/>Không có quyền</div>}
            </div>
          </div>
        )}

        {/* CONSENT */}
        {tab==='consent' && (
          <div>
            {kh.consent.deletionRequested && (
              <div style={{ padding:12, background:'#fee2e2', border:'1px solid #DC2626', borderRadius:8, marginBottom:16, fontWeight:700, color:'#DC2626', fontSize:14 }}>
                🚫 Khách hàng đã yêu cầu xóa dữ liệu (data_deletion_requested = true)
              </div>
            )}
            <div style={{ maxWidth:360 }}>
              <div className="section-title">Trạng thái Consent theo kênh</div>
              <div style={{ border:'1px solid #E5E7EB', borderRadius:8, padding:'4px 12px' }}>
                {consentChip(kh.consent.sms,  'SMS')}
                {consentChip(kh.consent.email,'Email')}
                {consentChip(kh.consent.zalo, 'Zalo OA')}
                {consentChip(kh.consent.push, 'Push Notification')}
              </div>
              <div style={{ marginTop:12, fontSize:12, color:'#6B7280' }}>
                ⚠️ Kiểm tra consent bắt buộc trước mọi activation marketing.<br/>
                Tuân thủ Luật Bảo vệ Dữ liệu Cá nhân số 91/2025/QH15.
              </div>
            </div>
          </div>
        )}

        {/* AUDIT */}
        {tab==='audit' && (
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }}>
            <div>
              <div className="section-title">Nguồn dữ liệu đóng góp</div>
              <div className="flex gap-2 flex-wrap">
                {kh.sources.map(s => <span key={s} className="badge badge-blue">{s}</span>)}
              </div>
              <div className="section-title mt-4">Thông tin hồ sơ</div>
              {[
                ['Ngày tạo', '10/01/2023'],
                ['Lần cập nhật cuối', kh.appLogin || 'Chưa có dữ liệu'],
                ['Profile version', 'v14'],
                ['Tạo bởi hệ thống', 'CAS'],
              ].map(([l,v]) => (
                <div key={l} style={{ display:'flex', justifyContent:'space-between', padding:'7px 0', borderBottom:'1px solid #F3F4F6' }}>
                  <span className="field-label" style={{ margin:0 }}>{l}</span>
                  <span style={{ fontSize:13, fontWeight:500 }}>{v}</span>
                </div>
              ))}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

// ============================================================
// CN5 — SEGMENT MANAGEMENT
// ============================================================
function SegmentScreen({ onViewKH }) {
  const [view, setView] = React.useState('list');
  const [previewCount, setPreviewCount] = React.useState(null);
  const [segName, setSegName] = React.useState('');
  const [rules, setRules] = React.useState([
    { field:'Điểm rời bỏ', op:'≥', value:'70' },
    { field:'Ngày GD gần nhất', op:'<', value:'90 ngày trước' },
  ]);
  const [logic, setLogic] = React.useState('AND');
  const [modal, setModal] = React.useState(false);
  const [statuses, setStatuses] = React.useState(SEGMENTS.map(s => s.status));

  const FIELDS = ['Loại khách hàng','Nhóm khách hàng','Tỉnh / Thành phố','Điểm rời bỏ','Điểm rủi ro COD','Tỷ lệ hoàn','Tổng đơn','Tổng doanh thu','Nhóm RFM','Ngày GD gần nhất','Vai trò'];
  const OPS = ['=','≠','>','<','≥','≤','chứa','thuộc'];

  const addRule = () => setRules(r => [...r, { field:'Điểm rời bỏ', op:'≥', value:'' }]);
  const removeRule = (i) => setRules(r => r.filter((_,j) => j!==i));
  const toggleStatus = (i) => setStatuses(prev => prev.map((s,j) => j===i ? (s==='Đang hoạt động' ? 'Tạm dừng' : 'Đang hoạt động') : s));

  return (
    <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
      {modal && (
        <div className="modal-overlay" onClick={() => setModal(false)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div style={{ fontSize:16, fontWeight:700, marginBottom:8 }}>✅ Phân khúc đã được lưu</div>
            <div style={{ fontSize:13, color:'#6B7280', marginBottom:16 }}>Phân khúc "{segName||'Không có tên'}" đã được tạo và sẽ cập nhật tự động mỗi ngày.</div>
            <button onClick={() => { setModal(false); setView('list'); }} style={{ width:'100%', padding:'10px', background:'#E30613', color:'white', border:'none', borderRadius:8, fontSize:14, fontWeight:600, cursor:'pointer' }}>
              Đóng
            </button>
          </div>
        </div>
      )}

      <div className="flex items-center justify-between">
        <div style={{ fontWeight:700, fontSize:16 }}>Quản lý Phân khúc</div>
        <div className="flex gap-2">
          <button onClick={() => setView('list')} className={`tab-btn ${view==='list' ? 'active':''}`}>Danh sách</button>
          <button onClick={() => setView('builder')} className={`tab-btn ${view==='builder' ? 'active':''}`}>+ Tạo phân khúc</button>
        </div>
      </div>

      {view === 'list' && (
        <div className="panel">
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
            <thead>
              <tr style={{ borderBottom:'1px solid #E5E7EB' }}>
                {['Tên phân khúc','Điều kiện','Số KH','Loại','Cập nhật','Trạng thái',''].map(h => (
                  <th key={h} style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {SEGMENTS.map((s,i) => (
                <tr key={i} className="table-row" style={{ borderBottom:'1px solid #F3F4F6', cursor:'pointer' }}>
                  <td style={{ padding:'10px 12px', fontWeight:700 }}>{s.name}</td>
                  <td style={{ padding:'10px 12px', fontSize:12, color:'#6B7280', maxWidth:260 }}>{s.desc}</td>
                  <td style={{ padding:'10px 12px', fontWeight:700, color:'#E30613' }} className="tabular-nums">{s.count} KH</td>
                  <td style={{ padding:'10px 12px' }}>
                    <span className="badge badge-blue" title="Tự động cập nhật hàng ngày theo điều kiện">{s.type}</span>
                  </td>
                  <td style={{ padding:'10px 12px', color:'#6B7280', fontSize:12 }}>{s.updated}</td>
                  <td style={{ padding:'10px 12px' }}>
                    <button onClick={e => { e.stopPropagation(); toggleStatus(i); }} style={{ padding:'4px 12px', background: statuses[i]==='Đang hoạt động' ? '#dcfce7' : '#F3F4F6', color: statuses[i]==='Đang hoạt động' ? '#16A34A' : '#6B7280', border:'none', borderRadius:6, fontSize:12, fontWeight:600, cursor:'pointer' }}>
                      {statuses[i]==='Đang hoạt động' ? '● Đang hoạt động' : '○ Tạm dừng'}
                    </button>
                  </td>
                  <td style={{ padding:'10px 12px' }} onClick={e => e.stopPropagation()}>
                    <button onClick={() => onViewKH && onViewKH(s.name)} style={{ padding:'4px 10px', background:'#EFF6FF', color:'#2563EB', border:'none', borderRadius:6, fontSize:12, fontWeight:600, cursor:'pointer' }}>Xem KH</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {view === 'builder' && (
        <div className="panel" style={{ padding:20, maxWidth:640 }}>
          <div style={{ fontWeight:700, fontSize:15, marginBottom:16 }}>Tạo phân khúc mới</div>
          <div style={{ marginBottom:14 }}>
            <label className="field-label">Tên phân khúc</label>
            <input value={segName} onChange={e=>setSegName(e.target.value)} placeholder="VD: Khách hàng nguy cơ rời bỏ Q3" style={{ width:'100%', marginTop:4 }} />
          </div>
          <div style={{ marginBottom:14 }}>
            <label className="field-label">Mô tả</label>
            <input placeholder="Mô tả ngắn gọn mục tiêu phân khúc..." style={{ width:'100%', marginTop:4 }} />
          </div>

          <div className="flex items-center justify-between mb-3">
            <div style={{ fontWeight:700, fontSize:13 }}>Điều kiện lọc</div>
            <div className="flex items-center gap-2">
              <span style={{ fontSize:12, color:'#6B7280' }}>Logic:</span>
              {['AND','OR'].map(l => (
                <button key={l} onClick={() => setLogic(l)} className={`tab-btn ${logic===l ? 'active':''}`} style={{ padding:'3px 10px', fontSize:11 }}>{l}</button>
              ))}
            </div>
          </div>

          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {rules.map((r,i) => (
              <div key={i}>
                {i > 0 && <div style={{ fontSize:11, fontWeight:700, color:'#E30613', padding:'4px 0', textAlign:'center' }}>{logic}</div>}
                <div className="rule-row">
                  <select value={r.field} onChange={e => setRules(rules => rules.map((x,j) => j===i ? {...x, field:e.target.value}:x))} style={{ flex:2, fontSize:12 }}>
                    {FIELDS.map(f => <option key={f}>{f}</option>)}
                  </select>
                  <select value={r.op} onChange={e => setRules(rules => rules.map((x,j) => j===i ? {...x, op:e.target.value}:x))} style={{ flex:1, fontSize:12 }}>
                    {OPS.map(o => <option key={o}>{o}</option>)}
                  </select>
                  <input value={r.value} onChange={e => setRules(rules => rules.map((x,j) => j===i ? {...x, value:e.target.value}:x))} placeholder="Giá trị" style={{ flex:2, fontSize:12 }} />
                  <button onClick={() => removeRule(i)} style={{ background:'none', border:'none', cursor:'pointer', color:'#DC2626' }}><Icon name="trash" /></button>
                </div>
              </div>
            ))}
          </div>

          <button onClick={addRule} style={{ width:'100%', marginTop:12, padding:'8px', background:'#f3f4f6', border:'1px dashed #E5E7EB', borderRadius:8, fontSize:13, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:4, color:'#6B7280' }}>
            <Icon name="plus" /> Thêm điều kiện
          </button>

          {/* Inline preview count */}
          {previewCount !== null && (
            <div style={{ marginTop:12, padding:'10px 14px', background:'#EFF6FF', border:'1px solid #BFDBFE', borderRadius:8, display:'flex', alignItems:'center', gap:12 }}>
              <span style={{ fontSize:22, fontWeight:800, color:'#2563EB' }} className="tabular-nums">{previewCount.toLocaleString()}</span>
              <span style={{ fontSize:13, color:'#2563EB' }}>khách hàng khớp điều kiện</span>
            </div>
          )}

          <div className="flex gap-3 mt-5">
            <button onClick={() => setPreviewCount(8560)} style={{ flex:1, padding:'9px', background:'#f3f4f6', color:'#1A1A1A', border:'none', borderRadius:8, fontSize:13, fontWeight:600, cursor:'pointer' }}>
              Ước tính số KH
            </button>
            <button onClick={() => setModal(true)} style={{ flex:2, padding:'9px', background:'#E30613', color:'white', border:'none', borderRadius:8, fontSize:13, fontWeight:700, cursor:'pointer' }}>
              Lưu phân khúc
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
// APP
// ============================================================
function App() {
  const [nav, setNav] = React.useState('customers');
  const [c360uid, setC360uid] = React.useState(null);
  const [segmentNavFilter, setSegmentNavFilter] = React.useState(null);

  const navLabels = {
    kafka:'Kafka Integration',
    customers:'Khách hàng',
    identity:'Đối soát hồ sơ',
    c360:'Customer 360',
    segments:'Phân khúc',
  };

  const goC360 = (uid) => {
    setC360uid(uid);
    setNav('c360');
  };

  const handleNav = (key) => {
    setNav(key);
    if (key !== 'c360') setC360uid(null);
  };

  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
      <Sidebar active={nav} onNav={handleNav} />
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
        <Header title={navLabels[nav]} />
        <main style={{ flex:1, overflowY:'auto' }}>
          {nav==='kafka'     && <KafkaScreen />}
          {nav==='customers' && <CustomerListScreen onC360={goC360} initSegment={segmentNavFilter} />}
          {nav==='c360'      && <Customer360Screen uid={c360uid} onBack={c360uid ? () => setNav('customers') : null} />}
          {nav==='segments'  && <SegmentScreen onViewKH={(seg) => { setSegmentNavFilter(seg); setNav('customers'); }} />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
