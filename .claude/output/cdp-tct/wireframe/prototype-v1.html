function KPICard({ label, value, sub, subColor }) {
  return (
    <div className="bg-white rounded-lg border border-gray-200 p-4 flex-1">
      <div className="text-xs text-gray-500 mb-1">{label}</div>
      <div className="text-2xl font-bold text-gray-800">{value}</div>
      <div className={`text-xs mt-1 ${subColor || 'text-green-600'}`}>{sub}</div>
    </div>
  );
}

function StatusBadge({ status }) {
  if (status === 'active')   return <span className="badge-active text-xs px-2 py-0.5 rounded-full">● Active</span>;
  if (status === 'paused')   return <span className="badge-pause  text-xs px-2 py-0.5 rounded-full">⏸ Tạm dừng</span>;
  if (status === 'draft')    return <span className="badge-draft  text-xs px-2 py-0.5 rounded-full">📝 Nháp</span>;
  if (status === 'inactive') return <span className="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">Ngưng HĐ</span>;
  return null;
}

function SearchScreen({ setScreen, setSelectedCustomer }) {
  const [query, setQuery] = useState('');
  const [showFilter, setShowFilter] = useState(false);
  const [results, setResults] = useState(customers);

  const handleSearch = () => {
    if (!query.trim()) { setResults(customers); return; }
    const q = query.toLowerCase();
    setResults(customers.filter(c =>
      c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q) || c.phone.includes(q)
    ));
  };

  return (
    <div className="flex-1 overflow-auto p-6">
      <div className="max-w-5xl mx-auto space-y-4">
        {/* Search box */}
        <div className="bg-white rounded-lg border border-gray-200 p-4">
          <div className="flex gap-3">
            <input
              className="flex-1 border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-vnred/30 focus:border-vnred"
              placeholder="Nhập SĐT / Họ tên / CCCD / Mã vận đơn / PostID / Mã KHL..."
              value={query}
              onChange={e => setQuery(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && handleSearch()}
            />
            <button
              onClick={handleSearch}
              className="bg-vnred hover:bg-vnred-dark text-white px-5 py-2.5 rounded-lg text-sm font-medium"
            >Tìm kiếm</button>
          </div>

          <button
            onClick={() => setShowFilter(!showFilter)}
            className="mt-3 text-xs text-gray-500 hover:text-gray-700 flex items-center gap-1"
          >
            {showFilter ? '▲' : '▼'} Lọc nâng cao
          </button>

          {showFilter && (
            <div className="mt-3 pt-3 border-t border-gray-100 grid grid-cols-4 gap-3">
              {['Loại KH', 'Tỉnh/TP', 'Phân khúc', 'Trạng thái'].map(f => (
                <select key={f} className="border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-600 focus:outline-none focus:border-vnred">
                  <option>{f}: Tất cả</option>
                </select>
              ))}
            </div>
          )}
        </div>

        {/* Results */}
        <div className="bg-white rounded-lg border border-gray-200">
          <div className="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
            <span className="text-sm text-gray-600">Kết quả: <strong>{results.length}</strong> khách hàng</span>
            <button className="text-xs text-gray-500 border border-gray-300 rounded px-3 py-1 hover:bg-gray-50">⬇ Xuất Excel</button>
          </div>
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-gray-100 bg-gray-50">
                <th className="text-left px-4 py-3 text-xs text-gray-500 font-medium">Họ tên</th>
                <th className="text-left px-4 py-3 text-xs text-gray-500 font-medium">SĐT</th>
                <th className="text-left px-4 py-3 text-xs text-gray-500 font-medium">Loại KH</th>
                <th className="text-left px-4 py-3 text-xs text-gray-500 font-medium">Tỉnh/TP</th>
                <th className="text-left px-4 py-3 text-xs text-gray-500 font-medium">Phân khúc</th>
                <th className="text-left px-4 py-3 text-xs text-gray-500 font-medium">Trạng thái</th>
                <th className="px-4 py-3"></th>
              </tr>
            </thead>
            <tbody>
              {results.map(c => (
                <tr key={c.id} className="border-b border-gray-50 hover:bg-gray-50">
                  <td className="px-4 py-3 font-medium text-gray-800">{c.name}</td>
                  <td className="px-4 py-3 text-gray-500 font-mono text-xs">{c.phone}</td>
                  <td className="px-4 py-3">
                    <span className={`text-xs px-2 py-0.5 rounded-full ${c.type === 'business' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>
                      {c.type === 'business' ? 'Doanh nghiệp' : 'Cá nhân'}
                    </span>
                  </td>
                  <td className="px-4 py-3 text-gray-600">{c.province}</td>
                  <td className="px-4 py-3">
                    <span className="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">{c.segment}</span>
                  </td>
                  <td className="px-4 py-3"><StatusBadge status={c.status} /></td>
                  <td className="px-4 py-3">
                    <button
                      onClick={() => { setSelectedCustomer(c); setScreen(c.type === 'business' ? 'c360-business' : 'c360-individual'); }}

    </div>
  );
}

                    {menuOpen === s.id && (
                      <div className="absolute right-4 top-8 bg-white border border-gray-200 rounded-lg shadow-lg z-10 w-40 py-1" onClick={() => setMenuOpen(null)}>
                        {['Xem chi tiết','Chỉnh sửa','Nhân bản',s.status==='active'?'Tạm dừng':'Kích hoạt lại'].map(a => (
                          <button key={a} onClick={() => a==='Chỉnh sửa' && setScreen('segment-builder')}
                            className="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">{a}</button>
                        ))}
                        <div className="border-t border-gray-100 mt-1 pt-1">
                          <button className="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">Xóa</button>
                        </div>
                      </div>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="px-4 py-3 text-xs text-gray-500 border-t border-gray-100 flex justify-between">
            <span>Hiển thị {filtered.length}/{segmentData.length} phân khúc</span>
            <span>Trang 1/26</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function Placeholder({ title }) {
  return (
    <div className="flex-1 flex items-center justify-center text-gray-400">
      <div className="text-center">
        <div className="text-4xl mb-3">🚧</div>
        <div className="text-lg font-medium">{title}</div>
        <div className="text-sm mt-1">Màn hình này chưa có trong prototype v1</div>
      </div>
    </div>
  );
}

/* ── App ── */
function App() {
  const [screen, setScreen] = useState('dashboard');
  const [selectedCustomer, setSelectedCustomer] = useState(null);
  const [segmentData, setSegmentData] = useState(segments);

  const screenTitles = {
    dashboard:       'Tổng quan hệ thống',
    search:          'Tìm kiếm khách hàng',
    'c360-individual': 'Customer 360 — Hồ sơ cá nhân',
    'c360-business':   'Customer 360 — Hồ sơ doanh nghiệp',
    'segment-builder': 'Tạo phân khúc mới',
    segments:          'Danh sách phân khúc',
    report:            'Báo cáo',
    settings:          'Cài đặt',
  };

  return (
    <div className="flex h-screen overflow-hidden">
      <Sidebar screen={screen} setScreen={setScreen} />
      <div className="flex-1 flex flex-col overflow-hidden">
        <Header title={screenTitles[screen] || screen} />
        {screen === 'dashboard'         && <Dashboard setScreen={setScreen} setSelectedCustomer={setSelectedCustomer} />}
        {screen === 'search'            && <SearchScreen setScreen={setScreen} setSelectedCustomer={setSelectedCustomer} />}
        {screen === 'c360-individual'   && <C360Individual customer={selectedCustomer} setScreen={setScreen} />}
        {screen === 'c360-business'     && <C360Business customer={selectedCustomer} setScreen={setScreen} />}
        {screen === 'segment-builder'   && <SegmentBuilder setScreen={setScreen} />}
        {screen === 'segments'          && <SegmentList setScreen={setScreen} setSegments={setSegmentData} segmentData={segmentData} />}
        {screen === 'report'            && <Placeholder title="Báo cáo" />}
        {screen === 'settings'          && <Placeholder title="Cài đặt" />}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
<div id="root"></div>
</body>
</html>
