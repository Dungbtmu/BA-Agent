const fmt = (n) => n;

const statusBadge = (s) => {
  const map = { HEALTHY:'badge-green', WARNING:'badge-yellow', ERROR:'badge-red', IDLE:'badge-gray' };
  return <span className={`badge ${map[s]||'badge-gray'}`}>{s}</span>;
};

const custStatusBadge = (s) => {
  const map = { ACTIVE:'badge-green', INACTIVE:'badge-gray', BLOCKED:'badge-red', MERGED:'badge-blue' };
  return <span className={`badge ${map[s]||'badge-gray'}`}>{s}</span>;
};

const lagBadge = (lag, warn) => {
  if (warn) return <span className="tabular-nums text-red-600 font-bold">{lag.toLocaleString()}</span>;
  if (lag > 1000) return <span className="tabular-nums text-yellow-600 font-semibold">{lag.toLocaleString()}</span>;
  return <span className="tabular-nums text-gray-500">{lag}</span>;
};

const scoreGauge = (val, label) => {
  let bg = '#16A34A';
  if (val >= 70) bg = '#DC2626';
  else if (val >= 40) bg = '#F59E0B';
  return (
    <div className="flex flex-col items-center gap-1">
      <div className="gauge-outer" style={{ border: `4px solid ${bg}`, color: bg }}>{val}</div>
      <div className="text-xs text-gray-500">{label}</div>
    </div>
  );
};

const rfmDot = (val) => {
  const colors = ['','#DC2626','#F59E0B','#d97706','#16A34A','#15803d'];
  return (
    <span className="inline-flex items-center gap-0.5">
      {[1,2,3,4,5].map(i => (
        <span key={i} style={{ width:10, height:10, borderRadius:'50%', background: i<=val ? colors[val] : '#e5e7eb', display:'inline-block' }}></span>
      ))}
      <span className="ml-1 font-bold tabular-nums" style={{ color: colors[val] }}>{val}</span>
    </span>
  );
};

const consentChip = (v, label) => {
  const cls = v==='in' ? 'consent-in' : v==='out' ? 'consent-out' : 'consent-unknown';
  const txt = v==='in' ? 'OPT IN' : v==='out' ? 'OPT OUT' : 'UNKNOWN';
  return <div className="flex items-center justify-between py-1.5 border-b border-gray-100 last:border-0">
    <span className="text-sm text-gray-600">{label}</span>
    <span className={`consent-chip ${cls}`}>{v==='in' ? '✓' : v==='out' ? '✕' : '?'} {txt}</span>
  </div>;
};

function CustomerListScreen({ onC360 }) {
  const [search, setSearch] = React.useState('');
  const [typeFilter, setTypeFilter] = React.useState('ALL');
  const [statusFilter, setStatusFilter] = React.useState('ALL');

  const filtered = CUSTOMERS.filter(c => {
    const q = search.toLowerCase();
    const matchQ = !q || c.name.toLowerCase().includes(q) || c.uid.toLowerCase().includes(q) || c.phone.includes(q);
    const matchT = typeFilter === 'ALL' || c.type === typeFilter;
    const matchS = statusFilter === 'ALL' || c.status === statusFilter;
    return matchQ && matchT && matchS;
  });

  return (
    <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
      {/* Toolbar */}
      <div className="panel" style={{ padding:16 }}>
        <div className="flex items-center gap-3 flex-wrap">
          <div className="flex items-center gap-2" style={{ background:'#F7F8FA', border:'1px solid #E5E7EB', borderRadius:8, padding:'6px 12px', flex:'1', minWidth:200 }}>
            <Icon name="search" />
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Tìm theo tên, UID, SĐT, email, MST..." style={{ border:'none', background:'transparent', outline:'none', fontSize:13, width:'100%', padding:0 }} />
          </div>
          <select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{ fontSize:13 }}>
            <option value="ALL">Tất cả loại</option>
            <option value="INDIVIDUAL">Cá nhân</option>
            <option value="BUSINESS">Doanh nghiệp</option>
          </select>
          <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{ fontSize:13 }}>
            <option value="ALL">Tất cả trạng thái</option>
            <option value="ACTIVE">ACTIVE</option>
            <option value="INACTIVE">INACTIVE</option>
          </select>
        </div>
      </div>

      {/* Table */}
      <div className="panel">
        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
          <thead>
            <tr style={{ borderBottom:'1px solid #E5E7EB' }}>
              {['UID','Tên / Công ty','Loại','Nhóm','SĐT','Tổng đơn','Doanh thu','Segment','Trạng thái','Cập nhật'].map(h => (
                <th key={h} style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280', whiteSpace:'nowrap' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map((c,i) => (
              <tr key={i} className="table-row" onClick={() => onC360(c.uid)} style={{ borderBottom:'1px solid #F3F4F6' }}>
                <td style={{ padding:'10px 12px', fontFamily:'monospace', fontSize:11, color:'#6B7280' }}>{c.uid}</td>
                <td style={{ padding:'10px 12px', fontWeight:600, color:'#2563EB' }}>{c.name}</td>
                <td style={{ padding:'10px 12px' }}>
                  <span className={`badge ${c.type==='INDIVIDUAL' ? 'badge-blue':'badge-purple'}`}>{c.type==='INDIVIDUAL' ? 'Cá nhân':'Doanh nghiệp'}</span>
                </td>
                <td style={{ padding:'10px 12px' }}><span className="badge badge-gray">{c.group}</span></td>
                <td style={{ padding:'10px 12px', fontFamily:'monospace' }}>{c.phone.slice(0,3)+'***'+c.phone.slice(-3)}</td>

        <div className="modal-overlay" onClick={() => setModal(null)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>

              {modal==='confirmed' ? '✅ Đã ghi nhận — Cùng người' : modal==='different' ? '🚫 Đã ghi nhận — Hai người khác nhau' : '⏳ Để lại sau'}
            </div>
            <div style={{ fontSize:13, color:'#6B7280', marginBottom:16 }}>
              {modal==='confirmed' && 'Quyết định của bạn đã được ghi nhận. BE sẽ tiến hành merge và cập nhật hồ sơ.'}
              {modal==='different' && 'Cặp này được đánh dấu là hai người khác nhau và sẽ không hiển thị lại trong danh sách.'}
              {modal==='later' && 'Cặp này vẫn còn trong danh sách chờ để bạn xem xét sau.'}
            </div>
            <button onClick={() => { setModal(null); setView('list'); }}

              Đóng

          </div>
        </div>
      )}

      {/* Tab điều hướng màn hình */}
      <div style={{ display:'flex', gap:8, marginBottom:20 }}>
        {[
          { key:'pending', label:`Chờ xem xét (${pendingPairs.length})` },
          { key:'history', label:'Lịch sử merge' },
          { key:'unmerge', label:`Yêu cầu Unmerge (${UNMERGE_REQUESTS.filter(r=>r.status==='CHỜ DUYỆT').length})` },
        ].map(t => (
          <button key={t.key} onClick={() => { setScreenTab(t.key); setView('list'); }}
            className={`tab-btn ${screenTab===t.key ? 'active':''}`}>
            {t.label}
          </button>
        ))}
      </div>

      {/* TAB: Chờ xem xét (PENDING 60–89%) */}
      {screenTab==='pending' && view === 'list' && (
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          <div className="panel">
            <div style={{ padding:'12px 16px', borderBottom:'1px solid #E5E7EB', fontSize:12, color:'#6B7280' }}>
              Chỉ hiển thị cặp có độ tương đồng 60–89%. Cặp ≥90% đã được BE tự động merge. Cặp &lt;60% bị loại tự động.
            </div>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
              <thead>
                <tr style={{ borderBottom:'1px solid #E5E7EB' }}>
                  {['Hồ sơ A','Hồ sơ B','Tương đồng','Khóa trùng','Nguồn','Trạng thái',''].map(h => (
                    <th key={h} style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280', whiteSpace:'nowrap' }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {pendingPairs.map(p => (
                  <tr key={p.id} style={{ borderBottom:'1px solid #F3F4F6' }}>
                    <td style={{ padding:'10px 12px' }}>
                      <div style={{ fontWeight:600, color:'#2563EB', fontSize:12 }}>{p.a.uid}</div>
                      <div style={{ fontSize:12 }}>{p.a.name}</div>
                      <div style={{ fontSize:11, color:'#6B7280', fontFamily:'monospace' }}>{p.a.phone}</div>
                    </td>
                    <td style={{ padding:'10px 12px' }}>
                      <div style={{ fontWeight:600, color:'#2563EB', fontSize:12 }}>{p.b.uid}</div>
                      <div style={{ fontSize:12 }}>{p.b.name}</div>
                      <div style={{ fontSize:11, color:'#6B7280', fontFamily:'monospace' }}>{p.b.phone}</div>
                    </td>
                    <td style={{ padding:'10px 12px' }}>
                      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                        <div style={{ width:60, height:6, borderRadius:3, background:'#E5E7EB', overflow:'hidden' }}>
                          <div style={{ width:`${p.sim}%`, height:'100%', background:simColor(p.sim), borderRadius:3 }}></div>
                        </div>
                        <span style={{ fontWeight:700, color:simColor(p.sim) }} className="tabular-nums">{p.sim}%</span>
                      </div>
                    </td>
                    <td style={{ padding:'10px 12px', fontSize:12 }}><span className="badge badge-blue">{p.key}</span></td>
                    <td style={{ padding:'10px 12px', fontSize:12, color:'#6B7280' }}>{p.a.source} / {p.b.source}</td>
                    <td style={{ padding:'10px 12px' }}>
                      {decisions[p.id]==='later'
                        ? <span className="badge badge-gray">Để sau</span>
                        : <span className="badge badge-yellow">Chờ xem xét</span>}
                    </td>
                    <td style={{ padding:'10px 12px' }}>
                      <button onClick={() => openCompare(p)} style={{ padding:'5px 12px', background:'#E30613', color:'white', border:'none', borderRadius:6, fontSize:12, fontWeight:600, cursor:'pointer' }}>So sánh</button>
                    </td>
                  </tr>
                ))}
                {pendingPairs.length === 0 && (
                  <tr><td colSpan={7} style={{ padding:32, textAlign:'center', color:'#6B7280' }}>✅ Không còn cặp chờ xem xét</td></tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* View so sánh chi tiết — read-only + nút quyết định Data Steward */}
      {screenTab==='pending' && view === 'compare' && selectedPair && (
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          <div className="flex items-center gap-3">
            <button onClick={() => setView('list')} style={{ background:'#f3f4f6', border:'none', borderRadius:6, padding:'6px 12px', fontSize:13, cursor:'pointer' }}>← Quay lại</button>
            <div style={{ fontWeight:700, fontSize:16 }}>So sánh hồ sơ — Độ tương đồng {selectedPair.sim}%</div>
            <span className="badge badge-yellow">PENDING — Chờ xác nhận</span>
          </div>

          {/* Thông tin 2 hồ sơ */}
          <div className="flex gap-4">
            {[selectedPair.a, selectedPair.b].map((hf, idx) => (
              <div key={idx} className="panel" style={{ flex:1, padding:16 }}>
                <div style={{ fontSize:11, fontWeight:700, color:'#6B7280', marginBottom:8 }}>HỒ SƠ {idx===0 ? 'A':'B'} — {hf.source}</div>
                <div style={{ fontWeight:700, color:'#2563EB', fontSize:12, marginBottom:4 }}>{hf.uid}</div>
                <div style={{ fontWeight:600, fontSize:14 }}>{hf.name}</div>
                <div style={{ fontSize:12, color:'#6B7280', marginTop:4 }}>{hf.phone} · {hf.type} · {hf.address}</div>
              </div>
            ))}
          </div>

          {/* Bảng so sánh — read-only, không có radio chọn field */}
          <div className="panel" style={{ overflow:'hidden' }}>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
              <thead>
                <tr style={{ borderBottom:'1px solid #E5E7EB', background:'#F7F8FA' }}>
                  <th style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280', width:140 }}>Trường</th>
                  <th style={{ padding:'10px 12px', fontSize:11, fontWeight:700, color:'#2563EB' }}>Hồ sơ A — {selectedPair.a.uid}</th>
                  <th style={{ padding:'10px 12px', fontSize:11, fontWeight:700, color:'#7c3aed' }}>Hồ sơ B — {selectedPair.b.uid}</th>
                  <th style={{ padding:'10px 12px', fontSize:11, fontWeight:700, color:'#6B7280', width:100 }}>Kết quả</th>
                </tr>
              </thead>
              <tbody>
                {COMPARE_FIELDS.map(f => {
                  const va = String(selectedPair.a[f.key]||'—');
                  const vb = String(selectedPair.b[f.key]||'—');
                  const same = va.toLowerCase() === vb.toLowerCase();
                  return (
                    <tr key={f.key} style={{ borderBottom:'1px solid #F3F4F6', background: same ? '#f0fdf4' : 'white' }}>
                      <td style={{ padding:'9px 12px', fontWeight:600, color:'#6B7280', fontSize:12 }}>{f.label}</td>
                      <td style={{ padding:'9px 12px' }}>
                        {same && <span style={{ color:'#16A34A', marginRight:6 }}>✓</span>}
                        {va}
                      </td>
                      <td style={{ padding:'9px 12px', color: !same ? '#d97706' : '#6B7280' }}>{vb}</td>
                      <td style={{ padding:'9px 12px' }}>
                        {same
                          ? <span className="badge badge-green">Khớp</span>
                          : <span className="badge badge-yellow">Khác nhau</span>}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {/* Nút quyết định Data Steward — BE thực hiện merge, người dùng chỉ xác nhận ý kiến */}
          <div style={{ padding:16, background:'#F7F8FA', borderRadius:8, border:'1px solid #E5E7EB' }}>
            <div style={{ fontSize:12, color:'#6B7280', marginBottom:12 }}>
              Quyết định của bạn sẽ được ghi nhận và BE xử lý. Bạn không chọn field nào được giữ lại — BE tự quyết định theo rule ưu tiên nguồn dữ liệu.
            </div>
            <div className="flex gap-3">
              <button onClick={() => handleDecision('confirmed')}
                style={{ flex:2, padding:'11px', background:'#16A34A', color:'white', border:'none', borderRadius:8, fontSize:14, fontWeight:700, cursor:'pointer' }}>
                ✓ Cùng người — Xác nhận merge
              </button>
              <button onClick={() => handleDecision('different')}
                style={{ flex:2, padding:'11px', background:'#f3f4f6', color:'#1A1A1A', border:'none', borderRadius:8, fontSize:14, fontWeight:600, cursor:'pointer' }}>
                ✗ Hai người khác nhau
              </button>
              <button onClick={() => handleDecision('later')}
                style={{ flex:1, padding:'11px', background:'#f3f4f6', color:'#6B7280', border:'none', borderRadius:8, fontSize:13, cursor:'pointer' }}>
                Để sau
              </button>
            </div>
          </div>
        </div>
      )}

      {/* TAB: Lịch sử merge (audit log) */}
      {screenTab==='history' && (
        <div className="panel" style={{ overflow:'hidden' }}>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
            <thead>
              <tr style={{ borderBottom:'1px solid #E5E7EB', background:'#F7F8FA' }}>
                {['ID','Loại merge','UID Master','UID được gộp','Độ tin cậy','Khóa trùng','Người quyết định','Thời điểm','Điểm trước → sau'].map(h => (
                  <th key={h} style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280', whiteSpace:'nowrap' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {MERGE_HISTORY.map(m => (
                <tr key={m.id} style={{ borderBottom:'1px solid #F3F4F6' }}>
                  <td style={{ padding:'10px 12px', fontFamily:'monospace', fontSize:12 }}>{m.id}</td>
                  <td style={{ padding:'10px 12px' }}>
                    <span className={`badge ${m.type==='AUTO_MERGE' ? 'badge-blue':'badge-green'}`}>
                      {m.type==='AUTO_MERGE' ? 'Tự động':'Thủ công'}
                    </span>
                  </td>
                  <td style={{ padding:'10px 12px', fontSize:12, color:'#2563EB', fontFamily:'monospace' }}>{m.uidMaster}</td>
                  <td style={{ padding:'10px 12px', fontSize:12, color:'#7c3aed', fontFamily:'monospace' }}>{m.uidMerged}</td>
                  <td style={{ padding:'10px 12px', fontWeight:700, color: m.confidence>=90 ? '#16A34A':'#F59E0B' }}>{m.confidence}%</td>
                  <td style={{ padding:'10px 12px', fontSize:12 }}><span className="badge badge-blue">{m.matchKeys}</span></td>
                  <td style={{ padding:'10px 12px', fontSize:12, color:'#6B7280' }}>{m.by}</td>
                  <td style={{ padding:'10px 12px', fontSize:12, color:'#6B7280', whiteSpace:'nowrap' }}>{m.at}</td>
                  <td style={{ padding:'10px 12px', fontSize:11, color:'#6B7280' }}>{m.scoresBefore} → {m.scoresAfter}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {/* TAB: Yêu cầu Unmerge (chỉ Admin) */}
      {screenTab==='unmerge' && (
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          <div style={{ padding:12, background:'#fef9c3', border:'1px solid #F59E0B', borderRadius:8, fontSize:12, color:'#d97706' }}>
            Chỉ Admin mới có thể phê duyệt hoặc từ chối yêu cầu Unmerge. Mọi quyết định được ghi audit log.
          </div>
          <div className="panel" style={{ overflow:'hidden' }}>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
              <thead>
                <tr style={{ borderBottom:'1px solid #E5E7EB', background:'#F7F8FA' }}>
                  {['ID','UID liên quan','Người báo cáo','Thời gian','Lý do','Trạng thái',''].map(h => (
                    <th key={h} style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280' }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {UNMERGE_REQUESTS.map(r => (
                  <tr key={r.id} style={{ borderBottom:'1px solid #F3F4F6' }}>
                    <td style={{ padding:'10px 12px', fontFamily:'monospace', fontSize:12 }}>{r.id}</td>
                    <td style={{ padding:'10px 12px', fontSize:12, color:'#2563EB', fontFamily:'monospace' }}>{r.uidMaster}</td>
                    <td style={{ padding:'10px 12px', fontSize:12, color:'#6B7280' }}>{r.reporter}</td>
                    <td style={{ padding:'10px 12px', fontSize:12, color:'#6B7280', whiteSpace:'nowrap' }}>{r.reportedAt}</td>
                    <td style={{ padding:'10px 12px', fontSize:12, maxWidth:280 }}>{r.reason}</td>
                    <td style={{ padding:'10px 12px' }}><span className="badge badge-yellow">{r.status}</span></td>
                    <td style={{ padding:'10px 12px' }}>
                      <div className="flex gap-2">
                        <button style={{ padding:'5px 10px', background:'#DC2626', color:'white', border:'none', borderRadius:6, fontSize:12, fontWeight:600, cursor:'pointer' }}>Phê duyệt</button>
                        <button style={{ padding:'5px 10px', background:'#f3f4f6', color:'#6B7280', border:'none', borderRadius:6, fontSize:12, cursor:'pointer' }}>Từ chối</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

            <div style={{ marginBottom:14 }}>
              <label className="field-label">Mô tả</label>
              <input placeholder="Mô tả ngắn gọn mục tiêu segment..." style={{ width:'100%', marginTop:4 }} />
            </div>

            <div className="flex items-center justify-between mb-3">
              <div style={{ fontWeight:700, fontSize:13 }}>Điều kiện lọc</div>
              <div className="flex items-center gap-2">
                <span style={{ fontSize:12, color:'#6B7280' }}>Logic:</span>
                {['AND','OR'].map(l => (
                  <button key={l} onClick={() => setLogic(l)} className={`tab-btn ${logic===l ? 'active':''}`} style={{ padding:'3px 10px', fontSize:11 }}>{l}</button>
                ))}
              </div>
            </div>

            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {rules.map((r,i) => (
                <div key={i}>
                  {i > 0 && <div style={{ fontSize:11, fontWeight:700, color:'#E30613', padding:'4px 0', textAlign:'center' }}>{logic}</div>}
                  <div className="rule-row">
                    <select value={r.field} onChange={e => setRules(rules => rules.map((x,j) => j===i ? {...x, field:e.target.value}:x))} style={{ flex:2, fontSize:12 }}>
                      {FIELDS.map(f => <option key={f}>{f}</option>)}
                    </select>
                    <select value={r.op} onChange={e => setRules(rules => rules.map((x,j) => j===i ? {...x, op:e.target.value}:x))} style={{ flex:1, fontSize:12 }}>
                      {OPS.map(o => <option key={o}>{o}</option>)}
                    </select>
                    <input value={r.value} onChange={e => setRules(rules => rules.map((x,j) => j===i ? {...x, value:e.target.value}:x))} placeholder="Giá trị" style={{ flex:2, fontSize:12 }} />
                    <button onClick={() => removeRule(i)} style={{ background:'none', border:'none', cursor:'pointer', color:'#DC2626' }}><Icon name="trash" /></button>
                  </div>
                </div>
              ))}
            </div>

            <button onClick={addRule} style={{ width:'100%', marginTop:12, padding:'8px', background:'#f3f4f6', border:'1px dashed #E5E7EB', borderRadius:8, fontSize:13, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:4, color:'#6B7280' }}>
              <Icon name="plus" /> Thêm điều kiện
            </button>

            <div className="flex gap-3 mt-5">
              <button onClick={() => setPreview(true)} style={{ flex:1, padding:'9px', background:'#f3f4f6', color:'#1A1A1A', border:'none', borderRadius:8, fontSize:13, fontWeight:600, cursor:'pointer' }}>
                Preview KH khớp
              </button>
              <button onClick={() => setModal(true)} style={{ flex:2, padding:'9px', background:'#E30613', color:'white', border:'none', borderRadius:8, fontSize:13, fontWeight:700, cursor:'pointer' }}>
                Lưu Segment
              </button>
            </div>
          </div>

          {/* Preview */}
          <div className="panel" style={{ padding:20 }}>
            <div style={{ fontWeight:700, fontSize:14, marginBottom:12 }}>Preview — Khách hàng khớp</div>
            {preview ? (
              <>
                <div style={{ fontSize:28, fontWeight:800, color:'#E30613', marginBottom:4 }} className="tabular-nums">8.560</div>
                <div style={{ fontSize:12, color:'#6B7280', marginBottom:16 }}>khách hàng khớp điều kiện</div>
                <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                  {[
                    { name:'Phạm Minh Tuấn', uid:'UID-0000456789', val:'Churn 78' },
                    { name:'Đỗ Văn Khải',    uid:'UID-0000662200', val:'Churn 72' },
                    { name:'Lê Thị Hằng',   uid:'UID-0000771122', val:'Churn 71' },
                  ].map((c,i) => (
                    <div key={i} style={{ padding:'8px 10px', border:'1px solid #E5E7EB', borderRadius:7 }}>
                      <div style={{ fontWeight:600, fontSize:13 }}>{c.name}</div>
                      <div style={{ fontSize:11, color:'#6B7280', fontFamily:'monospace' }}>{c.uid}</div>
                      <div style={{ fontSize:12, color:'#DC2626', fontWeight:600, marginTop:2 }}>{c.val}</div>
                    </div>
                  ))}
                  <div style={{ fontSize:12, color:'#6B7280', textAlign:'center', marginTop:4 }}>... và 8.557 KH khác</div>
                </div>
              </>
            ) : (
              <div style={{ padding:32, textAlign:'center', color:'#6B7280', fontSize:13 }}>
                Thêm điều kiện rồi bấm "Preview KH khớp" để xem kết quả
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
// APP
// ============================================================
function App() {
  const [nav, setNav] = React.useState('customers');
  const [c360uid, setC360uid] = React.useState(null);

  const navLabels = {
    kafka:'Kafka Integration',
    customers:'Tìm kiếm KH',
    identity:'Đối soát hồ sơ',
    c360:'Customer 360',
    segments:'Phân khúc',
  };

  const goC360 = (uid) => {
    setC360uid(uid);
    setNav('c360');
  };

  const handleNav = (key) => {
    setNav(key);
    if (key !== 'c360') setC360uid(null);
  };

  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
      <Sidebar active={nav} onNav={handleNav} />
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
        <Header title={navLabels[nav]} />
        <main style={{ flex:1, overflowY:'auto' }}>
          {nav==='kafka'     && <KafkaScreen />}
          {nav==='customers' && <CustomerListScreen onC360={goC360} />}
          {nav==='identity'  && <IdentityScreen onC360={goC360} />}
          {nav==='c360'      && <Customer360Screen uid={c360uid} onBack={c360uid ? () => setNav('customers') : null} />}
          {nav==='segments'  && <SegmentScreen />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
