<style>
  :root {
    --brand: #F4B400; --brand-soft: #FEF7E0; --brand-2: #ffd44d;
    --text: #1A1A1A; --text-2: #374151; --muted: #6B7280;
    --border: #E5E7EB; --line: #F3F4F6; --bg: #F7F8FA; --bg-2: #fafbfc;
    --success: #16A34A; --success-soft: #dcfce7;
    --info: #2563EB; --info-soft: #dbeafe;
    --warn: #d97706; --warn-soft: #fef9c3;
    --danger: #DC2626; --danger-soft: #fee2e2;
    --purple: #7c3aed; --purple-soft: #ede9fe;
    --radius: 14px; --radius-sm: 8px;
    --shadow-xs: 0 2px 6px rgba(17,24,39,.05);
    --shadow-sm: 0 4px 14px rgba(17,24,39,.07);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* Sidebar */
  .sidebar-item { transition: background .15s; }
  .sidebar-item:hover { background: var(--brand-soft); }
  .sidebar-item.active { background: var(--brand-soft); color: #8a5a00; border-right: 3px solid var(--brand); }
  .sidebar-item.active svg { color: #8a5a00; }
  .sidebar-section-label { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #9CA3AF; padding: 10px 16px 4px; }

  /* Badges */
  .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .badge-green  { background: var(--success-soft); color: var(--success); }
  .badge-red    { background: var(--danger-soft);  color: var(--danger); }
  .badge-yellow { background: var(--warn-soft);    color: var(--warn); }
  .badge-blue   { background: var(--info-soft);    color: var(--info); }
  .badge-gray   { background: var(--line);         color: var(--muted); }
  .badge-purple { background: var(--purple-soft);  color: var(--purple); }

  /* Table */
  .table-row:hover { background: #fffdf6; cursor: pointer; }

  /* Score bar */
  .score-bar { height: 6px; border-radius: 3px; background: var(--border); }
  .score-fill { height: 100%; border-radius: 3px; }

  /* Tabs */
  .tab-btn { padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; background: transparent; color: var(--muted); transition: all .15s; white-space: nowrap; }
  .tab-btn.active { background: linear-gradient(180deg, var(--brand), #efb000); color: #1A1A1A; border-color: #e1ad1f; box-shadow: var(--shadow-xs); }
  .tab-btn:hover:not(.active) { background: var(--line); color: var(--text); }
  .tabs-strip { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .tabs-strip::-webkit-scrollbar { display: none; }

  /* Cards & Panels */
  .kpi-card { background: white; border-radius: var(--radius); padding: 16px 18px; border: 1px solid rgba(17,24,39,.06); box-shadow: var(--shadow-xs); }
  .panel { background: white; border-radius: var(--radius); border: 1px solid rgba(17,24,39,.06); overflow: hidden; box-shadow: var(--shadow-xs); }

  /* Typography */
  .section-title { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
  .field-label { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .field-value { font-size: 14px; color: var(--text); font-weight: 500; }

  /* Consent */
  .consent-chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 8px; font-size: 12px; font-weight: 700; }
  .consent-in  { background: var(--success-soft); color: var(--success); }
  .consent-out { background: var(--danger-soft);  color: var(--danger); }
  .consent-unknown { background: var(--line); color: var(--muted); }

  /* Timeline */
  .timeline-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }

  /* Rule builder */
  .rule-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--bg-2); border-radius: 10px; border: 1px solid var(--border); }

  /* Modals */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 50; backdrop-filter: blur(2px); }
  .modal-box { background: white; border-radius: 16px; padding: 28px; width: 440px; max-width: 90vw; box-shadow: var(--shadow-sm); }

  /* Gauge */
  .gauge-outer { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; }

  /* Inputs */
  input, select { border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; background: white; color: var(--text); transition: border-color .15s; }
  input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: transparent; }

  /* Slide panel */
  .slide-panel { position: fixed; top: 0; right: 0; height: 100vh; width: 440px; max-width: 95vw; background: white; box-shadow: -6px 0 28px rgba(0,0,0,.1); z-index: 40; overflow-y: auto; padding: 24px; }

  /* Buttons */
  .btn-primary { background: linear-gradient(180deg, var(--brand), #efb000); color: #1A1A1A; border: 1px solid #e1ad1f; border-radius: 10px; font-weight: 700; cursor: pointer; }
  .btn-primary:hover { filter: brightness(1.04); }
  .btn-ghost { background: var(--line); color: var(--text); border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
  .btn-ghost:hover { background: var(--border); }

  /* Info row (key-value) */
  .info-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .info-row:last-child { border-bottom: none; }
  .info-row span:first-child { color: var(--muted); font-size: 13px; }
  .info-row b { text-align: right; font-size: 13px; }

  /* Metadata strip */
  .meta-strip { display: flex; gap: 16px; flex-wrap: wrap; padding: 10px 14px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; color: var(--muted); }
  .meta-strip b { color: var(--text-2); }
</style>

// NGHI TRÙNG ĐỊNH DANH — nguồn dữ liệu cho cờ cảnh báo ở màn Danh sách KH
// và màn đối chiếu. Mô hình BA MỨC theo độ tin cậy:
//   confidence ≥ 90 → hệ thống TỰ ĐỘNG GỘP (không cần hỏi)
//   confidence 60–89 → NGHI TRÙNG — nên xác nhận (cờ ⚠ cam đậm, nhóm chính)
//   confidence < 60  → GỢI Ý TIN CẬY THẤP — cân nhắc kỹ (cờ nhạt, nhóm tách riêng)
// Với KH có KH_DETAIL: mảnh PENDING lấy trực tiếp từ sourcesData (mergeStatus).
// Với KH chưa có KH_DETAIL: khai báo mảnh pending tối giản ở đây để vẫn demo được cờ.
// ============================================================

const CONF_LOW  = 60;   // ranh giới giữa "nên xác nhận" và "tin cậy thấp"

// Danh sách mảnh nghi trùng của một UID, chuẩn hóa về cùng schema (source, confidence, matchKey, ten, sdt, email, cccd, contribution).
// Ưu tiên lấy từ sourcesData (KH có KH_DETAIL, các mảnh mergeStatus==='PENDING'); nếu không có thì lấy SUSPECT_DUPLICATES.
function suspectFragments(uid) {
  const kh = KH_DETAIL[uid];
  if (kh && Array.isArray(kh.sourcesData)) {
    return kh.sourcesData
      .filter(s => s.mergeStatus === 'PENDING')
      .map(s => ({
        sourceId: s.sourceId, source: s.source, confidence: s.confidence, matchKey: s.matchKey,
        ten: s.dinh_danh?.ten || '—', sdt: s.dinh_danh?.sdt || '—',
        email: s.dinh_danh?.email || '—', cccd: s.dinh_danh?.cccd || '—',
        contribution: s.note || '—',
      }));
  }
  return SUSPECT_DUPLICATES[uid] || [];
}

// Tổng số mã KH đang nghi trùng (gồm cả nhóm tin cậy thấp).
function suspectCount(uid) {
  return suspectFragments(uid).length;
}

// Hồ sơ NEO (anchor) của một cụm nghi trùng — hồ sơ gốc đã tồn tại mà các mảnh nghi trùng
// đang chờ được gộp VÀO. Trước khi hợp nhất chưa có UID CDP chung, nên màn Đối soát hiển thị
// MÃ NGUỒN của hồ sơ neo (không phải UID). Ưu tiên mảnh đã AUTO_MERGED bằng khóa mạnh
// (độ tin cậy cao nhất); nếu cụm chưa có mảnh nào gộp thì lấy mảnh nghi trùng tin cậy cao nhất làm neo.
function anchorFragment(uid) {
  const kh = KH_DETAIL[uid];
  if (kh && Array.isArray(kh.sourcesData)) {
    const merged = kh.sourcesData.filter(s => s.mergeStatus === 'AUTO_MERGED');
    if (merged.length) return merged.sort((a,b) => b.confidence - a.confidence)[0];
  }
  const frags = suspectFragments(uid);
  return frags.length ? [...frags].sort((a,b) => b.confidence - a.confidence)[0] : null;
}

const segBadgeColor = (s) => SEGMENT_RISK.some(r => s.includes(r.slice(0,6))) || s.includes('rời bỏ') || s.includes('hoàn') || s.includes('gian lận') ? 'badge-red' : SEGMENT_GREEN.some(g => s.includes(g.slice(0,6))) || s.includes('trung thành') || s.includes('KHL') || s.includes('shop') ? 'badge-green' : 'badge-blue';

const lagBadge = (lag, warn) => {
  if (warn) return <span className="tabular-nums text-red-600 font-bold">{lag.toLocaleString()}</span>;
  if (lag > 1000) return <span className="tabular-nums text-yellow-600 font-semibold">{lag.toLocaleString()}</span>;
  return <span className="tabular-nums text-gray-500">{lag}</span>;
};

const scoreGauge = (val, label) => {
  let bg = '#16A34A';
  if (val >= 70) bg = '#DC2626';
  else if (val >= 40) bg = '#F59E0B';
  return (
    <div className="flex flex-col items-center gap-1">
      <div className="gauge-outer" style={{ border: `4px solid ${bg}`, color: bg }}>{val}</div>
      <div className="text-xs text-gray-500">{label}</div>
    </div>
  );
};

const rfmDot = (val) => {
  const colors = ['','#DC2626','#F59E0B','#d97706','#16A34A','#15803d'];
  return (
    <span className="inline-flex items-center gap-0.5">
      {[1,2,3,4,5].map(i => (
        <span key={i} style={{ width:10, height:10, borderRadius:'50%', background: i<=val ? colors[val] : '#e5e7eb', display:'inline-block' }}></span>
      ))}
      <span className="ml-1 font-bold tabular-nums" style={{ color: colors[val] }}>{val}</span>
    </span>
  );
};

const consentChip = (v, label) => {
  const cls = v==='in' ? 'consent-in' : v==='out' ? 'consent-out' : 'consent-unknown';
  const txt = v==='in' ? 'OPT IN' : v==='out' ? 'OPT OUT' : 'UNKNOWN';
  return <div className="flex items-center justify-between py-1.5 border-b border-gray-100 last:border-0">
    <span className="text-sm text-gray-600">{label}</span>
    <span className={`consent-chip ${cls}`}>{v==='in' ? '✓' : v==='out' ? '✕' : '?'} {txt}</span>
  </div>;
};

function CustomerListScreen({ onC360, initSegment }) {
  const [search, setSearch] = React.useState('');
  const [typeFilter, setTypeFilter] = React.useState('ALL');
  const [groupFilter, setGroupFilter] = React.useState('ALL');
  const [pillarFilter, setPillarFilter] = React.useState('ALL');
  const [statusFilter, setStatusFilter] = React.useState('ALL');
  const [segmentFilter, setSegmentFilter] = React.useState(initSegment || 'ALL');

  const filtered = CUSTOMERS.filter(c => {
    const q = search.toLowerCase();
    const matchQ = !q || c.name.toLowerCase().includes(q) || c.uid.toLowerCase().includes(q) || c.phone.includes(q);
    const matchT = typeFilter === 'ALL' || c.type === typeFilter;
    const matchG = groupFilter === 'ALL' || c.group === groupFilter;
    const matchP = pillarFilter === 'ALL' || c.pillar.toUpperCase().includes(pillarFilter.toUpperCase());
    const matchS = statusFilter === 'ALL' || c.status === statusFilter;
    const matchSeg = segmentFilter === 'ALL' || c.segment === segmentFilter;
    return matchQ && matchT && matchG && matchP && matchS && matchSeg;
  });

  return (
    <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
      {/* Toolbar */}
      <div className="panel" style={{ padding:'14px 16px' }}>
        <div className="flex items-center gap-2 flex-wrap">
          <div className="flex items-center gap-2" style={{ background:'var(--bg)', border:'1px solid var(--border)', borderRadius:10, padding:'7px 13px', flex:'1', minWidth:220, boxShadow:'var(--shadow-xs)' }}>
            <Icon name="search" />
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Tìm mã KH, tên, SĐT..." style={{ border:'none', background:'transparent', outline:'none', fontSize:13, width:'100%', padding:0 }} />
          </div>
          <span style={{ fontSize:12, color:'var(--muted)', whiteSpace:'nowrap' }}>Lọc:</span>
          <select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{ fontSize:12 }}>
            <option value="ALL">Tất cả loại</option>
            <option value="INDIVIDUAL">Cá nhân</option>
            <option value="BUSINESS">Doanh nghiệp</option>
          </select>
          <select value={groupFilter} onChange={e=>setGroupFilter(e.target.value)} style={{ fontSize:12 }}>
            <option value="ALL">Tất cả nhóm</option>
            {Object.keys(GROUP_LABEL).map(g => <option key={g} value={g}>{GROUP_LABEL[g]}</option>)}
          </select>
          <select value={pillarFilter} onChange={e=>setPillarFilter(e.target.value)} style={{ fontSize:12 }}>
            <option value="ALL">Tất cả mảng dịch vụ</option>
            {PILLARS.map(p => <option key={p.id} value={p.id}>{p.id} — {p.label.split('—')[1]?.trim()||p.label}</option>)}
          </select>
          <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{ fontSize:12 }}>
            <option value="ALL">Tất cả trạng thái</option>
            <option value="ACTIVE">Đang hoạt động</option>
            <option value="INACTIVE">Không hoạt động</option>
          </select>
          <select value={segmentFilter} onChange={e=>setSegmentFilter(e.target.value)} style={{ fontSize:12 }}>
            <option value="ALL">Tất cả phân khúc</option>
            {SEGMENTS.map(s => <option key={s.name} value={s.name}>{s.name}</option>)}
          </select>
        </div>
      </div>

      {/* Table */}
      <div className="panel">
        <div style={{ overflowX:'auto' }}>
        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
          <thead>
            <tr style={{ borderBottom:'1px solid #E5E7EB' }}>
              {['Mã khách hàng','Tên / Công ty','Loại','Nhóm','Mảng dịch vụ chính','SĐT','Tổng đơn','Doanh thu 12 tháng','Phân khúc','Trạng thái','Cập nhật'].map(h => (
                <th key={h} style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:800, color:'var(--muted)', whiteSpace:'nowrap', background:'var(--bg-2)', letterSpacing:'.03em' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map((c,i) => (
              <tr key={i} className="table-row" onClick={() => onC360(c.uid)} style={{ borderBottom:'1px solid #F3F4F6' }}>
                <td style={{ padding:'10px 12px', fontFamily:'monospace', fontSize:11, color:'#6B7280' }}>{c.uid}</td>
                <td style={{ padding:'10px 12px', fontWeight:600, color:'#2563EB' }}>{c.name}</td>
                <td style={{ padding:'10px 12px' }}>
                  <span className={`badge ${c.type==='INDIVIDUAL' ? 'badge-blue':'badge-purple'}`}>{c.type==='INDIVIDUAL' ? 'Cá nhân':'Doanh nghiệp'}</span>
                </td>
                <td style={{ padding:'10px 12px' }}><span className="badge badge-gray">{GROUP_LABEL[c.group]||c.group}</span></td>
                <td style={{ padding:'10px 12px', fontSize:12, fontWeight:600, color:'#374151', whiteSpace:'nowrap' }}>{c.pillar}</td>
                <td style={{ padding:'10px 12px', fontFamily:'monospace' }}>{c.phone.slice(0,3)+'***'+c.phone.slice(-3)}</td>

                <td style={{ padding:'10px 12px', textAlign:'right', fontWeight:600 }} className="tabular-nums">{c.revenue} ₫</td>

                  <span className={`badge ${segBadgeColor(c.segment)}`}>{c.segment}</span>
                </td>
                <td style={{ padding:'10px 12px' }}>{custStatusBadge(c.status)}</td>
                <td style={{ padding:'10px 12px', color:'#6B7280', fontSize:12 }}>{c.updated}</td>
              </tr>
            ))}
          </tbody>
        </table>
        </div>
        <div style={{ padding:'10px 16px', borderTop:'1px solid #F3F4F6', fontSize:12, color:'#6B7280' }}>
          Hiển thị {filtered.length} / {CUSTOMERS.length} khách hàng
        </div>
      </div>
    </div>
  );
}

// ============================================================
// IDENTITY SCREEN — 2-tầng: Card grid tổng quan → Bảng so sánh chi tiết
// ============================================================
function IdentityScreen({ onC360 }) {
  const [screenTab, setScreenTab] = React.useState('pending');
  const [selectedGroup, setSelectedGroup] = React.useState(null);
  const [compareView, setCompareView] = React.useState(false);
  const [selectedSources, setSelectedSources] = React.useState([]);
  const [modal, setModal] = React.useState(null);
  const [decisions, setDecisions] = React.useState({});

  const pendingGroups = GROUPS.filter(g => decisions[g.id] !== 'different');

  const confColor = (c) => c >= 90 ? '#16A34A' : c >= 75 ? '#F59E0B' : '#DC2626';
  const confBg    = (c) => c >= 90 ? '#dcfce7' : c >= 75 ? '#fef9c3' : '#fee2e2';

  const COMPARE_FIELDS = [
    { key:'name',    label:'Họ tên / Tên DN' },
    { key:'phone',   label:'Số điện thoại' },
    { key:'email',   label:'Email' },
    { key:'cccd',    label:'CCCD / MST' },
    { key:'address', label:'Tỉnh/TP' },
    { key:'role',    label:'Vai trò' },
    { key:'orders',  label:'Tổng đơn' },
  ];

  const openGroup = (g) => {
    setSelectedGroup(g);
    setSelectedSources(g.profiles.slice(0,3).map(p=>p.uid));
    setCompareView(false);
  };

  const toggleSource = (uid) => {
    setSelectedSources(prev =>
      prev.includes(uid) ? prev.filter(u => u !== uid) : [...prev, uid]
    );
  };

  const handleDecision = (type) => {
    setDecisions(d => ({ ...d, [selectedGroup.id]: type }));
    setModal(type);
  };

  // ── TẦNG 1: Danh sách nhóm ──
  if (!selectedGroup) return (
    <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
      <div style={{ display:'flex', gap:8, marginBottom:4 }}>
        {[
          { key:'pending', label:`Chờ xem xét (${pendingGroups.length})` },
          { key:'history', label:'Lịch sử merge' },
          { key:'unmerge', label:`Yêu cầu tách hồ sơ (${UNMERGE_REQUESTS.filter(r=>r.status==='CHỜ DUYỆT').length})` },
        ].map(t => (
          <button key={t.key} onClick={() => setScreenTab(t.key)}
            className={`tab-btn ${screenTab===t.key ? 'active':''}`}>{t.label}</button>
        ))}
      </div>

      {screenTab==='pending' && (
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          <div style={{ fontSize:12, color:'#6B7280' }}>
            Mỗi nhóm gồm các hồ sơ từ nhiều hệ thống mà BE xác định có thể là cùng 1 người. Độ tương đồng 60–89% — cần xác nhận thủ công.
          </div>
          {pendingGroups.map(g => (
            <div key={g.id} className="panel" style={{ padding:0, overflow:'hidden', cursor:'pointer' }}
              onClick={() => openGroup(g)}>
              {/* Header nhóm */}
              <div style={{ padding:'12px 16px', background:'#F7F8FA', borderBottom:'1px solid #E5E7EB', display:'flex', alignItems:'center', gap:12 }}>
                <div style={{ fontWeight:700, fontSize:13 }}>{g.id}</div>
                <span className={`badge ${g.type==='INDIVIDUAL' ? 'badge-blue':'badge-purple'}`}>{g.type==='INDIVIDUAL' ? 'Cá nhân':'Doanh nghiệp'}</span>
                <span className="badge badge-blue">{g.matchKey}</span>
                {g.warn && <span className="badge badge-red">⚠️ Có conflict</span>}
                <span style={{ marginLeft:'auto', fontSize:12, color:'#6B7280' }}>{g.profiles.length} nguồn</span>
                <span style={{ fontSize:12, color:'#8a5a00', fontWeight:600 }}>Xem chi tiết →</span>
              </div>
              {/* Card grid nguồn — preview nhỏ */}
              <div style={{ padding:16, display:'flex', gap:10, flexWrap:'wrap' }}>
                {g.profiles.map(p => (
                  <div key={p.uid} style={{ minWidth:140, padding:'10px 12px', border:'1px solid #E5E7EB', borderRadius:8, background:'white', position:'relative' }}>
                    <div style={{ fontSize:10, fontWeight:700, color:'#6B7280', marginBottom:4 }}>{p.source}</div>
                    <div style={{ fontSize:12, fontWeight:600, marginBottom:2 }}>{p.name}</div>
                    <div style={{ fontSize:11, color:'#6B7280', fontFamily:'monospace' }}>{p.phone}</div>
                    <div style={{ marginTop:8, display:'flex', alignItems:'center', gap:6 }}>
                      <div style={{ flex:1, height:4, borderRadius:2, background:'#E5E7EB' }}>
                        <div style={{ width:`${p.confidence}%`, height:'100%', borderRadius:2, background:confColor(p.confidence) }}></div>
                      </div>
                      <span style={{ fontSize:11, fontWeight:700, color:confColor(p.confidence) }}>{p.confidence}%</span>
                    </div>
                  </div>
                ))}
              </div>
              {/* Conflict summary */}
              {g.conflicts.length > 0 && (
                <div style={{ padding:'8px 16px', borderTop:'1px solid #FEF9C3', background:'#FFFBEB' }}>
                  {g.conflicts.map((c,i) => (
                    <div key={i} style={{ fontSize:12, color:'#d97706' }}>⚠️ {c}</div>
                  ))}
                </div>
              )}
            </div>
          ))}
          {pendingGroups.length === 0 && (
            <div style={{ padding:40, textAlign:'center', color:'#6B7280' }}>✅ Không còn nhóm nào chờ xem xét</div>
          )}
        </div>
      )}

      {screenTab==='history' && (
        <div className="panel" style={{ overflow:'hidden' }}>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
            <thead>
              <tr style={{ borderBottom:'1px solid #E5E7EB', background:'#F7F8FA' }}>
                {['ID','Loại','Mã KH chính','Mã KH gộp vào','Độ tin cậy','Khóa trùng','Người quyết định','Thời điểm'].map(h => (
                  <th key={h} style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280', whiteSpace:'nowrap' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {MERGE_HISTORY.map(m => (
                <tr key={m.id} style={{ borderBottom:'1px solid #F3F4F6' }}>
                  <td style={{ padding:'10px 12px', fontFamily:'monospace', fontSize:12 }}>{m.id}</td>
                  <td style={{ padding:'10px 12px' }}>
                    <span className={`badge ${m.type==='AUTO_MERGE' ? 'badge-blue':'badge-green'}`}>{m.type==='AUTO_MERGE' ? 'Tự động':'Thủ công'}</span>
                  </td>
                  <td style={{ padding:'10px 12px', fontSize:12, color:'#2563EB', fontFamily:'monospace' }}>{m.uidMaster}</td>
                  <td style={{ padding:'10px 12px', fontSize:12, color:'#7c3aed', fontFamily:'monospace' }}>{m.uidMerged}</td>
                  <td style={{ padding:'10px 12px', fontWeight:700, color:confColor(m.confidence) }}>{m.confidence}%</td>
                  <td style={{ padding:'10px 12px', fontSize:12 }}><span className="badge badge-blue">{m.matchKeys}</span></td>
                  <td style={{ padding:'10px 12px', fontSize:12, color:'#6B7280' }}>{m.by}</td>
                  <td style={{ padding:'10px 12px', fontSize:12, color:'#6B7280', whiteSpace:'nowrap' }}>{m.at}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {screenTab==='unmerge' && (
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          <div style={{ padding:12, background:'#fef9c3', border:'1px solid #F59E0B', borderRadius:8, fontSize:12, color:'#d97706' }}>
            Chỉ Admin mới có thể phê duyệt hoặc từ chối yêu cầu Unmerge.
          </div>
          <div className="panel" style={{ overflow:'hidden' }}>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
              <thead>
                <tr style={{ borderBottom:'1px solid #E5E7EB', background:'#F7F8FA' }}>
                  {['ID','Mã KH liên quan','Người báo cáo','Thời gian','Lý do','Trạng thái',''].map(h => (
                    <th key={h} style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280' }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {UNMERGE_REQUESTS.map(r => (
                  <tr key={r.id} style={{ borderBottom:'1px solid #F3F4F6' }}>
                    <td style={{ padding:'10px 12px', fontFamily:'monospace', fontSize:12 }}>{r.id}</td>
                    <td style={{ padding:'10px 12px', fontSize:12, color:'#2563EB', fontFamily:'monospace' }}>{r.uidMaster}</td>
                    <td style={{ padding:'10px 12px', fontSize:12, color:'#6B7280' }}>{r.reporter}</td>
                    <td style={{ padding:'10px 12px', fontSize:12, color:'#6B7280', whiteSpace:'nowrap' }}>{r.reportedAt}</td>
                    <td style={{ padding:'10px 12px', fontSize:12, maxWidth:260 }}>{r.reason}</td>
                    <td style={{ padding:'10px 12px' }}><span className="badge badge-yellow">{r.status}</span></td>
                    <td style={{ padding:'10px 12px' }}>
                      <div className="flex gap-2">
                        <button style={{ padding:'5px 10px', background:'#DC2626', color:'white', border:'none', borderRadius:6, fontSize:12, fontWeight:600, cursor:'pointer' }}>Phê duyệt</button>
                        <button style={{ padding:'5px 10px', background:'#f3f4f6', color:'#6B7280', border:'none', borderRadius:6, fontSize:12, cursor:'pointer' }}>Từ chối</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );

  // ── TẦNG 2: Chi tiết nhóm (card grid đầy đủ + bảng so sánh) ──
  const compareCols = selectedGroup.profiles.filter(p => selectedSources.includes(p.uid));

  // Kiểm tra field có conflict trong nhóm đang chọn không
  const hasConflict = (fieldKey) => {
    const vals = compareCols.map(p => String(p[fieldKey]||'—').toLowerCase().trim());
    const filled = vals.filter(v => v !== '—' && v !== '');
    return filled.length > 1 && new Set(filled).size > 1;
  };

  return (
    <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
      {modal && (
        <div className="modal-overlay" onClick={() => setModal(null)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div style={{ fontSize:16, fontWeight:700, marginBottom:8 }}>
              {modal==='confirmed' ? '✅ Đã ghi nhận — Cùng người' : modal==='different' ? '🚫 Đã ghi nhận — Tách nhóm' : '⏳ Để lại sau'}
            </div>
            <div style={{ fontSize:13, color:'#6B7280', marginBottom:16 }}>
              {modal==='confirmed' && 'Quyết định đã ghi nhận. BE sẽ merge toàn bộ hồ sơ trong nhóm thành 1 Hồ sơ chuẩn.'}
              {modal==='different' && 'Nhóm này sẽ được đánh dấu tách và không xuất hiện lại.'}
              {modal==='later' && 'Nhóm vẫn còn trong danh sách chờ.'}
            </div>
            <button onClick={() => { setModal(null); setSelectedGroup(null); }}
              className="btn-primary" style={{ width:'100%', padding:'10px', fontSize:14 }}>
              Đóng
            </button>
          </div>
        </div>
      )}

      {/* Breadcrumb */}
      <div className="flex items-center gap-2">
        <button onClick={() => setSelectedGroup(null)} style={{ background:'#f3f4f6', border:'none', borderRadius:6, padding:'6px 12px', fontSize:13, cursor:'pointer' }}>← Danh sách nhóm</button>
        <span style={{ color:'#6B7280', fontSize:13 }}>/</span>
        <span style={{ fontWeight:700, fontSize:14 }}>{selectedGroup.id}</span>
        <span className="badge badge-yellow" style={{ marginLeft:4 }}>PENDING</span>
        {selectedGroup.warn && <span className="badge badge-red">⚠️ Có conflict</span>}
      </div>

      {/* Toggle tầng 1/2 */}
      <div className="flex gap-2">
        <button onClick={() => setCompareView(false)}
          className={`tab-btn ${!compareView ? 'active':''}`}>📋 Tổng quan nguồn</button>
        <button onClick={() => setCompareView(true)}
          className={`tab-btn ${compareView ? 'active':''}`}>🔍 So sánh chi tiết</button>
      </div>

      {/* ── TẦNG 1: Card grid tổng quan ── */}
      {!compareView && (
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          <div style={{ fontSize:12, color:'#6B7280' }}>
            Khóa trùng: <strong>{selectedGroup.matchKey}</strong> · {selectedGroup.profiles.length} hồ sơ từ {selectedGroup.profiles.length} nguồn
          </div>

          {/* Cards */}
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(200px, 1fr))', gap:12 }}>
            {selectedGroup.profiles.map(p => (
              <div key={p.uid} style={{ border:`2px solid ${confColor(p.confidence)}22`, borderRadius:10, padding:14, background:'white', position:'relative' }}>
                {/* Source badge + confidence */}
                <div className="flex items-center justify-between mb-2">
                  <span style={{ fontSize:11, fontWeight:700, color:'white', background: p.confidence>=90 ? '#16A34A' : p.confidence>=75 ? '#F59E0B':'#DC2626', padding:'2px 8px', borderRadius:4 }}>
                    {p.source}
                  </span>
                  <span style={{ fontSize:12, fontWeight:800, color:confColor(p.confidence) }}>{p.confidence}%</span>
                </div>
                {/* UID */}
                <div style={{ fontSize:10, color:'#6B7280', fontFamily:'monospace', marginBottom:6 }}>{p.uid}</div>
                {/* Fields */}
                {[
                  { label:'Tên',    val:p.name },
                  { label:'SĐT',    val:p.phone },
                  { label:'Email',  val:p.email },
                  { label:'Địa chỉ',val:p.address },
                  { label:'Vai trò',val:p.role },
                  { label:'Đơn',    val:p.orders > 0 ? p.orders.toLocaleString() : '—' },
                ].map(f => (
                  <div key={f.label} style={{ display:'flex', justifyContent:'space-between', padding:'3px 0', borderBottom:'1px solid #F3F4F6' }}>
                    <span style={{ fontSize:11, color:'#9CA3AF' }}>{f.label}</span>
                    <span style={{ fontSize:11, fontWeight:500, color: f.val==='—' ? '#D1D5DB':'#1A1A1A', maxWidth:110, textAlign:'right', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{f.val}</span>
                  </div>
                ))}
                {/* Confidence bar */}
                <div style={{ marginTop:10, height:4, borderRadius:2, background:'#E5E7EB' }}>
                  <div style={{ width:`${p.confidence}%`, height:'100%', borderRadius:2, background:confColor(p.confidence) }}></div>
                </div>
              </div>
            ))}
          </div>

          {/* Conflict summary */}
          {selectedGroup.conflicts.length > 0 && (
            <div style={{ padding:12, background:'#FFFBEB', border:'1px solid #F59E0B', borderRadius:8 }}>
              <div style={{ fontSize:12, fontWeight:700, color:'#d97706', marginBottom:6 }}>⚠️ Conflict phát hiện</div>
              {selectedGroup.conflicts.map((c,i) => <div key={i} style={{ fontSize:12, color:'#92400E' }}>• {c}</div>)}
            </div>
          )}

          <div style={{ fontSize:12, color:'#6B7280' }}>
            Muốn so sánh field-by-field? Chọn tab <strong>So sánh chi tiết</strong> và chọn các nguồn cần xem.
          </div>
        </div>
      )}

      {/* ── TẦNG 2: Bảng so sánh chi tiết ── */}
      {compareView && (
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          {/* Chọn nguồn để so sánh */}
          <div style={{ padding:12, background:'#F7F8FA', borderRadius:8, border:'1px solid #E5E7EB' }}>
            <div style={{ fontSize:12, fontWeight:600, marginBottom:8 }}>Chọn nguồn để so sánh:</div>
            <div className="flex gap-2 flex-wrap">
              {selectedGroup.profiles.map(p => (
                <button key={p.uid} onClick={() => toggleSource(p.uid)}
                  style={{ padding:'5px 12px', borderRadius:6, fontSize:12, fontWeight:600, cursor:'pointer', border:`2px solid ${selectedSources.includes(p.uid) ? confColor(p.confidence) : '#E5E7EB'}`, background: selectedSources.includes(p.uid) ? confBg(p.confidence) : 'white', color: selectedSources.includes(p.uid) ? confColor(p.confidence) : '#6B7280' }}>
                  {p.source} ({p.confidence}%)
                </button>
              ))}
            </div>
          </div>

          {/* Bảng so sánh */}
          <div className="panel" style={{ overflow:'auto' }}>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
              <thead>
                <tr style={{ borderBottom:'1px solid #E5E7EB', background:'#F7F8FA' }}>
                  <th style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280', width:120, position:'sticky', left:0, background:'#F7F8FA' }}>Trường</th>
                  {compareCols.map(p => (
                    <th key={p.uid} style={{ padding:'10px 12px', fontSize:11, fontWeight:700, minWidth:160 }}>
                      <div style={{ color:confColor(p.confidence) }}>{p.source}</div>
                      <div style={{ fontFamily:'monospace', fontWeight:400, color:'#6B7280', fontSize:10 }}>{p.uid}</div>
                      <div style={{ marginTop:4, height:3, borderRadius:2, background:'#E5E7EB' }}>
                        <div style={{ width:`${p.confidence}%`, height:'100%', borderRadius:2, background:confColor(p.confidence) }}></div>
                      </div>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {COMPARE_FIELDS.map(f => {
                  const conflict = hasConflict(f.key);
                  return (
                    <tr key={f.key} style={{ borderBottom:'1px solid #F3F4F6', background: conflict ? '#FFFBEB':'white' }}>
                      <td style={{ padding:'9px 12px', fontWeight:600, color:'#6B7280', fontSize:12, position:'sticky', left:0, background: conflict ? '#FFFBEB':'white' }}>
                        {conflict && <span style={{ color:'#d97706', marginRight:4 }}>⚠️</span>}
                        {f.label}
                      </td>
                      {compareCols.map(p => {
                        const val = String(p[f.key]||'—');
                        const isEmpty = val === '—' || val === '';
                        return (
                          <td key={p.uid} style={{ padding:'9px 12px', color: isEmpty ? '#D1D5DB':'#1A1A1A', fontStyle: isEmpty ? 'italic':'' }}>
                            {!isEmpty && conflict && <span style={{ color:'#16A34A', marginRight:4 }}>•</span>}
                            {val}
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* Nút quyết định */}
      <div style={{ padding:16, background:'#F7F8FA', borderRadius:8, border:'1px solid #E5E7EB' }}>
        <div style={{ fontSize:12, color:'#6B7280', marginBottom:12 }}>
          Quyết định của bạn được ghi nhận và BE xử lý merge. BE tự chọn Hồ sơ chuẩn master và ưu tiên field theo rule nguồn dữ liệu.
        </div>
        <div className="flex gap-2">
          <button onClick={() => handleDecision('confirmed')}
            style={{ flex:2, padding:'11px', background:'var(--success)', color:'white', border:'none', borderRadius:10, fontSize:13, fontWeight:700, cursor:'pointer', boxShadow:'0 2px 6px rgba(22,163,74,.25)' }}>
            ✓ Cùng người — Xác nhận merge {selectedGroup.profiles.length} hồ sơ
          </button>
          <button onClick={() => handleDecision('different')}
            className="btn-ghost" style={{ flex:2, padding:'11px', fontSize:13 }}>
            ✗ Tách nhóm — Không phải cùng người
          </button>
          <button onClick={() => handleDecision('later')}
            style={{ flex:1, padding:'11px', background:'transparent', color:'var(--muted)', border:'1px solid var(--border)', borderRadius:10, fontSize:12, cursor:'pointer' }}>
            Để sau
          </button>
        </div>
      </div>
    </div>
  );
}

    const rbac = {

      clv:          ['CSKH','Marketing','Kinh doanh','Admin'],
      churn:        ['CSKH','Marketing','Kinh doanh','Admin'],
      engagement:   ['CSKH','Marketing','Admin'],
      codRisk:      ['Kinh doanh','Vận hành','Admin'],
      fraud:        ['Kinh doanh','Vận hành','Admin'],
      linkedProfiles:['CSKH','Marketing','Kinh doanh','Vận hành','Data Steward','Admin'],

    { key:'overview',   label:'Tổng quan' },

            <div className="flex items-center gap-2 mt-2 flex-wrap">
              <span className={`badge ${kh.type==='INDIVIDUAL' ? 'badge-blue':'badge-purple'}`}>{kh.type==='INDIVIDUAL' ? 'Cá nhân':'Doanh nghiệp'}</span>
              <span className="badge badge-gray">{GROUP_LABEL[kh.group]||kh.group}</span>

            { label:'Điểm tích lũy', value: kh.loyalty?.points != null ? kh.loyalty.points.toLocaleString() : '—', unit:' pt', color:'var(--purple)' },

              <div style={{ fontSize:15, fontWeight:900, color:k.color||'var(--text)', letterSpacing:'-.01em' }} className="tabular-nums">{k.value}{k.unit}</div>

      <div className="tabs-strip">
        {tabs.map(t => (

            const g = src[groupKey] || {};
            const v = g[fieldKey];
            if (v === null || v === undefined) return '—';
            return String(v);
          };

          const isAbsent = (v) => !v || v === '—' || v === 'null' || v === 'undefined';

          const hasConflict = (golden, srcVal) => {
            if (isAbsent(golden) || isAbsent(srcVal)) return false;
            return golden.toLowerCase().trim() !== srcVal.toLowerCase().trim();
          };

          if (sources.length === 0) {

          }

          return (

                    </thead>
                    <tbody>
                      {FIELD_GROUPS.map((fg, gi) => (

                              {fg.group.toUpperCase()}
                            </td>
                          </tr>
                          {fg.fields.map((f, fi) => {
                            const goldenVal = String(f.golden || '—');
                            const srcVals = sources.map(s => getVal(s, fg.dataKey, f.key));
                            const anyConflict = srcVals.some(v => hasConflict(goldenVal, v));
                            return (
                              <tr key={fi} style={{ borderBottom:'1px solid #F3F4F6', background: anyConflict ? '#FFFBEB' : 'white' }}>
                                <td style={{ padding:'9px 14px', fontWeight:600, color:'#6B7280', fontSize:11, position:'sticky', left:0, background: anyConflict ? '#FFFBEB' : 'white', whiteSpace:'nowrap' }}>
                                  {anyConflict && <span style={{ color:'#d97706', marginRight:4 }}>⚠️</span>}
                                  {f.label}
                                </td>
                                {/* Hồ sơ chuẩn */}
                                <td style={{ padding:'9px 14px', background:'#f0fdf4', borderLeft:'3px solid #16A34A', fontWeight:500, color: isAbsent(goldenVal) ? '#D1D5DB' : '#1A1A1A', fontStyle: isAbsent(goldenVal) ? 'italic':'normal' }}>
                                  {goldenVal}
                                </td>
                                {/* Nguồn */}
                                {srcVals.map((v, si) => {
                                  const conflict = hasConflict(goldenVal, v);
                                  const absent = isAbsent(v);
                                  return (
                                    <td key={si} style={{ padding:'9px 14px', background: conflict ? '#FFFBEB' : absent ? '#FAFAFA' : 'white', color: conflict ? '#d97706' : absent ? '#D1D5DB' : '#1A1A1A', fontStyle: absent ? 'italic':'normal' }}>

        {/* DOANH NGHIỆP */}

                    { label:'Quá hạn',         value:kh.debt.overdue+' ₫', color: kh.debt.overdueDays>0 ? '#DC2626':'#16A34A' },

                      <div style={{ fontSize:11, color:'#6B7280', marginBottom:4 }}>{k.label}</div>

                    </div>
                  ))}

              </div>

            {/* Row 3: Lịch sử đối soát COD theo tháng */}
            {kh.codHistory && (
              <div>
                <div className="section-title">Lịch sử đối soát COD theo tháng</div>

                    <tr style={{ borderBottom:'1px solid #E5E7EB', background:'#F7F8FA' }}>

          // trừ HCC (dịch vụ công) dùng "số hồ sơ đã xử lý" thay cho doanh thu.
          // Dữ liệu mock cho prototype: tất cả mảng đều hiển thị chỉ số để stakeholder hình dung đầy đủ.
          const PILLAR_MOCK = {

            TCBC:      { fields:[['Doanh thu phí dịch vụ', '18.500.000 ₫'],['Tổng giá trị giao dịch', '2.340.000.000 ₫'],['Số giao dịch 12 tháng', '412 giao dịch'],['Giá trị giao dịch TB', '5.680.000 ₫'],['Kênh chính', 'Tại quầy'],['Loại giao dịch nhiều nhất', 'Thu hộ COD']], signal:{ text:'Tiềm năng upsell: PayPost thu hộ online', color:'var(--info)' } },
            PPBL:      { fields:[['Doanh thu bán lẻ 12 tháng', '96.700.000 ₫'],['Tổng đơn mua tại quầy', '284 đơn'],['Giá trị đơn trung bình', '340.000 ₫'],['Tần suất mua', '~24 đơn/tháng'],['Nhóm hàng mua nhiều', 'Tem, bao bì, VPP'],['Điểm bán thường dùng', 'BĐ Cầu Giấy']], signal:{ text:'Khách mua đều — có thể mời chương trình khách thân thiết', color:'var(--info)' } },
            HCC:       { fields:[['Số hồ sơ đã xử lý', '17 hồ sơ'],['Hồ sơ trả tại nhà', '12 hồ sơ'],['Thủ tục hay dùng', 'Cấp đổi giấy tờ'],['Tỷ lệ hồ sơ thành công', '94%'],['Thời gian xử lý TB', '3,2 ngày'],['Phí dịch vụ đã thu', '1.360.000 ₫']], signal:{ text:'Sử dụng ổn định dịch vụ hành chính công', color:'var(--success)' } },

            TMDT:      { fields:[['Doanh thu qua sàn 12 tháng', '268.000.000 ₫'],['GMV (tổng giá trị bán)', '1.240.000.000 ₫'],['Số shop online', '2 shop'],['Đơn giao chặng cuối', '1.560 đơn'],['Tỷ lệ hoàn TMĐT', '11%'],['Sàn chính', 'Shopee, TikTok Shop']], signal:{ text:'Shop online đang mở rộng — tiềm năng tăng trưởng', color:'var(--info)' } },
            MVNO:      { fields:[['Doanh thu cước viễn thông', '2.400.000 ₫'],['Gói cước đang dùng', 'Gói data 4G tháng'],['Tổng nạp cước 12 tháng', '2.400.000 ₫'],['Lưu lượng data đã dùng', '84 GB'],['Ngày hết hạn gói', '15/07/2026'],['Số thuê bao', '1 thuê bao']], signal:{ text:'Gói cước sắp hết hạn — nhắc gia hạn', color:'var(--warn)' } },
          };
          const rows = PILLARS.map(p => {
            const isActive = (kh.activePillars||[]).includes(p.id);
            const mock = PILLAR_MOCK[p.id] || { fields:[], signal:{ text:'Chưa sử dụng', color:'var(--muted)' } };
            return { ...p, active: isActive, fields: isActive ? mock.fields : [], signal: isActive ? mock.signal : { text:'Chưa sử dụng', color:'var(--muted)' } };

          const current = pillarSubTab ? rows.find(r => r.id===pillarSubTab) : null;
          const active = current || rows[0];
          return (
            <div>
              <div style={{ fontSize:12, color:'var(--muted)', marginBottom:14, lineHeight:1.6 }}>
                Chọn từng mảng dịch vụ để xem chỉ số riêng. Riêng mảng <strong>BCCP</strong> có thêm chi tiết giao dịch và đối soát COD ở bên dưới.
              </div>
              <div className="tabs-strip" style={{ marginBottom:16 }}>
                {rows.map(r => (
                  <button key={r.id} onClick={() => setPillarSubTab(r.id)}
                    className={`tab-btn ${(active.id===r.id) ? 'active':''}`}>
                    {r.label.split('—')[0].trim()} {r.active ? '●' : '○'}
                  </button>
                ))}
              </div>
              <div style={{ border:'1px solid var(--border)', borderRadius:10, padding:20 }}>
                <div className="flex items-center gap-2 mb-3 flex-wrap">
                  <span style={{ fontWeight:800, fontSize:14 }}>{active.label}</span>
                  <span className={`badge ${active.active ? 'badge-green' : 'badge-gray'}`}>{active.active ? 'Đang dùng' : 'Chưa dùng'}</span>
                </div>
                <div style={{ fontSize:12, color:'var(--muted)', marginBottom:14 }}>Hệ thống sử dụng: {active.system}</div>
                {active.fields.length>0 ? (
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))', gap:12, marginBottom:14 }}>
                    {active.fields.map(([l,v],i) => (
                      <div key={i} style={{ padding:'10px 12px', background:'var(--bg)', borderRadius:10, border:'1px solid var(--line)' }}>
                        <div style={{ fontSize:11, color:'var(--muted)', marginBottom:4, fontWeight:600 }}>{l}</div>
                        <div style={{ fontSize:15, fontWeight:800 }} className="tabular-nums">{v}</div>
                      </div>
                    ))}
                  </div>

                  <div style={{ padding:20, textAlign:'center', color:'var(--muted)', fontSize:13, background:'var(--bg)', borderRadius:10, marginBottom:14 }}>Chưa phát sinh dữ liệu cho mảng dịch vụ này</div>

                {/* COD — Thu hộ: chỉ riêng mảng BCCP (COD là nghiệp vụ đặc thù của bưu chính chuyển phát) */}
                {active.id==='BCCP' && active.active && kh.cod && (
                  <div style={{ marginTop:6, marginBottom:16, paddingTop:16, borderTop:'1px solid var(--line)' }}>
                    <div className="section-title">COD — Thu hộ</div>
                    <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))', gap:8 }}>
                      {[
                        { label:'Tổng COD', value:kh.cod.total+' ₫', bg:'var(--success-soft)', color:'var(--success)' },
                        { label:'Đã thu',   value:kh.cod.collected+' ₫', bg:'var(--info-soft)', color:'var(--info)' },
                        { label:'Chưa thu', value:kh.cod.pending+' ₫', bg: parseFloat(kh.cod.pending.replace(/\./g,''))>0 ? 'var(--danger-soft)':'var(--line)', color: parseFloat(kh.cod.pending.replace(/\./g,''))>0 ? 'var(--danger)':'var(--muted)' },
                        { label:'Đối soát', value: kh.cod.status==='MATCHED'?'Khớp':kh.cod.status==='DISCREPANCY'?'Chênh lệch':'Đang chờ', bg: kh.cod.status==='MATCHED'?'var(--success-soft)':kh.cod.status==='DISCREPANCY'?'var(--danger-soft)':'var(--warn-soft)', color: kh.cod.status==='MATCHED'?'var(--success)':kh.cod.status==='DISCREPANCY'?'var(--danger)':'var(--warn)' },
                      ].map((k,i) => (
                        <div key={i} style={{ background:k.bg, borderRadius:10, padding:12 }}>
                          <div style={{ fontSize:11, color:'var(--muted)', marginBottom:4 }}>{k.label}</div>
                          <div style={{ fontSize:14, fontWeight:800, color:k.color }} className="tabular-nums">{k.value}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Đóng góp theo nguồn dữ liệu: chỉ riêng BCCP */}
                {active.id==='BCCP' && active.active && (() => {
                  const srcRows = (kh.sourcesData||[])
                    .filter(s => s.giao_dich && (s.giao_dich.tongDon > 0 || s.giao_dich.cod !== '—'))
                    .map(s => ({ source:s.source, vaiTro:s.giao_dich.vaiTro||'—', tongDon:s.giao_dich.tongDon>0 ? s.giao_dich.tongDon.toLocaleString() : '—', cod:s.giao_dich.cod||'—' }));
                  if (srcRows.length === 0) return null;
                  return (
                    <div style={{ marginBottom:16 }}>
                      <div className="section-title">Đóng góp theo nguồn dữ liệu</div>

                        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
                          <thead>
                            <tr style={{ background:'var(--bg-2)', borderBottom:'1px solid var(--border)' }}>
                              {['Nguồn','Vai trò','Số đơn','COD đóng góp'].map(h => (
                                <th key={h} style={{ padding:'9px 12px', textAlign:'left', fontSize:11, fontWeight:800, color:'var(--muted)' }}>{h}</th>

                            </tr>
                          </thead>
                          <tbody>
                            {srcRows.map((r,i) => (
                              <tr key={i} style={{ borderBottom:'1px solid var(--line)' }}>

                                <td style={{ padding:'9px 12px', fontSize:12 }}>{r.vaiTro}</td>
                                <td style={{ padding:'9px 12px', fontSize:12, fontWeight:600 }} className="tabular-nums">{r.tongDon}</td>
                                <td style={{ padding:'9px 12px', fontSize:12, fontWeight:600, color: r.cod!=='—'?'var(--success)':'var(--muted)' }} className="tabular-nums">{r.cod !== '—' ? r.cod+' ₫' : '—'}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  );

              </div>
            </div>
          );
        })()}

        {/* HÀNH VI SỐ */}
        {tab==='behavior' && (() => {
          const channels = [...new Set((kh.timeline||[]).map(e => e.channel))];
          const lastCampaign = (kh.timeline||[]).find(e => e.type === 'campaign');
          return (
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20 }}>
            <div>
              <div className="section-title">Thông tin thiết bị & App</div>
              {[
                ['Lần đăng nhập cuối', kh.appLogin],
                ['Thiết bị', kh.device],
                ['Phiên/30 ngày', kh.sessions30d ?? 'Chưa có dữ liệu'],

                <div key={l} style={{ display:'flex', justifyContent:'space-between', padding:'7px 0', borderBottom:'1px solid #F3F4F6' }}>
                  <span className="field-label" style={{ margin:0 }}>{l}</span>
                  <span style={{ fontSize:13, fontWeight:500 }}>{v}</span>
                </div>
              ))}

              <div className="section-title mt-4">Mức độ tương tác</div>
              {[
                ['Điểm tương tác (Engagement)', canSee('engagement') ? `${kh.scores.engagement}/100` : '🔒 Không có quyền xem'],
                ['Số kênh đã tương tác', channels.length ? `${channels.length} kênh (${channels.join(', ')})` : 'Chưa có dữ liệu'],
                ['Phản hồi chiến dịch gần nhất', lastCampaign ? `${lastCampaign.label} — ${lastCampaign.time}` : 'Chưa ghi nhận phản hồi campaign'],
              ].map(([l,v]) => (
                <div key={l} style={{ display:'flex', justifyContent:'space-between', gap:12, padding:'7px 0', borderBottom:'1px solid #F3F4F6' }}>
                  <span className="field-label" style={{ margin:0 }}>{l}</span>
                  <span style={{ fontSize:13, fontWeight:500, textAlign:'right' }}>{v}</span>
                </div>
              ))}

              {kh.lastOrder && (
                <div style={{ marginTop:16 }}>
                  <div className="section-title">Đơn hàng gần nhất</div>
                  {[
                    ['Mã đơn', kh.lastOrder.id],
                    ['Loại dịch vụ', kh.lastOrder.type],
                    ['Giá trị', `${kh.lastOrder.amount} ₫`],
                    ['Ngày tạo', kh.lastOrder.date],
                  ].map(([l,v]) => (
                    <div key={l} style={{ display:'flex', justifyContent:'space-between', padding:'7px 0', borderBottom:'1px solid #F3F4F6' }}>
                      <span className="field-label" style={{ margin:0 }}>{l}</span>
                      <span style={{ fontSize:13, fontWeight:500, fontFamily: l==='Mã đơn' ? 'monospace':'inherit' }}>{v}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div>
              <div className="section-title">Timeline sự kiện</div>
              <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                {kh.timeline.map((e,i) => (
                  <div key={i} className="flex gap-3">
                    <div style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
                      <div className="timeline-dot" style={{ background:e.color, marginTop:2 }}></div>
                      {i<kh.timeline.length-1 && <div style={{ width:2, flex:1, background:'#E5E7EB', minHeight:20 }}></div>}

                    <div style={{ paddingBottom:10 }}>
                      <div style={{ fontSize:12, color:'#6B7280' }}>{e.time} · {e.channel}</div>

                    </div>

                ))}

        })()}

        {/* CSKH */}
        {tab==='cskh' && (
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12 }}>
            {[
              { label:'Tổng khiếu nại', value:kh.complaints.total, color:'#1A1A1A' },
              { label:'Đang mở', value:kh.complaints.open, color: kh.complaints.open>0 ? '#DC2626' : '#16A34A' },

              { label:'SLA đúng hạn', value:`${kh.complaints.sla}%`, color: kh.complaints.sla>=90 ? '#16A34A' : '#F59E0B' },

        {/* ĐIỂM SỐ */}

                    <div key={l}>
                      <div style={{ fontSize:11, color:'#6B7280', marginBottom:4 }}>{l}</div>

            {canSee('clv') ? (

            </div>
          </div>

        {/* ĐỒNG Ý DỮ LIỆU */}
        {tab==='consent' && (() => {
          const matrix = [
            { purpose:'Thông báo vận hành',   desc:'Trạng thái đơn hàng, dịch vụ đang sử dụng — cần thiết để cung cấp dịch vụ',  sms:'in', email:'in', zalo:'in', push:'in' },
            { purpose:'Chăm sóc khách hàng',  desc:'Gọi điện/nhắn tin hỗ trợ, khảo sát mức độ hài lòng',                          sms:kh.consent.sms, email:kh.consent.email, zalo:kh.consent.zalo, push:kh.consent.push },
            { purpose:'Tiếp thị & ưu đãi',    desc:'Giới thiệu dịch vụ mới, chương trình khuyến mãi',                            sms:kh.consent.sms, email:kh.consent.email, zalo:kh.consent.zalo, push:'out' },
          ];
          const CHANNEL_LABEL = { sms:'SMS', email:'Email', zalo:'Zalo OA', push:'Thông báo đẩy (Push)' };
          const cellChip = (v) => {
            const cls = v==='in' ? 'consent-in' : v==='out' ? 'consent-out' : 'consent-unknown';
            const txt = v==='in' ? 'Cho phép' : v==='out' ? 'Từ chối' : 'Chưa xác định';
            return <span className={`consent-chip ${cls}`}>{v==='in' ? '✓' : v==='out' ? '✕' : '?'} {txt}</span>;
          };
          return (
            <div>
              {kh.consent.deletionRequested && (
                <div style={{ padding:12, background:'#fee2e2', border:'1px solid #DC2626', borderRadius:8, marginBottom:16, fontWeight:700, color:'#DC2626', fontSize:14 }}>
                  🚫 Khách hàng đã yêu cầu xoá dữ liệu cá nhân — không sử dụng hồ sơ này cho bất kỳ mục đích nào ngoài nghĩa vụ pháp lý.
                </div>
              )}

              <div style={{ fontSize:12, color:'#6B7280', marginBottom:14, lineHeight:1.6 }}>
                Bảng dưới đây cho biết khách hàng <strong>cho phép hay từ chối</strong> nhận liên hệ theo từng <strong>mục đích</strong> (hàng) và từng <strong>kênh liên hệ</strong> (cột).
                Ví dụ: nếu ô "Tiếp thị & ưu đãi" × "SMS" hiển thị <strong>Cho phép</strong>, nghĩa là được phép gửi SMS khuyến mãi cho khách hàng này; nếu <strong>Từ chối</strong> thì tuyệt đối không gửi.
                "Thông báo vận hành" luôn ở trạng thái Cho phép vì là nghĩa vụ thực hiện dịch vụ, không thuộc phạm vi xin sự đồng ý.
              </div>

              <div className="table-wrap-x" style={{ overflow:'auto', border:'1px solid #E5E7EB', borderRadius:8 }}>
                <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13, minWidth:640 }}>
                  <thead>
                    <tr style={{ background:'#F7F8FA', borderBottom:'1px solid #E5E7EB' }}>
                      <th style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280', minWidth:200 }}>Mục đích liên hệ</th>
                      {Object.keys(CHANNEL_LABEL).map(ch => (
                        <th key={ch} style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280' }}>{CHANNEL_LABEL[ch]}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {matrix.map((row,i) => (
                      <tr key={i} style={{ borderBottom:'1px solid #F3F4F6' }}>
                        <td style={{ padding:'10px 12px' }}>
                          <div style={{ fontWeight:700, fontSize:13 }}>{row.purpose}</div>
                          <div style={{ fontSize:11, color:'#6B7280', marginTop:2 }}>{row.desc}</div>
                        </td>
                        {Object.keys(CHANNEL_LABEL).map(ch => (
                          <td key={ch} style={{ padding:'10px 12px' }}>{cellChip(row[ch])}</td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              {/* Metadata consent */}
              <div className="meta-strip" style={{ marginTop:14 }}>
                <span>Nguồn thu thập: <b>MyVNPost App</b></span>
                <span>Ngày cập nhật: <b>18/06/2026 10:05</b></span>
                <span>Phiên bản điều khoản: <b>v2.1</b></span>
              </div>

                ['Ngày tạo', '10/01/2023'],

// ============================================================
// CN5 — SEGMENT MANAGEMENT
// ============================================================
function SegmentScreen({ onViewKH }) {
  const [view, setView] = React.useState('list');
  const [selectedSeg, setSelectedSeg] = React.useState(null);
  const [previewCount, setPreviewCount] = React.useState(null);
  const [segName, setSegName] = React.useState('');
  const [segType, setSegType] = React.useState('Phân khúc động');
  const [segPillar, setSegPillar] = React.useState('ALL');
  const [segFreq, setSegFreq] = React.useState('Hàng ngày lúc 02:00');
  // Điều kiện dạng CÂY NHÓM LỒNG: mỗi node là nhóm { logic:'AND'|'OR', children:[...] }
  // hoặc điều kiện lá { field, op, value }. Nhóm chứa được cả lá lẫn nhóm con → lồng nhiều cấp.
  const MAX_DEPTH = 3;
  const newLeaf = () => ({ field:'Điểm rời bỏ', op:'≥', value:'' });
  const newGroup = () => ({ logic:'AND', children:[ newLeaf() ] });
  const [ruleTree, setRuleTree] = React.useState({
    logic:'OR',
    children:[
      { logic:'AND', children:[ { field:'Điểm rời bỏ', op:'≥', value:'70' }, { field:'Ngày GD gần nhất', op:'<', value:'90 ngày trước' } ] },
      { logic:'AND', children:[ { field:'Nhóm khách hàng', op:'=', value:'KHL' }, { field:'Tổng doanh thu', op:'≥', value:'1.000.000.000' } ] },
    ],
  });
  const [modal, setModal] = React.useState(false);
  const [statuses, setStatuses] = React.useState(SEGMENTS.map(s => s.status));

  const FIELDS = ['Loại khách hàng','Nhóm khách hàng','Tỉnh / Thành phố','Điểm rời bỏ','Điểm rủi ro COD','Tỷ lệ hoàn','Tổng đơn','Tổng doanh thu','Nhóm RFM','Ngày GD gần nhất','Vai trò'];
  const OPS = ['=','≠','>','<','≥','≤','chứa','thuộc'];

  const isGroup = (n) => n && Array.isArray(n.children);
  // Cập nhật cây bất biến theo đường dẫn (mảng index). path=[] là gốc.
  const updateAt = (node, path, fn) => {
    if (path.length === 0) return fn(node);
    const [i, ...rest] = path;
    const children = node.children.map((c,j) => j===i ? updateAt(c, rest, fn) : c);
    return { ...node, children };
  };
  const setTreeAt = (path, fn) => setRuleTree(t => updateAt(t, path, fn));
  const addLeafTo    = (path) => setTreeAt(path, g => ({ ...g, children:[...g.children, newLeaf()] }));
  const addGroupTo   = (path) => setTreeAt(path, g => ({ ...g, children:[...g.children, newGroup()] }));
  const removeChildAt = (path, i) => setTreeAt(path, g => ({ ...g, children: g.children.filter((_,j) => j!==i) }));
  const setLogicAt   = (path, logic) => setTreeAt(path, g => ({ ...g, logic }));
  const setLeafAt    = (path, i, patch) => setTreeAt(path, g => ({ ...g, children: g.children.map((c,j) => j===i ? { ...c, ...patch } : c) }));

  // Sinh câu tóm tắt tiếng Việt từ cây điều kiện (JSX có màu). Nhóm con bọc trong ngoặc đơn.
  const opWord = (logic) => logic === 'AND' ? 'VÀ' : 'HOẶC';
  const opColor = (logic) => logic === 'AND' ? 'var(--and,#8a5a00)' : 'var(--info)';
  const summarize = (node, top=false) => {
    if (!isGroup(node)) {
      return <span key={Math.random()}><b>{node.field || '—'}</b> {node.op} <span style={{ color:'var(--info)', fontWeight:700 }}>{node.value || '?'}</span></span>;
    }
    const parts = [];
    node.children.forEach((c,i) => {
      if (i > 0) parts.push(<span key={'op'+i} style={{ color:opColor(node.logic), fontWeight:800 }}> {opWord(node.logic)} </span>);
      const inner = summarize(c);
      parts.push(isGroup(c) ? <span key={'g'+i}>({inner})</span> : <span key={'l'+i}>{inner}</span>);
    });
    return <span>{parts}</span>;
  };

  const toggleStatus = (i) => setStatuses(prev => prev.map((s,j) => j===i ? (s==='Đang hoạt động' ? 'Tạm dừng' : 'Đang hoạt động') : s));

  // Component đệ quy dựng 1 nhóm điều kiện — layout DÀN Ý THỤT LỀ: đường kẻ dọc màu + thụt lề,
  // không dùng khung viền bao. Giữ toggle nhãn "BẤT KỲ (OR) / TẤT CẢ (AND)".
  const RuleGroup = ({ node, path, depth, onRemove }) => {
    const logicColor = node.logic === 'AND' ? '#8a5a00' : 'var(--info)';
    return (
      <div>
        {/* Header nhóm: toggle AND/OR (nổi bật) + chú thích + xóa nhóm */}
        <div className="flex items-center gap-2 flex-wrap" style={{ marginBottom:10 }}>
          <div style={{ display:'inline-flex', border:'1px solid var(--border)', borderRadius:8, overflow:'hidden' }}>
            {['OR','AND'].map(l => (
              <button key={l} onClick={() => setLogicAt(path, l)}
                style={{ padding:'5px 14px', fontSize:11, fontWeight:800, border:'none', cursor:'pointer',
                         background: node.logic===l ? (l==='AND'?'#8a5a00':'var(--info)') : 'white', color: node.logic===l ? 'white' : 'var(--muted)' }}>
                {l === 'AND' ? 'TẤT CẢ (AND)' : 'BẤT KỲ (OR)'}
              </button>
            ))}
          </div>
          <span style={{ fontSize:11, color:'var(--muted)' }}>
            — khớp {node.logic === 'AND' ? 'mọi điều kiện dưới đây' : 'ít nhất một điều kiện dưới đây'}
          </span>
          {onRemove && (
            <button onClick={onRemove} title="Xóa nhóm" style={{ marginLeft:'auto', background:'none', border:'none', cursor:'pointer', color:'var(--danger)', fontSize:12, fontWeight:600 }}>✕ Xóa nhóm</button>
          )}
        </div>

        {/* Nội dung nhóm: đường kẻ dọc màu (3px) + thụt lề, mỗi điều kiện bọc ô nền */}
        <div style={{ borderLeft:`3px solid ${logicColor}`, paddingLeft:16, marginLeft:6, display:'flex', flexDirection:'column', gap:8 }}>
          {node.children.map((child, i) => (
            <div key={i}>
              {i > 0 && (
                <div style={{ fontSize:10, fontWeight:800, color:logicColor, padding:'1px 0 3px', letterSpacing:'.06em' }}>{opWord(node.logic)}</div>
              )}
              {isGroup(child) ? (
                <RuleGroup node={child} path={[...path, i]} depth={depth+1} onRemove={() => removeChildAt(path, i)} />
              ) : (
                <div style={{ background:'var(--bg-2)', border:'1px solid var(--line)', borderRadius:8, padding:'8px 10px' }}>
                  <div className="rule-row">
                    <select value={child.field} onChange={e => setLeafAt(path, i, { field:e.target.value })} style={{ flex:2, fontSize:12 }}>
                      {FIELDS.map(f => <option key={f}>{f}</option>)}
                    </select>
                    <select value={child.op} onChange={e => setLeafAt(path, i, { op:e.target.value })} style={{ flex:1, fontSize:12 }}>
                      {OPS.map(o => <option key={o}>{o}</option>)}
                    </select>
                    <input value={child.value} onChange={e => setLeafAt(path, i, { value:e.target.value })} placeholder="Giá trị" style={{ flex:2, fontSize:12 }} />
                    <button onClick={() => removeChildAt(path, i)} style={{ background:'none', border:'none', cursor:'pointer', color:'var(--danger)' }}><Icon name="trash" /></button>
                  </div>
                </div>
              )}
            </div>
          ))}
          {node.children.length === 0 && (
            <div style={{ fontSize:12, color:'var(--muted)', fontStyle:'italic', padding:'4px 0' }}>Nhóm trống — thêm điều kiện hoặc xóa nhóm.</div>
          )}

          {/* Nút thêm trong nhóm */}
          <div className="flex gap-2" style={{ marginTop:2 }}>
            <button onClick={() => addLeafTo(path)} style={{ fontSize:12, fontWeight:600, padding:'5px 12px', background:'var(--bg)', border:'1px dashed var(--border)', borderRadius:7, cursor:'pointer', color:'var(--text-2)', display:'inline-flex', alignItems:'center', gap:4 }}>
              <Icon name="plus" /> Điều kiện
            </button>
            {depth < MAX_DEPTH - 1 && (
              <button onClick={() => addGroupTo(path)} style={{ fontSize:12, fontWeight:600, padding:'5px 12px', background:'var(--bg)', border:'1px dashed var(--border)', borderRadius:7, cursor:'pointer', color:'var(--text-2)', display:'inline-flex', alignItems:'center', gap:4 }}>
                <Icon name="plus" /> Nhóm con
              </button>
            )}
            {depth >= MAX_DEPTH - 1 && (
              <span style={{ fontSize:11, color:'var(--muted)', alignSelf:'center' }}>Đã đạt tối đa {MAX_DEPTH} tầng lồng</span>
            )}
          </div>
        </div>
      </div>
    );
  };

  return (
    <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
      {modal && (
        <div className="modal-overlay" onClick={() => setModal(false)}>
          <div className="modal-box" onClick={e => e.stopPropagation()}>
            <div style={{ fontSize:16, fontWeight:700, marginBottom:8 }}>✅ Phân khúc đã được lưu</div>
            <div style={{ fontSize:13, color:'#6B7280', marginBottom:16 }}>Phân khúc "{segName||'Không có tên'}" đã được tạo và sẽ cập nhật tự động mỗi ngày.</div>
            <button onClick={() => { setModal(false); setView('list'); }} className="btn-primary" style={{ width:'100%', padding:'10px', fontSize:14 }}>
              Đóng
            </button>
          </div>
        </div>
      )}

      <div className="flex items-center justify-between">
        <div style={{ fontWeight:700, fontSize:16 }}>
          {view==='detail' && selectedSeg!==null
            ? <span><button onClick={() => setView('list')} style={{ background:'none', border:'none', color:'#6B7280', cursor:'pointer', fontSize:13, padding:0, marginRight:6 }}>← Danh sách phân khúc</button>{SEGMENTS[selectedSeg]?.name}</span>
            : view==='builder'
              ? <span><button onClick={() => setView('list')} style={{ background:'none', border:'none', color:'#6B7280', cursor:'pointer', fontSize:13, padding:0, marginRight:6 }}>← Danh sách phân khúc</button>Tạo phân khúc mới</span>
              : 'Danh sách phân khúc'}
        </div>
        {view==='list' && (
          <button onClick={() => setView('builder')} className="btn-primary" style={{ padding:'8px 16px', fontSize:13 }}>+ Tạo phân khúc</button>
        )}
      </div>

      {view === 'list' && (
        <div className="panel">
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
            <thead>
              <tr style={{ borderBottom:'1px solid #E5E7EB' }}>
                {['Tên phân khúc','Điều kiện','Loại','Cập nhật','Trạng thái',''].map(h => (
                  <th key={h} style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#6B7280' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {SEGMENTS.map((s,i) => (
                <tr key={i} className="table-row" onClick={() => { setSelectedSeg(i); setView('detail'); }} style={{ borderBottom:'1px solid #F3F4F6', cursor:'pointer' }}>
                  <td style={{ padding:'10px 12px', fontWeight:700 }}>{s.name}</td>
                  <td style={{ padding:'10px 12px', fontSize:12, color:'#6B7280', maxWidth:260 }}>{s.desc}</td>
                  <td style={{ padding:'10px 12px' }}>
                    <span className="badge badge-blue" title="Tự động cập nhật hàng ngày theo điều kiện">{s.type}</span>
                  </td>
                  <td style={{ padding:'10px 12px', color:'#6B7280', fontSize:12 }}>{s.updated}</td>
                  <td style={{ padding:'10px 12px' }}>
                    <button onClick={e => { e.stopPropagation(); toggleStatus(i); }} style={{ padding:'4px 12px', background: statuses[i]==='Đang hoạt động' ? '#dcfce7' : '#F3F4F6', color: statuses[i]==='Đang hoạt động' ? '#16A34A' : '#6B7280', border:'none', borderRadius:6, fontSize:12, fontWeight:600, cursor:'pointer' }}>
                      {statuses[i]==='Đang hoạt động' ? '● Đang hoạt động' : '○ Tạm dừng'}
                    </button>
                  </td>
                  <td style={{ padding:'10px 12px' }} onClick={e => e.stopPropagation()}>
                    <button onClick={() => onViewKH && onViewKH(s.name)} style={{ padding:'4px 10px', background:'#EFF6FF', color:'#2563EB', border:'none', borderRadius:6, fontSize:12, fontWeight:600, cursor:'pointer' }}>Xem KH</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {view === 'builder' && (
        <div style={{ display:'grid', gridTemplateColumns:'1.3fr 1fr', gap:16 }}>
          <div className="panel" style={{ padding:20 }}>
            <div style={{ marginBottom:14 }}>
              <label className="field-label">Tên phân khúc</label>
              <input value={segName} onChange={e=>setSegName(e.target.value)} placeholder="VD: Khách hàng nguy cơ rời bỏ Q3" style={{ width:'100%', marginTop:4 }} />
            </div>
            <div style={{ marginBottom:14 }}>
              <label className="field-label">Mô tả</label>
              <input placeholder="Mô tả ngắn gọn mục tiêu phân khúc..." style={{ width:'100%', marginTop:4 }} />
            </div>

            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12, marginBottom:14 }}>
              <div>
                <label className="field-label">Loại phân khúc</label>
                <select value={segType} onChange={e=>setSegType(e.target.value)} style={{ width:'100%', marginTop:4, fontSize:12 }}>
                  <option>Phân khúc động</option>
                  <option>Phân khúc tĩnh</option>
                </select>
              </div>
              <div>
                <label className="field-label">Mảng dịch vụ trọng tâm</label>
                <select value={segPillar} onChange={e=>setSegPillar(e.target.value)} style={{ width:'100%', marginTop:4, fontSize:12 }}>
                  <option value="ALL">Tất cả mảng</option>
                  {PILLARS.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
                </select>
              </div>
              <div>
                <label className="field-label">Tần suất cập nhật</label>
                <select value={segFreq} onChange={e=>setSegFreq(e.target.value)} style={{ width:'100%', marginTop:4, fontSize:12 }}>
                  <option>Hàng ngày lúc 02:00</option>
                  <option>Mỗi giờ</option>
                  <option>Thời gian thực</option>
                  <option>Thủ công</option>
                </select>
              </div>
            </div>

            <div className="flex items-center justify-between mb-3">
              <div style={{ fontWeight:700, fontSize:13 }}>Điều kiện lọc (hỗ trợ nhóm lồng AND/OR)</div>
              <span style={{ fontSize:11, color:'var(--muted)' }}>Tối đa {MAX_DEPTH} tầng</span>
            </div>

            {/* Câu tóm tắt tự sinh — đọc là hiểu toàn bộ điều kiện */}
            <div style={{ fontSize:13, lineHeight:1.7, background:'var(--info-soft)', border:'1px solid #bfdbfe', borderRadius:10, padding:'10px 14px', marginBottom:14 }}>
              <span style={{ fontSize:11, color:'var(--muted)', fontWeight:600, display:'block', marginBottom:2 }}>PHÂN KHÚC NÀY LẤY KHÁCH HÀNG THOẢ:</span>
              {summarize(ruleTree, true)}
            </div>

            <RuleGroup node={ruleTree} path={[]} depth={0} onRemove={null} />

            <div className="flex gap-3 mt-5">
              <button onClick={() => setView('list')} className="btn-ghost" style={{ flex:1, padding:'10px', fontSize:13 }}>
                Hủy
              </button>
              <button onClick={() => setPreviewCount(8560)} className="btn-ghost" style={{ flex:1, padding:'10px', fontSize:13 }}>
                Ước tính số KH
              </button>
              <button onClick={() => setModal(true)} className="btn-primary" style={{ flex:2, padding:'10px', fontSize:13 }}>
                Lưu phân khúc
              </button>
            </div>
          </div>

          {/* Xem trước kết quả */}
          <div className="panel" style={{ padding:20 }}>
            <div style={{ fontWeight:700, fontSize:15, marginBottom:16 }}>Xem trước kết quả</div>
            {previewCount !== null ? (
              <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                <div className="kpi-card">
                  <div className="field-label" style={{ margin:0 }}>Quy mô dự kiến</div>
                  <div style={{ fontSize:24, fontWeight:800, marginTop:4 }} className="tabular-nums">{previewCount.toLocaleString()}</div>
                  <div style={{ fontSize:12, color:'#6B7280', marginTop:2 }}>khách hàng khớp điều kiện · tăng khoảng +6,2% trong 30 ngày gần nhất</div>
                </div>
                <div className="kpi-card">
                  <div className="field-label" style={{ margin:0 }}>Kênh kích hoạt phù hợp</div>
                  <div style={{ fontSize:14, fontWeight:700, marginTop:4 }}>SMS · Zalo OA · Tác vụ CRM</div>
                  <div style={{ fontSize:12, color:'#6B7280', marginTop:2 }}>Đã lọc theo trạng thái Đồng ý dữ liệu tại tab Consent của từng khách hàng</div>
                </div>
                <div className="kpi-card">
                  <div className="field-label" style={{ margin:0 }}>Top hành vi chung</div>
                  <div style={{ fontSize:13, fontWeight:600, marginTop:4 }}>
                    {segPillar !== 'ALL' && segPillar.includes('BCCP') ? 'COD cao · gửi đơn đều · có cửa hàng online' : 'Tương tác thường xuyên trên App/Web · phát sinh giao dịch gần đây'}
                  </div>
                </div>
                <div style={{ padding:'10px 12px', background:'#FFFBEB', border:'1px solid #FDE68A', borderRadius:8, fontSize:12, color:'#92400E' }}>
                  Khuyến nghị: kiểm tra lại Consent trước khi kích hoạt chiến dịch cho phân khúc này.
                </div>
              </div>
            ) : (
              <div style={{ textAlign:'center', padding:'28px 12px', color:'#6B7280', fontSize:13 }}>
                Bấm <strong>"Ước tính số KH"</strong> để xem trước quy mô và kênh kích hoạt phù hợp.
              </div>
            )}

            <div className="section-title mt-4">Phân khúc đang hoạt động</div>

              {SEGMENTS.filter(s => s.status === 'Đang hoạt động').slice(0,4).map((s,i) => (
                <div key={i} style={{ display:'flex', justifyContent:'space-between', padding:'7px 0', borderBottom:'1px solid #F3F4F6', fontSize:12 }}>
