                  <span style={{ fontWeight:700 }} className="tabular-nums">{s.count}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {view === 'detail' && selectedSeg !== null && (() => {
        const s = SEGMENTS[selectedSeg];
        const seg_idx = selectedSeg;
        // Mock rules theo phân khúc — dạng CÂY NHÓM LỒNG (logic + children).
        const mockRules = {
          'Khách hàng trung thành':   { logic:'AND', children:[ { field:'Nhóm RFM', op:'=', value:'Champions' }, { field:'Điểm rời bỏ', op:'<', value:'30' } ] },
          'KHL giá trị cao':          { logic:'AND', children:[ { field:'Nhóm khách hàng', op:'=', value:'KHL' }, { field:'Tổng doanh thu', op:'≥', value:'1.000.000.000' } ] },
          // Ví dụ lồng nhiều cấp: nguy cơ rời bỏ HOẶC (giá trị cao mà lâu không giao dịch)
          'Có nguy cơ rời bỏ':        { logic:'OR', children:[
                                          { field:'Điểm rời bỏ', op:'≥', value:'70' },
                                          { logic:'AND', children:[ { field:'Tổng doanh thu', op:'≥', value:'500.000.000' }, { field:'Ngày GD gần nhất', op:'<', value:'90 ngày trước' } ] },
                                        ] },
          'Tỷ lệ hoàn cao':           { logic:'AND', children:[ { field:'Tỷ lệ hoàn', op:'>', value:'20%' }, { field:'Tổng đơn', op:'≥', value:'50' } ] },
          'Chủ shop hoạt động cao':   { logic:'AND', children:[ { field:'Vai trò', op:'chứa', value:'SHOP_OWNER' }, { field:'Tổng đơn / tháng', op:'≥', value:'50' } ] },
          'Khách hàng mới':           { logic:'AND', children:[ { field:'Ngày GD đầu tiên', op:'>', value:'30 ngày trước' } ] },
        };
        const ruleTreeDetail = mockRules[s.name] || { logic:'AND', children:[] };

        // Render read-only cây điều kiện (khung viền lồng, không cho sửa)
        // Read-only cây điều kiện — layout thụt lề đồng bộ với builder
        const RuleView = ({ node, depth }) => {
          const lc = node.logic === 'AND' ? '#8a5a00' : 'var(--info)';
          const word = node.logic === 'AND' ? 'VÀ' : 'HOẶC';
          return (
            <div>
              <div style={{ fontSize:10, fontWeight:800, color:lc, marginBottom:6, letterSpacing:'.04em' }}>{node.logic === 'AND' ? 'KHỚP TẤT CẢ (AND)' : 'KHỚP BẤT KỲ (OR)'}</div>
              <div style={{ borderLeft:`2px solid ${lc}`, paddingLeft:14, marginLeft:4, display:'flex', flexDirection:'column', gap:6 }}>
                {node.children.map((c,i) => (
                  <div key={i}>
                    {i > 0 && <div style={{ fontSize:9, fontWeight:800, color:lc, padding:'1px 0' }}>{word}</div>}
                    {Array.isArray(c.children) ? <RuleView node={c} depth={depth+1} /> : (
                      <div style={{ display:'flex', alignItems:'center', gap:8, padding:'6px 10px', background:'#F7F8FA', border:'1px solid var(--line)', borderRadius:6, fontSize:13 }}>
                        <span style={{ fontWeight:600, color:'#1A1A1A' }}>{c.field}</span>
                        <span style={{ color:'#6B7280' }}>{c.op}</span>
                        <span style={{ color:'#2563EB', fontWeight:600 }}>{c.value}</span>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          );
        };
        // Câu tóm tắt tiếng Việt cho màn chi tiết (dùng lại summarize của builder)
        const summarizeDetail = (n) => {
          if (!Array.isArray(n.children)) return <span><b>{n.field}</b> {n.op} <span style={{ color:'var(--info)', fontWeight:700 }}>{n.value}</span></span>;
          const w = n.logic === 'AND' ? 'VÀ' : 'HOẶC';
          const c = n.logic === 'AND' ? '#8a5a00' : 'var(--info)';
          const parts = [];
          n.children.forEach((ch,i) => {
            if (i>0) parts.push(<span key={'o'+i} style={{ color:c, fontWeight:800 }}> {w} </span>);
            const inner = summarizeDetail(ch);
            parts.push(Array.isArray(ch.children) ? <span key={'g'+i}>({inner})</span> : <span key={'l'+i}>{inner}</span>);
          });
          return <span>{parts}</span>;
        };

        return (
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
            {/* Row 1: Thông tin + Điều kiện */}
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
              {/* Thông tin chung */}
              <div className="panel" style={{ padding:20 }}>
                <div className="section-title">Thông tin phân khúc</div>
                {[
                  ['Tên', s.name],
                  ['Loại', s.type],
                  ['Số KH hiện tại', s.count + ' KH'],
                  ['Cập nhật lần cuối', s.updated],
                  ['Trạng thái', statuses[seg_idx]],
                ].map(([l,v]) => (
                  <div key={l} style={{ display:'flex', justifyContent:'space-between', padding:'7px 0', borderBottom:'1px solid #F3F4F6' }}>
                    <span style={{ fontSize:12, color:'#6B7280' }}>{l}</span>
                    <span style={{ fontSize:13, fontWeight:600 }}>{v}</span>
                  </div>
                ))}
                <div style={{ marginTop:12, fontSize:12, color:'#6B7280', lineHeight:1.6 }}>{s.desc}</div>
              </div>

              {/* Điều kiện lọc — cây nhóm lồng */}
              <div className="panel" style={{ padding:20 }}>
                <div className="section-title">Điều kiện lọc</div>
                {ruleTreeDetail.children.length > 0 ? (
                  <>
                    <div style={{ fontSize:13, lineHeight:1.7, background:'var(--info-soft)', border:'1px solid #bfdbfe', borderRadius:10, padding:'10px 14px', marginBottom:12 }}>
                      <span style={{ fontSize:11, color:'var(--muted)', fontWeight:600, display:'block', marginBottom:2 }}>LẤY KHÁCH HÀNG THOẢ:</span>
                      {summarizeDetail(ruleTreeDetail)}
                    </div>
                    <div style={{ marginTop:4 }}><RuleView node={ruleTreeDetail} depth={0} /></div>
                  </>
                ) : (
                  <div style={{ fontSize:12, color:'var(--muted)', marginTop:4 }}>Chưa có điều kiện.</div>
                )}
                <div style={{ marginTop:16 }}>
                  <button onClick={() => setView('builder')} style={{ padding:'7px 16px', background:'#f3f4f6', border:'none', borderRadius:7, fontSize:12, fontWeight:600, cursor:'pointer', color:'#1A1A1A' }}>
                    Chỉnh sửa điều kiện
                  </button>
                </div>
              </div>
            </div>

          </div>
        );
      })()}
    </div>
  );
}

// ============================================================
// MÀN ĐỐI SOÁT ĐỊNH DANH — danh sách KH đang có mã nghi trùng chờ xác nhận (trước merge)
// Đây là "hàng đợi công việc" của Data Steward, tách khỏi Danh sách KH (khai thác sau merge).
// ============================================================
function SuspectListScreen({ onReview }) {
  const [search, setSearch] = React.useState('');
  const rows = CUSTOMERS
    .filter(c => suspectCount(c.uid) > 0)
    .map(c => {
      const frags = suspectFragments(c.uid);
      const anchor = anchorFragment(c.uid);
      const maxConf = Math.max(...frags.map(f => f.confidence));
      const strong = frags.filter(f => f.confidence >= CONF_LOW).length;
      const weak = frags.filter(f => f.confidence < CONF_LOW).length;
      const keys = [...new Set(frags.map(f => f.matchKey.split('·')[0].trim().replace(/\s+\d.*$/, '').trim()))].slice(0,3);
      return { ...c, anchor, count: frags.length, maxConf, strong, weak, keys };
    })
    .filter(r => {
      const q = search.toLowerCase();
      return !q || r.name.toLowerCase().includes(q) || (r.anchor?.sourceId||'').toLowerCase().includes(q) || r.phone.includes(q);
    })
    .sort((a,b) => b.maxConf - a.maxConf);

  const confBadge = (c) => (
    <span className="badge" style={{ background:'var(--warn-soft)', color:'#8a5a00' }}>{c}%</span>
  );

  return (
    <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
      {/* Giải thích ngắn */}
      <div className="panel" style={{ padding:'14px 16px', display:'flex', gap:12, alignItems:'center', flexWrap:'wrap' }}>
        <div style={{ fontSize:12, color:'var(--muted)', lineHeight:1.6, flex:1, minWidth:260 }}>
          Mỗi dòng là một <b>hồ sơ gốc</b> đang có các mã định danh khác nghi trùng, <b>chưa hợp nhất</b> (mã định danh CDP chỉ sinh sau khi gộp).
          Hệ thống tự động gộp mã có <b>độ tin cậy ≥ {CONF_AUTO}%</b> (khóa mạnh: MST, CCCD, PostID);
          mã <b>{CONF_LOW}–{CONF_AUTO-1}%</b> cần bạn xác nhận; mã <b>dưới {CONF_LOW}%</b> chỉ là gợi ý tin cậy thấp.
        </div>
        <div className="flex items-center gap-2" style={{ background:'var(--bg)', border:'1px solid var(--border)', borderRadius:10, padding:'7px 13px', minWidth:220 }}>
          <Icon name="search" />
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Tìm mã hồ sơ gốc, tên, SĐT..." style={{ border:'none', background:'transparent', outline:'none', fontSize:13, width:'100%', padding:0 }} />
        </div>
      </div>

      {/* Bảng danh sách nghi trùng */}
      <div className="panel">
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
            <thead>
              <tr style={{ borderBottom:'1px solid var(--border)' }}>
                {['Hồ sơ gốc (mã nguồn)','Tên / Công ty','Loại','Số mã chờ','Tin cậy cao nhất','Khóa khớp nổi bật',''].map(h => (
                  <th key={h} style={{ padding:'10px 12px', textAlign:'left', fontSize:11, fontWeight:800, color:'var(--muted)', whiteSpace:'nowrap', background:'var(--bg-2)', letterSpacing:'.03em' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r,i) => (
                <tr key={i} className="table-row" onClick={() => onReview(r.uid)} style={{ borderBottom:'1px solid #F3F4F6', cursor:'pointer' }}>
                  <td style={{ padding:'10px 12px' }}>
                    <div style={{ fontFamily:'monospace', fontSize:11, color:'#374151', fontWeight:600 }}>{r.anchor?.sourceId || '—'}</div>
                    <div style={{ fontSize:10, color:'var(--muted)', marginTop:2 }}>nguồn {r.anchor?.source || '—'} · hồ sơ gốc</div>
                  </td>
                  <td style={{ padding:'10px 12px', fontWeight:600, color:'#2563EB' }}>{r.name}</td>
                  <td style={{ padding:'10px 12px' }}>
                    <span className={`badge ${r.type==='INDIVIDUAL' ? 'badge-blue':'badge-purple'}`}>{r.type==='INDIVIDUAL' ? 'Cá nhân':'Doanh nghiệp'}</span>
                  </td>
                  <td style={{ padding:'10px 12px' }}>
                    <div className="flex items-center gap-1 flex-wrap">
                      {r.strong > 0 && <span className="badge" style={{ background:'var(--warn-soft)', color:'#8a5a00' }}>⚠ {r.strong} chờ xác nhận</span>}
                      {r.weak > 0 && <span className="badge badge-gray" style={{ borderStyle:'dashed' }}>{r.weak} tin cậy thấp</span>}
                    </div>
                  </td>
                  <td style={{ padding:'10px 12px' }}>{confBadge(r.maxConf)}</td>
                  <td style={{ padding:'10px 12px', fontSize:12, color:'var(--text-2)' }}>{r.keys.join(' · ')}</td>
                  <td style={{ padding:'10px 12px', textAlign:'right', whiteSpace:'nowrap' }}>
                    <button onClick={(e) => { e.stopPropagation(); onReview(r.uid); }}
                      style={{ fontSize:12, fontWeight:700, border:'none', borderRadius:8, padding:'6px 14px', background:'var(--brand)', color:'#1A1A1A', cursor:'pointer' }}>
                      Xử lý →
                    </button>
                  </td>
                </tr>
              ))}
              {rows.length === 0 && (
                <tr><td colSpan={7} style={{ padding:40, textAlign:'center', color:'var(--muted)' }}>Không có khách hàng nào đang nghi trùng.</td></tr>
              )}
            </tbody>
          </table>
        </div>
        <div style={{ padding:'10px 16px', borderTop:'1px solid #F3F4F6', fontSize:12, color:'#6B7280' }}>
          {rows.length} khách hàng đang có mã định danh nghi trùng
        </div>
      </div>
    </div>
  );
}

// ============================================================
// MÀN ĐỐI CHIẾU & XÁC NHẬN MERGE (mở khi bấm "Xử lý" ở màn Đối soát định danh)
// Layout PA1: bảng so sánh theo cột — mỗi mã KH là 1 cột, mỗi field là 1 hàng.
// ============================================================
function MergeReviewScreen({ uid, onBack }) {
  const cust = CUSTOMERS.find(c => c.uid === uid) || {};
  const kh = KH_DETAIL[uid];
  const allFragments = suspectFragments(uid);
  const anchor = anchorFragment(uid);
  // Trước khi hợp nhất chưa có mã định danh CDP chung — hiển thị mã nguồn của HỒ SƠ GỐC (anchor)
  // để làm điểm neo. Mã CDP chỉ sinh sau khi bấm xác nhận gộp.
  const hasGolden = Array.isArray(kh?.sourcesData) && kh.sourcesData.some(s => s.mergeStatus === 'AUTO_MERGED');

  // Mỗi mã nguồn có 1 lựa chọn "gộp vào hồ sơ chuẩn" (checkbox). Mặc định:
  // - mảnh 60–89% (nên xác nhận): tick sẵn
  // - mảnh <60% (tin cậy thấp): KHÔNG tick sẵn — chỉ gộp nếu người dùng chủ động chọn
  const [included, setIncluded] = React.useState(() => {
    const init = {};
    allFragments.forEach(f => { init[f.sourceId] = f.confidence >= CONF_LOW; });
    return init;
  });
  const toggle = (sourceId) => setIncluded(m => ({ ...m, [sourceId]: !m[sourceId] }));

  // Kết quả cuối cùng của cả nhóm: null (chưa quyết) / 'merged' / 'notsame'
  const [result, setResult] = React.useState(null);
  // Bước xem trước hồ sơ chuẩn dự kiến trước khi gộp
  const [showPreview, setShowPreview] = React.useState(false);

  // Các mảnh đã auto-merge (khóa mạnh ≥90%) — chỉ để hiển thị, không hỏi lại.
  const autoMerged = (kh && Array.isArray(kh.sourcesData))
    ? kh.sourcesData.filter(s => s.mergeStatus === 'AUTO_MERGED')
    : [];

  const selectedFragments = allFragments.filter(f => included[f.sourceId]);
  const selectedCount = selectedFragments.length;

  // ── Suy ra HỒ SƠ CHUẨN DỰ KIẾN sau khi gộp ──
  // Gom mảnh đã tick + mảnh auto-merged (nếu KH đã có hồ sơ chuẩn). Chỉ preview nhóm ĐỊNH DANH
  // và ĐỊA CHỈ (giao dịch/tài chính do BE cộng dồn, không cần duyệt khi merge). Mỗi field: lấy
  // giá trị từ nguồn tin cậy cao nhất có dữ liệu; ≥2 nguồn khác giá trị → đánh dấu xung đột.
  const PREVIEW_SECTIONS = [
    { title:'Định danh', group:'dinh_danh', fields:[
      ['ten','Tên'],['sdt','SĐT'],['email','Email'],['cccd','CCCD / MST'],
      ['gioiTinh','Giới tính'],['ngaySinh','Ngày sinh'],['postId','PostID'] ] },
    { title:'Địa chỉ', group:'dia_chi', fields:[
      ['guiHang','Địa chỉ gửi'],['nhanHang','Địa chỉ nhận'],['vpostcode','VPostCode'] ] },
  ];

  // Lấy object nguồn gốc (có đủ nhóm dinh_danh/dia_chi) cho các mã trong pool.
  // KH có KH_DETAIL: dùng trực tiếp sourcesData. KH demo: chỉ có field phẳng nên map tạm vào dinh_danh.
  const rawSourceById = {};
  if (kh && Array.isArray(kh.sourcesData)) {
    kh.sourcesData.forEach(s => { rawSourceById[s.sourceId] = s; });
  }
  const buildPool = () => {
    const ids = [...autoMerged.map(s=>s.sourceId), ...selectedFragments.map(f=>f.sourceId)];
    return ids.map(id => {
      const raw = rawSourceById[id];
      if (raw) return raw;
      // KH demo: dựng object tối giản từ field phẳng
      const f = allFragments.find(x => x.sourceId === id) || {};
      return { source:f.source, sourceId:id, confidence:f.confidence,
               dinh_danh:{ ten:f.ten, sdt:f.sdt, email:f.email, cccd:f.cccd },
               dia_chi:{} };
    }).sort((a,b) => (b.confidence||0) - (a.confidence||0));
  };
  const buildPreview = () => {
    const pool = buildPool();
    return PREVIEW_SECTIONS.map(sec => ({
      title: sec.title,
      rows: sec.fields.map(([key,label]) => {
        const vals = pool.filter(p => p[sec.group] && p[sec.group][key] && p[sec.group][key] !== '—');
        if (vals.length === 0) return { label, value:'—', source:'—', conflict:false };
        const chosen = vals[0];
        const distinct = [...new Set(vals.map(v => v[sec.group][key]))];
        return { label, value: chosen[sec.group][key], source: chosen.source, conflict: distinct.length > 1,
                 others: vals.filter(v => v[sec.group][key] !== chosen[sec.group][key]).map(v => `${v[sec.group][key]} (${v.source})`) };
      }),
    }));
  };

  // Nhóm số liệu CỘNG DỒN (giao dịch/tài chính) — không "chọn 1 nguồn thắng" mà cộng lại từ mọi nguồn.
  const parseNum = (s) => { const n = parseInt(String(s ?? '').replace(/[^\d]/g,''),10); return isNaN(n) ? 0 : n; };
  const fmtVND = (n) => n.toLocaleString('vi-VN');
  const buildSumRows = () => {
    const pool = buildPool();
    const SUM_FIELDS = [
      ['giao_dich','tongDon','Tổng đơn', v => v.toLocaleString('vi-VN')],
      ['giao_dich','doanhThu','Doanh thu 12 tháng', v => fmtVND(v)+' ₫'],
      ['giao_dich','cod','Tổng COD', v => fmtVND(v)+' ₫'],
      ['tai_chinh','congNo','Công nợ', v => fmtVND(v)+' ₫'],
    ];
    return SUM_FIELDS.map(([group,key,label,fmt]) => {
      const contrib = pool
        .filter(p => p[group] && p[group][key] && p[group][key] !== '—')
        .map(p => ({ source:p.source, raw:p[group][key], num:parseNum(p[group][key]) }))
        .filter(c => c.num > 0);
      const total = contrib.reduce((s,c) => s + c.num, 0);
      return { label, total: total > 0 ? fmt(total) : '—',
               contrib: contrib.map(c => `${c.raw} (${c.source})`) };
    }).filter(r => r.total !== '—');
  };
  const previewSections = showPreview ? buildPreview() : [];
  const sumRows = showPreview ? buildSumRows() : [];
  const hasConflict = previewSections.some(s => s.rows.some(r => r.conflict));

  // Bảng so sánh cột cho một tập mảnh — mỗi cột có checkbox chọn gộp
  const CompareTable = ({ fragments }) => {
    const fields = [
      ['Độ tin cậy', f => <span className="badge" style={{ background:'var(--warn-soft)', color:'#8a5a00' }}>{f.confidence}%</span>],
      ['Nguồn', f => f.source],
      ['Mã KH nguồn', f => <span style={{ fontFamily:'monospace', fontSize:11 }}>{f.sourceId}</span>],
      ['Tên', f => f.ten],
      ['SĐT', f => f.sdt],
      ['Email', f => f.email],
      ['CCCD / MST', f => f.cccd],
      ['Khóa khớp', f => f.matchKey],
      ['Đóng góp thêm', f => f.contribution],
    ];
    const dim = (f) => {
      if (result) return .5;
      if (!included[f.sourceId]) return .45;         // bỏ tick → mờ
      return f.confidence < CONF_LOW ? .7 : 1;        // mã tin cậy thấp (dù tick) vẫn hơi mờ để cảnh báo
    };
    return (
      <div style={{ overflowX:'auto', border:'1px solid var(--border)', borderRadius:10 }}>
        <table style={{ borderCollapse:'collapse', fontSize:12.5, width:'100%', minWidth:520 }}>
          <thead>
            {/* Hàng checkbox chọn gộp */}
            <tr>
              <th style={{ position:'sticky', left:0, zIndex:2, background:'var(--bg-2)', padding:'9px 11px', textAlign:'left', fontSize:11, fontWeight:700, color:'var(--muted)', borderBottom:'1px solid var(--border)', borderRight:'1px solid var(--border)', minWidth:110 }}>Gộp mã này?</th>
              {fragments.map(f => (
                <th key={f.sourceId} style={{ padding:'9px 11px', textAlign:'left', borderBottom:'1px solid var(--border)', whiteSpace:'nowrap' }}>
                  <label style={{ display:'inline-flex', alignItems:'center', gap:6, cursor: result ? 'default' : 'pointer', fontSize:11, fontWeight:700, color: included[f.sourceId] ? 'var(--success)' : 'var(--muted)' }}>
                    <input type="checkbox" checked={!!included[f.sourceId]} disabled={!!result} onChange={() => toggle(f.sourceId)} />
                    {included[f.sourceId] ? 'Gộp' : 'Bỏ'}
                  </label>
                </th>
              ))}
            </tr>
            {/* Hàng tên nguồn */}
            <tr>
              <th style={{ position:'sticky', left:0, zIndex:2, background:'var(--bg-2)', padding:'9px 11px', textAlign:'left', fontSize:11, fontWeight:800, color:'var(--text-2)', borderBottom:'1px solid var(--border)', borderRight:'1px solid var(--border)' }}></th>
              {fragments.map(f => (
                <th key={f.sourceId} style={{ padding:'9px 11px', textAlign:'left', fontSize:11, fontWeight:800, color:'var(--text-2)', borderBottom:'1px solid var(--border)', whiteSpace:'nowrap', opacity: dim(f) }}>
                  <div>{f.source}</div>
                  {f.confidence < CONF_LOW && (
                    <span className="badge badge-gray" style={{ marginTop:3, borderStyle:'dashed', fontWeight:600 }}>tin cậy thấp</span>
                  )}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {fields.map(([label, render], ri) => (
              <tr key={ri}>
                <td style={{ position:'sticky', left:0, zIndex:1, background:'var(--bg-2)', padding:'8px 11px', fontSize:11, fontWeight:700, color:'var(--muted)', borderRight:'1px solid var(--border)', borderBottom:'1px solid var(--line)', whiteSpace:'nowrap' }}>{label}</td>
                {fragments.map(f => (
                  <td key={f.sourceId} style={{ padding:'8px 11px', borderBottom:'1px solid var(--line)', opacity: dim(f) }}>
                    {render(f)}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  };

  return (
    <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
      <button onClick={onBack} style={{ alignSelf:'flex-start', background:'#f3f4f6', border:'none', borderRadius:6, padding:'6px 12px', fontSize:13, cursor:'pointer' }}>
        ← Quay lại đối soát định danh
      </button>

      {/* Hồ sơ chuẩn + đã tự gộp */}
      <div className="panel" style={{ padding:20 }}>
        <div style={{ display:'flex', alignItems:'center', gap:12, flexWrap:'wrap' }}>
          <div>
            <div style={{ fontSize:11, color:'var(--muted)', fontWeight:600 }}>ĐỐI CHIẾU HỒ SƠ NGHI TRÙNG</div>
            <div style={{ fontSize:18, fontWeight:800 }}>{cust.name}</div>
            <div style={{ fontSize:12, color:'var(--muted)', fontFamily:'monospace' }}>
              Hồ sơ gốc: {anchor?.sourceId || '—'} <span style={{ fontFamily:'inherit' }}>(nguồn {anchor?.source || '—'})</span>
            </div>
          </div>
        </div>
        <div style={{ fontSize:12, color:'var(--muted)', marginTop:8, lineHeight:1.6 }}>
          Hệ thống nghi các mã nguồn dưới đây là <b>cùng một người</b>. Đối chiếu, bỏ tick mã nào bạn thấy không phải cùng người,
          rồi xác nhận để <b>hợp nhất các mã đã chọn thành một hồ sơ chuẩn</b>. Hồ sơ chuẩn được tạo/cập nhật sau khi bạn xác nhận.
        </div>
        {autoMerged.length > 0 && (
          <div style={{ marginTop:14, paddingTop:14, borderTop:'1px solid var(--border)' }}>
            <div style={{ fontSize:11, color:'var(--muted)', fontWeight:600, marginBottom:6 }}>ĐÃ TỰ ĐỘNG GỘP TỪ KHÓA MẠNH (≥{CONF_AUTO}%)</div>
            <div className="flex gap-2 flex-wrap">
              {autoMerged.map(s => (
                <span key={s.sourceId} className="badge badge-green" title={s.matchKey}>✓ {s.source} {s.sourceId} ({s.confidence}%)</span>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* Bảng đối chiếu gộp chung — mọi mã trong 1 bảng, mã <60% được làm mờ + nhãn "tin cậy thấp" */}
      {allFragments.length > 0 && (
        <div className="panel" style={{ padding:20 }}>
          <div style={{ fontSize:14, fontWeight:800, color:'#8a5a00', marginBottom:4 }}>⚠ {allFragments.length} mã KH nghi trùng — đối chiếu và chọn mã để gộp</div>
          <div style={{ fontSize:12, color:'var(--muted)', marginBottom:12 }}>
            Mã <b>tin cậy {CONF_LOW}–{CONF_AUTO-1}%</b> được tick sẵn để gộp. Mã <b>dưới {CONF_LOW}%</b> (nhãn "tin cậy thấp", làm mờ) khớp yếu — mặc định không gộp, chỉ tick nếu bạn chắc chắn cùng người.
          </div>
          <CompareTable fragments={[...allFragments].sort((a,b) => b.confidence - a.confidence)} />
        </div>
      )}

      {allFragments.length === 0 && (
        <div className="panel" style={{ padding:32, textAlign:'center', color:'var(--muted)' }}>Không còn mã KH nào nghi trùng cho khách hàng này.</div>
      )}

      {/* Thanh hành động chung cho cả nhóm */}
      {allFragments.length > 0 && (
        <div className="panel" style={{ padding:16, position:'sticky', bottom:0, display:'flex', alignItems:'center', gap:12, flexWrap:'wrap', boxShadow:'0 -2px 8px rgba(0,0,0,.04)' }}>
          {result === 'merged' ? (
            <div style={{ fontSize:13, fontWeight:700, color:'var(--success)' }}>
              ✓ Đã hợp nhất {selectedCount} mã {autoMerged.length > 0 ? `vào hồ sơ chuẩn (mã định danh CDP ${uid})` : 'thành một hồ sơ chuẩn mới, hệ thống cấp mã định danh CDP'}. (Mô phỏng — hệ thống thật sẽ chọn hồ sơ master và ưu tiên field theo rule nguồn.)
              <button onClick={() => setResult(null)} style={{ marginLeft:10, fontSize:12, border:'none', background:'none', color:'var(--info)', cursor:'pointer', textDecoration:'underline' }}>Hoàn tác</button>
            </div>
          ) : result === 'notsame' ? (
            <div style={{ fontSize:13, fontWeight:700, color:'var(--muted)' }}>
              Đã đánh dấu <b>không phải cùng người</b> — không gộp mã nào. Cờ nghi trùng của khách hàng này được gỡ.
              <button onClick={() => setResult(null)} style={{ marginLeft:10, fontSize:12, border:'none', background:'none', color:'var(--info)', cursor:'pointer', textDecoration:'underline' }}>Hoàn tác</button>
            </div>
          ) : (
            <>
              <div style={{ fontSize:13, color:'var(--text-2)', flex:1, minWidth:200 }}>
                Đã chọn <b style={{ color:'var(--success)' }}>{selectedCount}</b> / {allFragments.length} mã để hợp nhất.
              </div>
              <button onClick={() => setResult('notsame')}
                style={{ fontSize:13, fontWeight:700, border:'1px solid var(--border)', borderRadius:8, padding:'8px 16px', background:'white', color:'var(--muted)', cursor:'pointer' }}>
                Không phải cùng người
              </button>
              <button onClick={() => setShowPreview(true)} disabled={selectedCount === 0}
                style={{ fontSize:13, fontWeight:800, border:'none', borderRadius:8, padding:'8px 18px', cursor: selectedCount===0 ? 'not-allowed' : 'pointer',
                         background: selectedCount===0 ? 'var(--line)' : 'var(--success)', color: selectedCount===0 ? 'var(--muted)' : 'white' }}>
                Xem trước hồ sơ chuẩn → ({selectedCount} mã)
              </button>
            </>
          )}
        </div>
      )}

      {/* MODAL PREVIEW — hồ sơ chuẩn dự kiến sau khi gộp */}
      {showPreview && (
        <div onClick={() => setShowPreview(false)}
          style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.4)', zIndex:100, display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
          <div onClick={e => e.stopPropagation()}
            style={{ background:'white', borderRadius:14, maxWidth:640, width:'100%', maxHeight:'85vh', overflowY:'auto', boxShadow:'0 12px 40px rgba(0,0,0,.2)' }}>
            <div style={{ padding:'18px 20px', borderBottom:'1px solid var(--border)' }}>
              <div style={{ fontSize:16, fontWeight:800 }}>Xem trước hồ sơ chuẩn sau khi gộp</div>
              <div style={{ fontSize:12, color:'var(--muted)', marginTop:3 }}>
                Hợp nhất {selectedCount} mã{autoMerged.length > 0 ? ` + ${autoMerged.length} mã đã tự gộp` : ''}. Mỗi trường lấy giá trị từ nguồn tin cậy cao nhất. Số liệu giao dịch/tài chính do hệ thống tự cộng dồn.
              </div>
            </div>
            <div style={{ padding:20 }}>
              {previewSections.map((sec, si) => (
                <div key={si} style={{ marginBottom: si < previewSections.length-1 ? 18 : 0 }}>
                  <div className="section-title" style={{ marginBottom:6 }}>{sec.title}</div>
                  <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
                    <thead>
                      <tr style={{ borderBottom:'1px solid var(--border)' }}>
                        {['Trường','Giá trị sau gộp','Lấy từ nguồn',''].map(h => (
                          <th key={h} style={{ padding:'7px 10px', textAlign:'left', fontSize:11, fontWeight:800, color:'var(--muted)' }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {sec.rows.map((r,i) => (
                        <tr key={i} style={{ borderBottom:'1px solid var(--line)' }}>
                          <td style={{ padding:'8px 10px', color:'var(--muted)', fontWeight:600, whiteSpace:'nowrap' }}>{r.label}</td>
                          <td style={{ padding:'8px 10px', fontWeight:700 }}>{r.value}</td>
                          <td style={{ padding:'8px 10px' }}>{r.source !== '—' ? <span className="badge badge-blue">{r.source}</span> : '—'}</td>
                          <td style={{ padding:'8px 10px' }}>
                            {r.conflict && (
                              <span className="badge" style={{ background:'var(--danger-soft)', color:'var(--danger)' }} title={`Nguồn khác: ${(r.others||[]).join(', ')}`}>⚠ Xung đột</span>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              ))}

              {/* Nhóm số liệu cộng dồn — giao dịch / tài chính */}
              {sumRows.length > 0 && (
                <div style={{ marginTop:18 }}>
                  <div className="section-title" style={{ marginBottom:6 }}>Số liệu tổng hợp <span style={{ fontWeight:600, color:'var(--muted)', textTransform:'none', letterSpacing:0 }}>(cộng dồn từ các nguồn)</span></div>
                  <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
                    <thead>
                      <tr style={{ borderBottom:'1px solid var(--border)' }}>
                        {['Chỉ số','Sau gộp (tổng)','Chi tiết cộng dồn'].map(h => (
                          <th key={h} style={{ padding:'7px 10px', textAlign:'left', fontSize:11, fontWeight:800, color:'var(--muted)' }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {sumRows.map((r,i) => (
                        <tr key={i} style={{ borderBottom:'1px solid var(--line)' }}>
                          <td style={{ padding:'8px 10px', color:'var(--muted)', fontWeight:600, whiteSpace:'nowrap' }}>{r.label}</td>
                          <td style={{ padding:'8px 10px', fontWeight:800, color:'var(--success)' }} className="tabular-nums">{r.total}</td>
                          <td style={{ padding:'8px 10px', fontSize:12, color:'var(--muted)' }}>{r.contrib.join('  +  ')}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {hasConflict && (
                <div style={{ marginTop:12, fontSize:12, color:'var(--muted)', background:'var(--danger-soft)', borderRadius:8, padding:'8px 12px' }}>
                  ⚠ Có trường bị xung đột giữa các nguồn. Hệ thống tự ưu tiên nguồn tin cậy cao nhất; di chuột lên nhãn "Xung đột" để xem giá trị khác. (Giai đoạn sau sẽ cho chọn thủ công.)
                </div>
              )}
            </div>
            <div style={{ padding:'14px 20px', borderTop:'1px solid var(--border)', display:'flex', justifyContent:'flex-end', gap:10 }}>
              <button onClick={() => setShowPreview(false)}
                style={{ fontSize:13, fontWeight:700, border:'1px solid var(--border)', borderRadius:8, padding:'8px 16px', background:'white', color:'var(--muted)', cursor:'pointer' }}>
                Quay lại chỉnh
              </button>
              <button onClick={() => { setResult('merged'); setShowPreview(false); }}
                style={{ fontSize:13, fontWeight:800, border:'none', borderRadius:8, padding:'8px 18px', background:'var(--success)', color:'white', cursor:'pointer' }}>
                ✓ Xác nhận hợp nhất {selectedCount} mã
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
// MÀN CẤU HÌNH — RULE HỢP NHẤT ĐỊNH DANH (read-only giai đoạn đầu)
// Hiển thị bộ rule sinh ra cảnh báo ở màn Đối soát định danh + sơ đồ 3 mức ngưỡng.
// ============================================================
function IdentityRuleScreen() {
  const thresholds = [
    { range:`≥ ${CONF_AUTO}%`, title:'Tự động gộp', desc:'Khóa mạnh (CCCD, MST, PostID). Hệ thống hợp nhất ngay, không cần người xác nhận.', color:'var(--success)', bg:'var(--success-soft)' },
    { range:`${CONF_LOW}–${CONF_AUTO-1}%`, title:'Gắn cờ chờ xác nhận', desc:'Khóa yếu (chỉ SĐT, tên gần đúng). Gắn cờ ⚠ ở màn Đối soát định danh, chờ người đối chiếu.', color:'#8a5a00', bg:'var(--warn-soft)' },
    { range:`< ${CONF_LOW}%`, title:'Gợi ý tin cậy thấp', desc:'Khớp rất yếu. Không chủ động đề nghị gộp, chỉ hiện dạng gợi ý tách riêng để cân nhắc.', color:'var(--muted)', bg:'var(--line)' },
  ];

  return (
    <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
      {/* Banner read-only */}
      <div className="panel" style={{ padding:'14px 16px', display:'flex', alignItems:'center', gap:12, flexWrap:'wrap', background:'var(--info-soft)', border:'1px solid #bfdbfe' }}>
        <span style={{ fontSize:20 }}>🔒</span>
        <div style={{ fontSize:12, color:'var(--text-2)', lineHeight:1.6, flex:1, minWidth:240 }}>
          Đây là bộ quy tắc hệ thống đang áp dụng để so khớp và quyết định hợp nhất định danh — cũng là nguồn sinh ra cảnh báo nghi trùng ở màn <b>Đối soát định danh</b>.
          Giai đoạn đầu <b>chỉ hiển thị</b>; việc thêm/sửa rule và điều chỉnh ngưỡng sẽ mở ở giai đoạn sau.
        </div>
      </div>

      {/* Sơ đồ 3 mức ngưỡng */}
      <div className="panel" style={{ padding:20 }}>
        <div className="section-title">Ngưỡng độ tin cậy quyết định hành động</div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))', gap:12 }}>
          {thresholds.map((t,i) => (
            <div key={i} style={{ borderRadius:10, border:`1px solid ${t.color}`, background:t.bg, padding:14 }}>
              <div style={{ fontSize:18, fontWeight:900, color:t.color }} className="tabular-nums">{t.range}</div>
              <div style={{ fontSize:13, fontWeight:800, color:'var(--text)', marginTop:4 }}>{t.title}</div>
              <div style={{ fontSize:12, color:'var(--text-2)', marginTop:4, lineHeight:1.5 }}>{t.desc}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Bảng rule */}
      <div className="panel">
        <div style={{ padding:'16px 20px 4px', display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:8 }}>
          <div className="section-title" style={{ margin:0 }}>Danh sách rule so khớp định danh</div>
          <button disabled title="Giai đoạn sau"
            style={{ fontSize:12, fontWeight:700, border:'1px dashed var(--border)', borderRadius:8, padding:'6px 12px', background:'var(--bg)', color:'var(--muted)', cursor:'not-allowed' }}>
            + Thêm rule (Giai đoạn sau)
          </button>
        </div>
        <div style={{ overflowX:'auto', padding:'8px 20px 16px' }}>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
            <thead>
              <tr style={{ borderBottom:'1px solid var(--border)' }}>
                {['#','Khóa khớp','Trọng số','Ngưỡng tin cậy','Hành động','Diễn giải','Trạng thái',''].map(h => (
                  <th key={h} style={{ padding:'9px 10px', textAlign:'left', fontSize:11, fontWeight:800, color:'var(--muted)', whiteSpace:'nowrap', background:'var(--bg-2)' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {IDENTITY_RULES.map((r,i) => {
                const act = RULE_ACTION[r.action];
                return (
                  <tr key={r.id} style={{ borderBottom:'1px solid var(--line)' }}>
                    <td style={{ padding:'10px', color:'var(--muted)', fontFamily:'monospace', fontSize:11 }}>{r.id}</td>
                    <td style={{ padding:'10px', fontWeight:700, whiteSpace:'nowrap' }}>{r.field}</td>
                    <td style={{ padding:'10px', whiteSpace:'nowrap' }}><span className="badge badge-gray">{r.weight}</span></td>
                    <td style={{ padding:'10px', whiteSpace:'nowrap' }} className="tabular-nums">≥ {r.minConf}%</td>
                    <td style={{ padding:'10px', whiteSpace:'nowrap' }}>
                      <span className="badge" style={{ background:act.bg, color:act.color }}>{act.label}</span>
                    </td>
                    <td style={{ padding:'10px', fontSize:12, color:'var(--text-2)', minWidth:220 }}>{r.note}</td>
                    <td style={{ padding:'10px', whiteSpace:'nowrap' }}><span className="badge badge-green">Đang áp dụng</span></td>
                    <td style={{ padding:'10px', whiteSpace:'nowrap' }}>
                      <button disabled title="Giai đoạn sau" style={{ fontSize:12, border:'none', background:'none', color:'var(--border)', cursor:'not-allowed' }}>Sửa</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div style={{ padding:'10px 20px', borderTop:'1px solid var(--line)', fontSize:12, color:'var(--muted)' }}>
          {IDENTITY_RULES.length} rule đang áp dụng · Thứ tự ưu tiên từ trên xuống (khóa mạnh xét trước)
        </div>
      </div>

      {/* Ghi chú giai đoạn sau */}
      <div style={{ fontSize:12, color:'var(--muted)', lineHeight:1.7, padding:'0 4px' }}>
        <b>Sẽ mở ở giai đoạn sau:</b> thêm/sửa/bật-tắt rule, điều chỉnh ngưỡng số cụ thể, đặt thứ tự ưu tiên khi nhiều rule cùng khớp,
        và <b>rule ưu tiên chọn trường khi gộp</b> (trường nào lấy từ nguồn nào). Mọi thay đổi rule sẽ được ghi nhật ký phục vụ tuân thủ.
      </div>
    </div>
  );
}

// ============================================================
// APP
// ============================================================
function App() {
  const [nav, setNav] = React.useState('dashboard');
  const [c360uid, setC360uid] = React.useState(null);
  const [reviewUid, setReviewUid] = React.useState(null);
  const [segmentNavFilter, setSegmentNavFilter] = React.useState(null);

  const navLabels = {
    dashboard:'Dashboard tổng quan',
    kafka:'Kafka Integration',
    customers:'Danh sách khách hàng',
    suspects:'Đối soát định danh',
    identity:'Đối soát & hợp nhất hồ sơ',
    c360:'Customer 360°',
    review:'Đối chiếu hồ sơ nghi trùng',
    ruleconfig:'Rule hợp nhất định danh',
    segments:'Quản lý phân khúc',
  };

  const goC360 = (uid) => {
    setC360uid(uid);
    setNav('c360');
  };

  const goReview = (uid) => {
    setReviewUid(uid);
    setNav('review');
  };

  const handleNav = (key) => {
    setNav(key);
    if (key !== 'c360') setC360uid(null);
  };

  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden' }}>
      <Sidebar active={nav} onNav={handleNav} />
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
        <Header title={navLabels[nav]} nav={nav} />
        <main style={{ flex:1, overflowY:'auto' }}>
          {nav==='dashboard' && <DashboardScreen />}
          {nav==='kafka'     && <KafkaScreen />}
          {nav==='customers' && <CustomerListScreen onC360={goC360} initSegment={segmentNavFilter} />}
          {nav==='suspects'  && <SuspectListScreen onReview={goReview} />}
          {nav==='identity'  && <IdentityScreen onC360={goC360} />}
          {nav==='c360'      && <Customer360Screen uid={c360uid} onBack={c360uid ? () => setNav('customers') : null} />}
          {nav==='review'    && <MergeReviewScreen uid={reviewUid} onBack={() => setNav('suspects')} />}
          {nav==='ruleconfig' && <IdentityRuleScreen />}
          {nav==='segments'  && <SegmentScreen onViewKH={(seg) => { setSegmentNavFilter(seg); setNav('customers'); }} />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
